/* ─── Insight engine ─────────────────────────────────────────────────────
   Rules, not a model. Every insight is a named rule with an explicit
   threshold, and each one carries the evidence that triggered it so you can
   check the arithmetic yourself.

   Three constraints, learned the hard way in Phase 4:

     · An insight that fires on noise is worse than no insight. Each rule
       states its own minimum data requirement and stays silent below it.
     · No rule tells you what to do. They report what the numbers show, in
       the same non-causal vocabulary the analytics module uses.
     · Rules never fire on a single data point, and a rule that would fire
       every single day is throttled — advice you see daily stops being
       read within a week.
   ───────────────────────────────────────────────────────────────────────── */

const INSIGHT_RULES = [
  {
    id: 'protein-shortfall',
    domain: 'nutrition',
    minDays: 7,
    run() {
      const daily = SEL.dailyNutrition(14)
      if (daily.length < 7) return null
      const target = S.goals.protein
      const below = daily.filter((d) => d.protein < target * 0.8)
      if (below.length < daily.length * 0.5) return null
      const avg = Math.round(ACALC.mean(daily.map((d) => d.protein)))
      return {
        severity: 'attention',
        title: 'Protein is short on most logged days',
        body: `You averaged ${avg} g against a ${target} g target over ${daily.length} logged days, and fell below 80% of it on ${below.length} of them.`,
        evidence: `${below.length}/${daily.length} days under ${Math.round(target * 0.8)} g`,
        // Vegetarian-aware, because the profile says so. Nothing in this app
        // should ever suggest a food outside the diet you set.
        detail: 'Roughly one more high-protein serving a day closes it — 100 g paneer is about 18 g, 30 g whey about 24 g, and 50 g dry soya chunks about 26 g.',
        action: { label: 'Nutrition', act: 'goto:nutrition' },
      }
    },
  },
  {
    id: 'sleep-debt',
    domain: 'health',
    minDays: 5,
    run() {
      const recent = S.sleep.filter((x) => x.date >= daysAgo(6))
      if (recent.length < 5) return null
      const summary = CALC.sleepSummary(recent)
      if (!isOk(summary)) return null
      const avg = summary.value.averageMinutes
      if (avg >= S.goals.sleepMinutes * 0.92) return null
      const deficit = S.goals.sleepMinutes - avg
      return {
        severity: 'attention',
        title: 'Sleep has been short this week',
        body: `You averaged ${FMT.duration(avg)} across ${summary.value.nightsLogged} nights, ${FMT.duration(deficit)} under your ${FMT.duration(S.goals.sleepMinutes)} target.`,
        evidence: `mean ${FMT.duration(avg)}, spread ±${summary.value.consistencyMinutes} min`,
        detail: 'Recovery, training volume and appetite all tend to move with sleep. This is an observation about your log, not a diagnosis.',
        action: { label: 'Sleep', act: 'goto:health:sleep' },
      }
    },
  },
  {
    id: 'training-streak',
    domain: 'fitness',
    minDays: 7,
    run() {
      const week = SEL.sessionsInLast(7)
      if (week.length === 0) return null
      const done = week.filter((x) => x.status === 'completed').length
      if (done < week.length) return null
      const volume = week.reduce((sum, x) => sum + SEL.sessionVolume(x), 0)
      return {
        severity: 'good',
        title: 'Every planned session completed',
        body: `${done} of ${week.length} sessions done this week, ${FMT.num(Math.round(volume))} kg of working volume.`,
        evidence: `${done}/${week.length} sessions`,
        action: { label: 'Fitness', act: 'goto:fitness' },
      }
    },
  },
  {
    id: 'unused-subscriptions',
    domain: 'finance',
    minDays: 0,
    run() {
      const stale = S.finance.subscriptions.filter((x) => x.lastUsedDaysAgo > 30)
      if (stale.length === 0) return null
      const monthly = stale.reduce((sum, x) => sum + x.amountPaise, 0)
      return {
        severity: 'attention',
        title: `${stale.length} subscriptions unused for over a month`,
        body: `${stale.map((x) => x.name).join(', ')} — ${FMT.money(monthly)} a month, ${FMT.money(monthly * 12)} a year.`,
        evidence: stale.map((x) => `${esc(x.name)}: ${x.lastUsedDaysAgo}d`).join(', '),
        detail: 'Cancelling is your call — some things are worth keeping for occasional use. The annual figure is shown because a monthly one reads as smaller than it is.',
        action: { label: 'Spending', act: 'subtab:finance:spending' },
      }
    },
  },
  {
    id: 'emergency-buffer',
    domain: 'finance',
    minDays: 0,
    run() {
      const months = FSEL.emergencyMonths()
      if (months === null || months >= 3) return null
      return {
        severity: 'attention',
        title: 'Emergency buffer under three months',
        body: `Liquid savings of ${FMT.money(FSEL.liquidPaise())} cover about ${months} months of your essential outgoings.`,
        evidence: `${months} months of ${FMT.money(FSEL.monthlyEssentialsPaise())} essentials`,
        detail: 'Three to six months is a common rule of thumb, not a rule. What is right depends on how stable your income is.',
        action: { label: 'Goals', act: 'subtab:finance:goals' },
      }
    },
  },
  {
    id: 'budget-pace',
    domain: 'finance',
    minDays: 3,
    run() {
      const day = new Date().getDate()
      if (day < 5) return null
      const month = FSEL.monthBounds(0)
      const spent = FSEL.monthSpend(0)
      const budget = S.finance.categories.reduce((sum, c) => sum + c.budgetPaise, 0)
      const forecast = FCALC.forecastMonthEndSpend(spent, day, month.daysInMonth)
      if (!isOk(forecast) || forecast.value.projectedPaise <= budget * 1.05) return null
      return {
        severity: 'attention',
        title: 'On pace to exceed this month\u2019s budget',
        body: `At ${FMT.money(forecast.value.dailyAveragePaise)} a day you would finish around ${FMT.money(forecast.value.projectedPaise)}, against ${FMT.money(budget)} budgeted.`,
        evidence: `day ${day} of ${month.daysInMonth}, ${FMT.money(spent)} so far`,
        detail: 'A straight-line projection. Large fixed payments land early in the month, so this usually settles down.',
        action: { label: 'Spending', act: 'subtab:finance:spending' },
      }
    },
  },
  {
    id: 'weight-trajectory',
    domain: 'health',
    minDays: 14,
    run() {
      const trend = CALC.weightTrend(S.weights.filter((w) => w.date >= daysAgo(27)))
      if (!isOk(trend) || trend.inputs.entryCount < 10) return null
      const rate = trend.value.weeklyRateKg
      const goingRightWay = S.goals.primary === 'gain_weight' ? rate > 0.05 : rate < -0.05
      if (!goingRightWay) {
        return {
          severity: 'attention',
          title: 'Weight is not moving toward your goal',
          body: `Over the last four weeks the 7-day average moved ${FMT.delta(rate, ' kg/wk', 2)}, and your goal is to gain.`,
          evidence: `${trend.inputs.entryCount} readings over ${trend.inputs.spanDays} days`,
          detail: 'Weight responds to a calorie surplus sustained over weeks. Check whether logged intake matches the target before changing anything.',
          action: { label: 'Health', act: 'goto:health' },
        }
      }
      return {
        severity: 'good',
        title: 'Weight is tracking toward your goal',
        body: `The 7-day average is moving ${FMT.delta(rate, ' kg/wk', 2)} over four weeks. At this rate you reach ${S.goals.targetWeightKg} kg in about ${Math.max(1, Math.ceil((S.goals.targetWeightKg - SEL.latestWeight().kg) / Math.max(0.05, rate)))} weeks.`,
        evidence: `${trend.inputs.entryCount} readings, ${FMT.delta(rate, ' kg/wk', 2)}`,
        action: { label: 'Health', act: 'goto:health' },
      }
    },
  },
  {
    id: 'habit-slipping',
    domain: 'habits',
    minDays: 14,
    run() {
      const slipping = S.habits
        .map((h) => ({ h, recent: SEL.habitStats(h, 14), older: SEL.habitStats(h, 60) }))
        .filter((x) => isOk(x.recent) && isOk(x.older)
          && x.recent.value.eligibleDays >= 7
          && x.recent.value.completionRate < x.older.value.completionRate - 25)
      if (slipping.length === 0) return null
      const worst = slipping[0]
      return {
        severity: 'attention',
        title: `${worst.h.name} has slipped recently`,
        body: `${worst.recent.value.completionRate}% over the last fortnight, against ${worst.older.value.completionRate}% over 60 days.`,
        evidence: `${worst.recent.value.completedDays}/${worst.recent.value.eligibleDays} recent days`,
        detail: 'Habits usually slip because the cue changed, not because of willpower. Worth checking what moved.',
        action: { label: 'Habits', act: 'goto:habits' },
      }
    },
  },
  {
    id: 'logging-gap',
    domain: 'health',
    minDays: 0,
    run() {
      const cat = ASEL.catalogue()
      const thin = cat.filter((series) => series.points.length > 0 && series.points.length < 14)
      if (thin.length < 3) return null
      return {
        severity: 'info',
        title: 'Several measurements are too thin to analyse',
        body: `${thin.map((x) => x.label).join(', ')} each have under 14 days of data, so they are excluded from the relationships screen.`,
        evidence: thin.map((x) => `${esc(x.label)}: ${x.points.length}d`).join(', '),
        detail: 'This is not a nag to log everything. It is the honest answer to why some things never appear in analytics.',
        action: { label: 'Analytics', act: 'goto:analytics' },
      }
    },
  },
]

const INSIGHTS = {
  all() {
    const out = []
    for (const rule of INSIGHT_RULES) {
      try {
        const result = rule.run()
        if (result) out.push({ ...result, id: rule.id, domain: rule.domain })
      } catch {
        // A broken rule must never take down the screen it appears on.
      }
    }
    const order = { attention: 0, good: 1, info: 2 }
    return out.sort((a, b) => order[a.severity] - order[b.severity])
  },
}

/* ─── Unified calendar ───────────────────────────────────────────────────
   One timeline. Workouts, bills, EMIs, SIPs, appointments and renewals all
   compete for the same days and the same money, so showing them apart hides
   exactly the collisions worth seeing.
   ───────────────────────────────────────────────────────────────────────── */

const CALENDAR = {
  eventsFor(date) {
    const events = []
    const d = new Date(date)
    const dow = d.getDay()
    const dom = d.getDate()
    const isPast = date < dateKey(new Date())

    const session = S.sessions.find((x) => x.date === date)
    if (session) {
      events.push({ kind: 'workout', label: session.title,
        status: session.status, meta: session.status === 'completed' ? `${FMT.duration(session.durationMinutes)}` : session.status })
    } else if (!isPast && dow >= 1 && dow <= 5) {
      events.push({ kind: 'workout', label: ['', 'Push A', 'Pull A', 'Legs', 'Push B', 'Pull B'][dow], status: 'planned', meta: 'scheduled' })
    }

    for (const b of S.finance.bills) {
      if (b.dueDay === dom) events.push({ kind: 'bill', label: b.name, amountPaise: b.amountPaise, meta: b.autopay ? 'autopay' : 'manual' })
    }
    for (const sub of S.finance.subscriptions) {
      if (sub.recurrence === 'monthly' && sub.dueDay === dom) {
        events.push({ kind: 'subscription', label: sub.name, amountPaise: sub.amountPaise, meta: 'autopay' })
      }
    }
    if (dom === 7) {
      for (const debt of FSEL.debtsWithOutstanding()) {
        if (debt.outstandingPaise > 0) events.push({ kind: 'emi', label: `${esc(debt.name)} EMI`, amountPaise: debt.emiPaise, meta: 'autopay' })
      }
    }
    for (const inv of S.finance.investments) {
      if (inv.sipPaise > 0 && inv.sipDay === dom) {
        events.push({ kind: 'sip', label: `${esc(inv.name)} SIP`, amountPaise: inv.sipPaise, meta: 'autopay' })
      }
    }
    for (const card of S.finance.accounts.filter((a) => a.kind === 'credit_card')) {
      if (card.dueDay === dom) events.push({ kind: 'card', label: `${card.name} payment`, amountPaise: Math.abs(card.balancePaise), meta: 'manual' })
    }
    for (const appt of S.appointments) {
      if (appt.scheduledAt === date) events.push({ kind: 'appointment', label: appt.title, meta: appt.provider })
    }
    for (const pol of S.finance.insurance) {
      if (pol.renewalOn === date) events.push({ kind: 'insurance', label: `${esc(pol.provider)} renewal`, amountPaise: pol.premiumPaise, meta: 'manual' })
    }
    return events
  },

  monthGrid(offset = 0) {
    const now = new Date()
    const anchor = new Date(now.getFullYear(), now.getMonth() + offset, 1)
    const year = anchor.getFullYear(), month = anchor.getMonth()
    const daysInMonth = new Date(year, month + 1, 0).getDate()
    // Monday-first, matching the weekStartsOn preference.
    const leading = (new Date(year, month, 1).getDay() + 6) % 7

    const cells = []
    for (let i = 0; i < leading; i++) cells.push(null)
    for (let d = 1; d <= daysInMonth; d++) {
      const date = dateKey(new Date(year, month, d))
      cells.push({ date, day: d, events: CALENDAR.eventsFor(date) })
    }
    return { cells, label: anchor.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' }) }
  },
}

/* ─── Search ─────────────────────────────────────────────────────────────
   Everything the person has entered, in one place. Scoped to their own
   records only — nothing here searches the shared exercise or food library,
   because "find my data" and "find a thing to log" are different questions.
   ───────────────────────────────────────────────────────────────────────── */

function searchEverything(query) {
  const q = query.trim().toLowerCase()
  if (q.length < 2) return []
  const hits = []
  const add = (kind, label, meta, act) => hits.push({ kind, label, meta, act })

  for (const m of S.meals) {
    if (m.label.toLowerCase().includes(q)) add('Meal', m.label, `${FMT.relDay(m.date)} · ${FMT.num(m.calories)} kcal`, 'goto:nutrition')
  }
  for (const t of S.finance.transactions) {
    if (t.merchant.toLowerCase().includes(q)) add('Transaction', t.merchant, `${FMT.relDay(t.date)} · ${FMT.money(t.amountPaise)}`, 'subtab:finance:spending')
  }
  for (const s of S.sessions) {
    if (s.title.toLowerCase().includes(q)) add('Workout', s.title, `${FMT.relDay(s.date)} · ${s.status}`, `session:${s.id}`)
    for (const ex of s.exercises || []) {
      if (ex.name.toLowerCase().includes(q) && !hits.some((h) => h.label === ex.name)) {
        add('Exercise', ex.name, 'in your training history', `exercise:${ex.name}`)
      }
    }
  }
  for (const h of S.habits) if (h.name.toLowerCase().includes(q)) add('Habit', h.name, h.weekdays ? 'weekdays' : 'daily', 'goto:habits')
  for (const a of S.finance.accounts) if (a.name.toLowerCase().includes(q)) add('Account', a.name, FMT.money(a.balancePaise), 'subtab:finance:accounts')
  for (const d of S.finance.debts) if (d.name.toLowerCase().includes(q)) add('Loan', d.name, d.lender, 'subtab:finance:debts')
  for (const i of S.finance.investments) if (i.name.toLowerCase().includes(q)) add('Investment', i.name, FMT.money(Math.round(i.units * i.currentNavPaise), { compact: true }), 'subtab:finance:invest')
  for (const g of S.finance.goals) if (g.name.toLowerCase().includes(q)) add('Goal', g.name, `${Math.round((g.savedPaise / g.targetPaise) * 100)}% funded`, 'subtab:finance:goals')
  for (const m of S.medications) if (m.name.toLowerCase().includes(q)) add('Medication', m.name, m.dosage, 'goto:health:meds')

  return hits.slice(0, 40)
}

/* Amortisation detail for a single loan. */
function showDebtDetail(debt) {
  const emi = FCALC.emi(debt.principalPaise, debt.annualRatePct, debt.termMonths)
  const totalInt = FCALC.totalInterest(debt.principalPaise, debt.annualRatePct, debt.termMonths)

  // Build the schedule so the split between interest and principal is
  // visible. Early payments on a long loan are almost all interest, and
  // people are consistently surprised by that.
  const rows = []
  const r = debt.annualRatePct / 12 / 100
  let balance = debt.principalPaise
  if (isOk(emi)) {
    for (let i = 1; i <= debt.termMonths && balance > 0; i++) {
      const interest = Math.round(balance * r)
      const principal = Math.min(emi.value - interest, balance)
      balance -= principal
      rows.push({ n: i, interest, principal, balance: Math.max(0, balance) })
    }
  }
  const shown = rows.filter((row) => row.n <= 3 || row.n > rows.length - 3 || row.n === debt.paidMonths + 1)

  el.sheetTitle.textContent = debt.name
  el.sheetDesc.textContent = `${esc(debt.lender)} · ${debt.annualRatePct}% · ${debt.termMonths} months`
  el.sheetBody.innerHTML = `
    <div class="grid-3" style="margin-bottom:1rem">
      ${statCard('Outstanding', `<span class="t-fig fig">${FMT.money(debt.outstandingPaise, { compact: true })}</span>`, `${debt.paymentsRemaining} left`)}
      ${statCard('EMI', metricBlock(emi, (v) => FMT.money(v), { compact: true }), 'per month')}
      ${statCard('Interest', metricBlock(totalInt, (v) => FMT.money(v, { compact: true }), { compact: true }), 'over full term')}
    </div>

    ${debt.productName ? `
      <div class="card card-pad" style="margin-bottom:1rem">
        <div class="caps" style="margin-bottom:0.375rem">Purchase</div>
        <div class="row-between t-label"><span>${esc(debt.productName)}</span>
          <span class="fig">${FMT.money(debt.purchasePricePaise)}</span></div>
        <div class="row-between t-label muted"><span>Down payment</span>
          <span class="fig">${FMT.money(debt.downPaymentPaise)}</span></div>
        <div class="row-between t-label muted"><span>Financed</span>
          <span class="fig">${FMT.money(debt.principalPaise)}</span></div>
        <div class="row-between t-label semi" style="border-top:1px solid hsl(var(--line));margin-top:0.375rem;padding-top:0.375rem">
          <span>True total cost</span>
          <span class="fig">${FMT.money(debt.downPaymentPaise + (isOk(emi) ? emi.value * debt.termMonths : 0))}</span></div>
      </div>` : ''}

    <div class="card">
      <div class="card-pad" style="padding-bottom:0.5rem">
        <div class="caps">Where each payment goes</div>
        <p class="t-micro faint" style="margin-top:0.25rem;line-height:1rem">
          First and last three payments, plus your next one. On an interest-bearing loan the
          early instalments are mostly interest.
        </p>
      </div>
      <table class="chart-data" style="margin:0 0 0.5rem">
        <thead><tr>
          <th scope="col">#</th><th scope="col">Interest</th>
          <th scope="col">Principal</th><th scope="col">Balance</th>
        </tr></thead>
        <tbody>
          ${shown.map((row, idx) => `
            ${idx > 0 && row.n !== shown[idx - 1].n + 1
              ? '<tr><td colspan="4" style="text-align:center;color:hsl(var(--ink-faint))">⋯</td></tr>' : ''}
            <tr style="${row.n === debt.paidMonths + 1 ? 'background:hsl(var(--accent-soft))' : ''}">
              <td>${row.n}${row.n === debt.paidMonths + 1 ? ' ·' : ''}</td>
              <td data-numeric>${FMT.money(row.interest)}</td>
              <td data-numeric>${FMT.money(row.principal)}</td>
              <td data-numeric>${FMT.money(row.balance, { compact: true })}</td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>

    <p class="disclaimer" style="margin-top:0.75rem">
      Calculated on a reducing-balance basis from the figures you entered. Your lender's
      schedule may differ slightly through rounding, fees or a different day-count
      convention. Treat their statement as authoritative.
    </p>`

  el.overlay.classList.add('open')
  el.sheet.classList.add('open')
  document.body.style.overflow = 'hidden'
}

      <tbody>
        <tr><td>Bank and cash</td><td data-numeric>${FMT.money(liquid)}</td></tr>

STATE_UI.analyticsRange = 90
STATE_UI.analyticsLag = 0
STATE_UI.showAllPairs = false

const baseRunActionAnalytics = runAction
runAction = function (act) {
  if (act === 'toggle-pairs') {
    STATE_UI.showAllPairs = !STATE_UI.showAllPairs
    render()
    return
  }
  if (act === 'export-csv' || act === 'export-json') {
    const isCsv = act === 'export-csv'
    const content = isCsv
      ? ASEL.exportCsv()
      : JSON.stringify({
          exportedAt: new Date().toISOString(),
          rangeDays: ASEL.rangeDays(),
          note: 'Missing days are absent rather than zero. A day with no reading is not a reading of nothing.',
          series: ASEL.catalogue().map((s) => ({ key: s.key, label: s.label, unit: s.unit, domain: s.domain, points: s.points })),
        }, null, 2)

    // Blob download works from file:// as well as https, so the export is
    // genuinely usable in this prototype rather than a disabled button.
    const blob = new Blob([content], { type: isCsv ? 'text/csv' : 'application/json' })
    const url = URL.createObjectURL(blob)
    const a = document.createElement('a')
    a.href = url
    a.download = `lifeos-export-${dateKey(new Date())}.${isCsv ? 'csv' : 'json'}`
    document.body.appendChild(a)
    a.click()
    a.remove()
    setTimeout(() => URL.revokeObjectURL(url), 1000)
    toast(`Exported ${isCsv ? 'CSV' : 'JSON'}`)
    return
  }
  return baseRunActionAnalytics(act)
}

document.addEventListener('click', (e) => {
  const range = e.target.closest && e.target.closest('[data-range]')
  if (range) {
    STATE_UI.analyticsRange = Number(range.dataset.range)

  }
})

VIEWS.review = function () {
  const insights = INSIGHTS.all()
  const week = ASEL.comparison(7)
  const attention = insights.filter((i) => i.severity === 'attention')
  const good = insights.filter((i) => i.severity === 'good')

  const insightCard = (ins) => {
    const tone = ins.severity === 'good' ? 'pos' : ins.severity === 'attention' ? 'cau' : ''
    return `<div class="card-pad">
      <div class="row" style="gap:0.625rem;align-items:flex-start">
        <span class="badge ${tone ? 'badge-' + tone : ''}" style="width:28px;height:28px;padding:0;justify-content:center;border-radius:8px;flex:none">
          ${ICON(ins.severity === 'good' ? 'check' : 'info', 14, 2.2)}
        </span>
        <div style="min-width:0;flex:1">
          <div class="t-label semi">${esc(ins.title)}</div>
          <p class="t-micro muted" style="line-height:1rem;margin-top:0.125rem">${esc(ins.body)}</p>
          ${ins.detail ? `<p class="t-micro faint" style="line-height:1rem;margin-top:0.375rem">${esc(ins.detail)}</p>` : ''}
          <div class="row-between" style="margin-top:0.5rem">
            <span class="t-micro faint fig">${esc(ins.evidence)}</span>
            ${ins.action ? `<button class="btn btn-secondary btn-sm" data-act="${esc(ins.action.act)}">${esc(ins.action.label)}</button>` : ''}
          </div>
        </div>
      </div>
    </div>`
  }

  return `
  <header style="margin-bottom:1rem">
    <h1 class="t-fig semi">Weekly review</h1>
    <p class="t-label muted">${FMT.date(daysAgo(6))} to ${FMT.date(dateKey(new Date()))}</p>
  </header>

  <div class="stack">
    <div class="rail">
      ${scoreCard('rlife', 'Overall', SEL.lifeScore(), 'this week')}
      ${scoreCard('rfit', 'Fitness', SEL.fitnessScore(), '7 days')}
      ${scoreCard('rnut', 'Nutrition', SEL.nutritionScore(), '7 days')}
      ${scoreCard('rhab', 'Habits', SEL.habitScore(), '7 days')}
      ${scoreCard('rfin', 'Finances', FSEL.disciplineScore(), 'last month')}
    </div>

    <section>
      ${sectionHead('Backend summary (this week)')}
      <div class="card card-pad" style="margin-top:0.5rem">
        ${STATE_UI.remoteReview ? `
          <div class="grid-3">
            ${statCard('Sessions', `<span class="t-fig fig">${STATE_UI.remoteReview.summary.sessionsCompleted}</span>`, `of ${STATE_UI.remoteReview.summary.sessionsTotal} planned`)}
            ${statCard('Meals logged', `<span class="t-fig fig">${STATE_UI.remoteReview.summary.mealsLogged}</span>`, '')}
            ${statCard('Habit completion', `<span class="t-fig fig">${STATE_UI.remoteReview.summary.habitCompletionRate ?? '—'}%</span>`, '')}
          </div>
          <p class="t-micro faint" style="margin-top:0.75rem">
            ${STATE_UI.remoteReview.weekStart} to ${STATE_UI.remoteReview.weekEnd} · computed server-side from your database
          </p>
        ` : `<p class="t-label muted">Loading server-computed summary…</p>`}
      </div>
    </section>

    ${attention.length ? `
      <section>
        ${sectionHead(`Worth your attention · ${attention.length}`)}
        <div class="card divide" style="margin-top:0.5rem">${attention.map(insightCard).join('')}</div>
      </section>` : ''}

    ${good.length ? `
      <section>
        ${sectionHead('Going well')}
        <div class="card divide" style="margin-top:0.5rem">${good.map(insightCard).join('')}</div>
      </section>` : ''}

    <section>
      ${sectionHead('This week against last')}
      <div class="card divide" style="margin-top:0.5rem">
        ${week.filter((r) => isOk(r.metric)).map((r) => {
          const v = r.metric.value
          const improving = v.direction === 'flat' ? null
            : r.betterWhen === 'up' ? v.direction === 'up' : v.direction === 'down'
          return `<div class="card-pad row-between">
            <span class="t-label">${esc(r.label)}</span>
            <span class="row" style="gap:0.5rem">
              <span class="t-label fig faint">${r.fmt(v.previousMean)}</span>
              <span class="faint">${ICON('trend', 12, 2)}</span>
              <span class="t-label fig semi ${improving === null ? '' : improving ? 'pos' : 'cau'}">${r.fmt(v.currentMean)}</span>
            </span>
          </div>`
        }).join('')}
      </div>
    </section>

    <div class="card card-pad">
      <div class="caps" style="margin-bottom:0.5rem">How these are produced</div>
      <p class="t-micro muted" style="line-height:1rem">
        Every point above comes from a named rule with a fixed threshold, run against data
        you logged. There is no model and no external service — nothing about you leaves the
        app to produce this. Each rule stays silent when it does not have enough data, which
        is why the list is short some weeks.
      </p>
    </div>

    <p class="disclaimer">
      Observations about your own records. Not medical or financial advice.
    </p>
  </div>`
}
