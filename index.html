            : metricBlock(missing('Nothing logged today.', 'Add a meal.'), () => '', { compact: true }),
          nut.meals.length ? `<div class="bar bar-acc" style="margin-top:0.375rem"><i style="width:${Math.min(100, nut.calories / S.goals.calories * 100)}%"></i></div>` : '')}

        ${statCard('Protein',
          nut.meals.length
            ? `<span class="t-fig fig">${nut.protein}</span><span class="t-micro faint fig"> / ${S.goals.protein} g</span>`
            : `<span class="t-fig fig faint">—</span>`,
          nut.meals.length ? `<div class="bar ${nut.protein >= S.goals.protein * 0.9 ? 'bar-pos' : 'bar-cau'}" style="margin-top:0.375rem"><i style="width:${Math.min(100, nut.protein / S.goals.protein * 100)}%"></i></div>` : '')}

        ${statCard('Water',

          ? ok({ score: recovery.value.score, band: recovery.value.score >= 70 ? 'consistent' : recovery.value.score >= 45 ? 'fair' : 'needs_attention',

                 explanation: 'A weighted mean of up to six self-reported inputs: sleep duration 30%, sleep quality 20%, soreness 15%, fatigue 15%, stress 10%, and resting heart rate against your own baseline 10%. Weights are renormalised over whichever inputs you logged. This is a summary of self-reports, not a medical assessment.',
                 excludedCount: recovery.value.missingInputs.length }, {}, recovery.caveat)

          ['Training volume', `${FMT.num(Math.round(weekCompleted.reduce((s, x) => s + SEL.sessionVolume(x), 0)))} kg`, ''],

          ['Days logged', `${SEL.dailyNutrition(7).length} of 7`, ''],

const HEALTH_TABS = {}

HEALTH_TABS.overview = function () {
  const w = SEL.latestWeight()
  const waist = SEL.latestMeasurement('waist')
  const bmi = CALC.bmi(w ? w.kg : null, S.profile.heightCm)
  const wthr = CALC.waistToHeight(waist ? waist.value : null, S.profile.heightCm)
  const hr = SEL.latestVital('resting_heart_rate')
  const bp = SEL.latestVital('blood_pressure')
  const recovery = SEL.recoveryToday()
  const wb = SEL.wellbeingOn(dateKey(new Date())) || SEL.wellbeingOn(daysAgo(1))
  const trend = CALC.weightTrend(S.weights)

  const bandLabel = { under: 'Below 18.5', healthy: '18.5 – 25', over: '25 – 30', obese: 'Above 30' }

  return `<div class="stack">
    <div class="lg-grid-2">
      <div class="card card-pad stack-s">
        <div class="row-between">
          <span class="caps">Current weight</span>
          <span class="badge badge-acc">Goal ${S.goals.targetWeightKg} kg</span>
        </div>
        ${metricBlock(w ? ok(w.kg) : missing('No weight recorded.', 'Log your weight.'), (v) => `<span class="t-fig-lg">${FMT.weight(v)}</span>`)}
        ${isOk(trend) ? `
          <div class="bar bar-acc"><i style="width:${Math.min(100, ((w.kg - 56) / (S.goals.targetWeightKg - 56)) * 100)}%"></i></div>
          <div class="t-micro muted">
            ${FMT.weight(S.goals.targetWeightKg - w.kg)} to target ·
            at ${FMT.delta(trend.value.weeklyRateKg, ' kg/wk', 2)} that is about
            ${Math.max(1, Math.ceil((S.goals.targetWeightKg - w.kg) / Math.max(0.05, trend.value.weeklyRateKg)))} weeks
          </div>` : ''}
      </div>

      <div class="card card-pad stack-s">
        <div class="row-between">
          <span class="caps">Body indicators</span>
          <button class="btn-ghost" data-explain="bmi" aria-label="How BMI is calculated"
                  style="padding:0.25rem;margin:-0.25rem;color:hsl(var(--ink-faint))">${ICON('info', 15, 2)}</button>
        </div>
        <div class="grid-2">
          <div>
            <div class="t-micro muted">BMI</div>
            ${metricBlock(bmi, (v) => `${v.bmi}`, { compact: true })}
            ${isOk(bmi) ? `<div class="t-micro faint">band ${bandLabel[bmi.value.band]}</div>` : ''}
          </div>
          <div>
            <div class="t-micro muted">Waist ÷ height</div>
            ${metricBlock(wthr, (v) => `${v}`, { compact: true })}
            ${isOk(wthr) ? `<div class="t-micro faint">waist ${FMT.length(waist.value)}</div>` : ''}
          </div>
        </div>
        <p class="t-micro faint" style="line-height:1rem">
          ${ICON('info', 11, 2)} BMI is a population statistic that cannot tell muscle from fat.
          Waist-to-height is generally the more useful of the two for one person.
        </p>
      </div>
    </div>

    <section>
      ${sectionHead('Vitals and self-reports')}
      <div class="card divide" style="margin-top:0.5rem">
        ${[
          ['Resting heart rate', hr ? `${hr.value} bpm` : '—', hr ? FMT.relDay(hr.date) : 'not recorded'],
          ['Blood pressure', bp ? `${bp.systolic}/${bp.diastolic}` : '—', bp ? FMT.relDay(bp.date) : 'not recorded'],
          ['Recovery indicator', isOk(recovery) ? `${recovery.value.score}/100` : '—', isOk(recovery) ? recovery.value.label : 'log sleep and soreness'],
          ['Energy', wb && wb.energy ? `${wb.energy}/5` : '—', wb ? FMT.relDay(wb.date) : 'not recorded'],
          ['Stress', wb && wb.stress ? `${wb.stress}/5` : '—', wb ? FMT.relDay(wb.date) : 'not recorded'],

        ].map(([k, v, meta]) => `
          <div class="card-pad row-between">
            <div><div class="t-label">${k}</div><div class="t-micro faint">${meta}</div></div>
            <span class="t-body fig semi">${v}</span>
          </div>`).join('')}
      </div>
    </section>

    <section>
      ${sectionHead('Upcoming')}
      <div class="card divide" style="margin-top:0.5rem">
        ${S.appointments.length ? S.appointments.map((a) => `
          <div class="card-pad row-between">
            <div><div class="t-label semi">${esc(a.title)}</div>
              <div class="t-micro faint">${esc(a.provider)} · ${esc(a.location)}</div></div>
            <div style="text-align:right"><div class="t-label fig">${FMT.date(a.scheduledAt)}</div>
              <div class="t-micro faint">${FMT.relDay(a.scheduledAt)}</div></div>
          </div>`).join('')
          : `<div class="empty"><h3>No appointments booked</h3><p>Add one to see it here and on the calendar.</p></div>`}

    </section>

    <p class="disclaimer">
      Reference ranges and indicators shown here are general information. They are not a
      diagnosis and do not replace advice from a qualified healthcare professional.
    </p>
  </div>`

HEALTH_TABS.measurements = function () {
  const trend = CALC.weightTrend(S.weights)
  const SITES = [
    ['waist', 'Waist'], ['chest', 'Chest'], ['shoulders', 'Shoulders'],
    ['arm_right', 'Right arm'], ['thigh_right', 'Right thigh'],
  ]

  return `<div class="stack">
    <div class="card card-pad">
      <div class="row-between" style="margin-bottom:0.5rem">
        <div><span class="caps">Body weight</span>
          <div class="t-micro faint">${S.weights.length} readings over 90 days</div></div>
        <button class="btn btn-primary btn-sm" data-act="sheet:weight">Record</button>
      </div>
      ${isOk(trend) ? SVG.line({
        raw: trend.value.raw.map((r) => ({ date: r.date, value: r.kg })),
        smooth: trend.value.movingAverage,
        goal: S.goals.targetWeightKg,
        label: 'Body weight', unit: ' kg', decimals: 1, height: 170,
      }) : SVG.emptyChart('Body weight')}
    </div>

    <section>
      ${sectionHead('Measurements', 'Add', 'sheet:measurement')}
      <div class="card divide" style="margin-top:0.5rem">
        ${SITES.map(([site, label]) => {
          const rows = S.measurements.filter((m) => m.site === site).sort((a, b) => b.date.localeCompare(a.date))
          if (!rows.length) return `<div class="card-pad row-between">
            <span class="t-label">${label}</span><span class="t-label faint">Not recorded</span></div>`
          const latest = rows[0], first = rows[rows.length - 1]
          const change = round(latest.value - first.value, 1)
          const tone = site === 'waist' ? (change <= 0 ? 'pos' : 'cau') : (change >= 0 ? 'pos' : 'cau')
          return `<div class="card-pad row-between">
            <div><div class="t-label">${label}</div>
              <div class="t-micro faint">${FMT.relDay(latest.date)} · ${rows.length} readings</div></div>
            <div class="row" style="gap:0.5rem;flex:none">
              <div style="text-align:right">
                <div class="t-body fig semi">${FMT.length(latest.value)}</div>
                <div class="t-micro fig ${tone}">${FMT.delta(change, ' cm', 1)} since ${FMT.dayShort(first.date)}</div>
              </div>
              ${rowMenu('measurement', `${latest.date}|${esc(latest.site)}`)}
            </div>
          </div>`
        }).join('')}
      </div>
      <p class="t-micro faint" style="padding:0.5rem 0.125rem">
        Waist is shown as improving when it falls; the others when they rise. That direction
        follows your primary goal, which is currently <strong>gain weight</strong>, and changes
        if you change the goal.
      </p>
    </section>

    <section>
      ${sectionHead('Progress photos')}
      <div class="card" style="margin-top:0.5rem">
        <div class="empty">
          <span class="faint">${ICON('file', 24, 1.6)}</span>
          <h3>No progress photos yet</h3>
          <p>Photos are stored in a private bucket and only ever reached through a
             short-lived signed link. Nobody but you can open them.</p>
          <button class="btn btn-secondary btn-sm" style="margin-top:0.5rem" data-act="noop">Add photo</button>
        </div>
      </div>
    </section>
  </div>`
}

  return `<div class="stack">
    <div class="grid-3">
      ${statCard('7-day average', metricBlock(week, (v) => FMT.duration(v.averageMinutes), { compact: true }),
        isOk(week) ? `${week.value.nightsLogged} nights` : '')}
      ${statCard('Consistency', metricBlock(week, (v) => `±${v.consistencyMinutes}m`, { compact: true }), 'std deviation')}
      ${statCard('30-day average', metricBlock(month, (v) => FMT.duration(v.averageMinutes), { compact: true }),
        isOk(month) ? `${month.value.nightsLogged} nights` : '')}

    <div class="card card-pad">
      <div class="row-between" style="margin-bottom:0.5rem">

              <div class="t-label semi">${FMT.relDay(s.date)}</div>

            </div>
            <div class="row" style="gap:0.5rem;flex:none">
              <div style="text-align:right">

const FITNESS_TABS = {}

FITNESS_TABS.dashboard = function () {
  const planned = SEL.todaysPlannedSession()
  const week = SEL.sessionsInLast(7)
  const completed = week.filter((s) => s.status === 'completed')
  const adherence = CALC.trainingAdherence(week.length, completed.length)
  const weekVolume = completed.reduce((s, x) => s + SEL.sessionVolume(x), 0)
  const prs = SEL.personalRecords().slice(0, 5)
  const recovery = SEL.recoveryToday()

  // Streak: consecutive scheduled days completed, walking backwards.
  let streak = 0
  for (const s of [...S.sessions].sort((a, b) => b.date.localeCompare(a.date))) {
    if (s.status === 'completed') streak++
    else break
  }

  return `<div class="stack">
    ${planned ? `
      <div class="card card-pad stack-s" style="border-color:hsl(var(--accent));background:hsl(var(--accent-soft))">
        <div class="row-between">
          <div>
            <span class="caps" style="color:hsl(var(--accent))">Today</span>
            <div class="t-fig semi">${esc(planned.title)}</div>
            ${planned.muscles ? `<div class="t-micro muted">${planned.muscles.join(' · ')}</div>` : ''}
          </div>
          <span class="badge ${planned.status === 'completed' ? 'badge-pos' : 'badge-acc'}">
            ${planned.status === 'completed' ? ICON('check', 11, 2.4) + 'Done' : 'Not started'}</span>
        </div>
        ${planned.status === 'completed' ? `
          <div class="row" style="gap:1rem">
            <div><div class="t-micro muted">Volume</div><div class="t-body fig semi">${FMT.num(SEL.sessionVolume(planned))} kg</div></div>
            <div><div class="t-micro muted">Duration</div><div class="t-body fig semi">${FMT.duration(planned.durationMinutes)}</div></div>
            <div><div class="t-micro muted">Effort</div><div class="t-body fig semi">${planned.perceivedEffort}/10</div></div>
          </div>
          <button class="btn btn-secondary" data-act="session:${planned.id || ''}">Review session</button>
        ` : `
          <button class="btn btn-primary" data-act="sheet:workout">Start workout</button>
        `}
      </div>` : `
      <div class="card"><div class="empty">
        <h3>Rest day</h3><p>Nothing scheduled today. Your split trains Monday to Friday.</p>
      </div></div>`}

    <div class="rail">
      ${statCard('Streak', `<span class="t-fig fig">${streak}</span>`, 'sessions in a row')}
      ${statCard('This week', metricBlock(adherence, (v) => `${v}%`, { compact: true }), `${completed.length} of ${week.length} planned`)}
      ${statCard('Volume', `<span class="t-fig fig">${FMT.num(Math.round(weekVolume / 1000), 1)}k</span>`, 'kg this week')}
      ${statCard('Recovery', metricBlock(recovery, (v) => `${v.score}`, { compact: true }),
        isOk(recovery) ? recovery.value.label : 'log sleep')}
    </div>

    <div class="card card-pad">
      <div class="row-between" style="margin-bottom:0.5rem">
        <div><span class="caps">Weekly training volume</span>
          <div class="t-micro faint">Working sets only — warm-ups and drop sets excluded</div></div>
      </div>
      ${SVG.bars({ data: SEL.weeklyVolume(8), label: 'Weekly training volume in kilograms', unit: ' kg', height: 120 })}
    </div>

    <section>
      ${sectionHead('Recent personal bests', 'All →', 'subtab:fitness:progress')}
      <div class="card divide" style="margin-top:0.5rem">
        ${prs.map((p) => `
          <button class="card-pad row-between" style="width:100%;text-align:left" data-act="exercise:${esc(p.name)}">
            <div style="min-width:0">
              <div class="t-label semi">${esc(p.name)}</div>
              <div class="t-micro faint fig">${p.weightKg} kg × ${p.reps} · ${FMT.relDay(p.date)}</div>
            </div>
            <div style="text-align:right;flex:none">
              <div class="t-body fig semi">${p.e1rm} kg</div>

FITNESS_TABS.progress = function () {
  const prs = SEL.personalRecords()
  const focus = STATE_UI.focusExercise || (prs[0] && prs[0].name)
  const history = focus ? SEL.exerciseHistory(focus) : []

  const muscleVolume = {}
  for (const s of S.sessions) {
    if (s.status !== 'completed' || s.date < daysAgo(27)) continue
    const vol = SEL.sessionVolume(s)
    for (const m of s.muscles || []) muscleVolume[m] = (muscleVolume[m] || 0) + vol / (s.muscles.length || 1)
  }
  const muscleRows = Object.entries(muscleVolume).sort((a, b) => b[1] - a[1])
  const maxMuscle = muscleRows.length ? muscleRows[0][1] : 1

  return `<div class="stack">
    <div class="card card-pad">
      <div class="caps" style="margin-bottom:0.375rem">Strength progression</div>
      <label for="exerciseSelect" class="sr-only">Choose an exercise to chart</label>
      <select id="exerciseSelect" aria-label="Choose an exercise to chart" style="min-height:44px;width:100%;padding:0 0.75rem;border:1px solid hsl(var(--line));border-radius:0.625rem;background:hsl(var(--surface));font-size:1rem;margin-bottom:0.75rem">
        ${prs.map((p) => `<option value="${esc(p.name)}" ${p.name === focus ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}
      </select>
      ${history.length > 1 ? SVG.line({
        raw: history, smooth: [], label: `Estimated 1RM for ${focus}`, unit: ' kg', decimals: 1, height: 150, showRaw: false,
      }) : SVG.emptyChart('Strength progression')}
      ${history.length > 1 ? `<p class="t-micro faint" style="margin-top:0.25rem">
        Best estimated 1RM from each session · ${FMT.delta(round(history[history.length - 1].value - history[0].value, 1), ' kg', 1)} over ${history.length} sessions
      </p>` : ''}
    </div>

    <section>
      ${sectionHead('Volume by muscle group', '28 days')}
      <div class="card card-pad stack-s" style="margin-top:0.5rem">
        ${muscleRows.map(([m, v]) => `
          <div>
            <div class="row-between" style="margin-bottom:0.25rem">
              <span class="t-label">${esc(m)}</span>
              <span class="t-label fig muted">${FMT.num(Math.round(v))} kg</span>
            </div>
            <div class="bar bar-acc"><i style="width:${(v / maxMuscle) * 100}%"></i></div>
          </div>`).join('')}
      </div>
    </section>
  </div>`
}

/* ─────────────────────────────────────────────────────────────────────────
   9 · SHEETS — logging forms
   Each declares its fields, a validator and a submit handler. Validation
   rules mirror the Zod schemas in src/lib/validation/ and the CHECK
   constraints in the migrations, so a value rejected here would also be
   rejected by the database.
   ───────────────────────────────────────────────────────────────────────── */

const SHEETS = {
  weight: {
    title: 'Record weight',
    desc: 'One reading a day. Weigh at the same time for a cleaner trend.',
    fields: [
      { name: 'kg', label: 'Weight', unit: 'kg', type: 'number', step: '0.1', required: true,
        placeholder: '58.2', inputmode: 'decimal',
        help: 'Same time of day gives the most comparable readings.',
        validate: (v) => {
          const n = parseFloat(v)
          if (!v) return 'Enter a weight.'
          if (isNaN(n)) return 'That is not a number.'
          if (n < 20 || n > 400) return 'Weight must be between 20 and 400 kg.'
          return null
        } },
      { name: 'date', label: 'Date', type: 'date', required: true, value: () => dateKey(new Date()),
        validate: (v) => (v > dateKey(new Date()) ? 'That date is in the future.' : null) },
      { name: 'notes', label: 'Notes', type: 'text', placeholder: 'Optional' },
    ],
    async submitApi(vals) {
      return apiFetch('/health/weights', {
        method: 'POST',
        body: JSON.stringify({ date: vals.date, kg: round(parseFloat(vals.kg), 1) }),
      })
    },
    successMessage: (vals) => `Weight recorded · ${FMT.weight(parseFloat(vals.kg))}`,
    submit(vals) {
      const kg = round(parseFloat(vals.kg), 1)
      const existing = S.weights.findIndex((w) => w.date === vals.date)
      const previous = existing >= 0 ? { ...S.weights[existing] } : null
      if (existing >= 0) S.weights[existing] = { date: vals.date, kg }
      else S.weights.push({ date: vals.date, kg })
      return {
        message: `Weight recorded · ${FMT.weight(kg)}`,
        undo: () => {
          if (previous) S.weights[existing] = previous
          else S.weights = S.weights.filter((w) => !(w.date === vals.date && w.kg === kg))
        },
      }
    },
  },

  water: {
    title: 'Add water',
    desc: 'Quick amounts, or type your own.',
    fields: [
      { name: 'amountMl', label: 'Amount', unit: 'ml', type: 'number', required: true,
        placeholder: '500', inputmode: 'numeric',
        quick: [200, 250, 300, 500, 750, 1000],
        validate: (v) => {
          const n = parseInt(v, 10)
          if (!v) return 'Enter an amount.'
          if (isNaN(n) || n < 1) return 'Enter a positive amount.'
          if (n > 5000) return 'That is more than 5 litres in one entry.'
          return null
        } },
    ],
    async submitApi(vals) {
      return apiFetch('/nutrition/water', {
        method: 'POST',
        body: JSON.stringify({ date: dateKey(new Date()), amountMl: parseInt(vals.amountMl, 10) }),
      })
    },
    successMessage: (vals) => `${vals.amountMl} ml added`,
    submit(vals) {

function renderSheet(key) {
  const spec = SHEETS[key]
  if (!spec) return ''

  if (spec.custom) {
    const groups = [
      ['Health', [['sheet:weight', 'scale', 'Record weight'], ['sheet:sleep', 'moon', 'Log sleep'],
                  ['sheet:measurement', 'scale', 'Measurement'], ['sheet:vital', 'heart', 'Vital reading']]],
      ['Food and water', [['sheet:meal', 'utensils', 'Add meal'], ['sheet:water', 'droplet', 'Add water']]],
      ['Training', [['sheet:workout', 'dumbbell', 'Log workout'], ['goto:habits', 'repeat', 'Habit check-in']]],
      ['Money', [['sheet:expense', 'rupee', 'Add expense'], ['sheet:affordability', 'rupee', 'Can I afford it?']]],
    ]
    return groups.map(([label, items]) => `
      <section style="margin-bottom:1.25rem">
        <h3 class="caps" style="padding:0 0.25rem 0.5rem">${label}</h3>
        <div class="grid-2">
          ${items.map(([act, icon, text]) => `
            <button class="card card-pad row" data-act="${act}" style="gap:0.625rem;text-align:left;min-height:56px">
              <span class="badge badge-acc" style="width:32px;height:32px;padding:0;justify-content:center;border-radius:9px;flex:none">${ICON(icon, 16, 2)}</span>
              <span class="t-label semi">${text}</span>
            </button>`).join('')}
        </div>
      </section>`).join('')
  }

  return `<form id="sheetForm" novalidate class="stack" data-sheet="${key}">
    ${spec.fields.map((f) => renderField(f)).join('')}
    <div class="row" style="gap:0.5rem;padding-top:0.5rem">
      <button type="button" class="btn btn-secondary" style="flex:1" data-close-sheet>Cancel</button>
      <button type="submit" class="btn btn-primary" style="flex:2">Save</button>
    </div>
    <p class="t-micro faint" style="text-align:center">
      Fields marked <span class="neg">*</span> are required. Values are checked here and again
      by the database, which has the same limits.
    </p>
  </form>`
}

function renderField(f) {
  const value = typeof f.value === 'function' ? f.value() : (f.value || '')
  const id = 'f-' + f.name

  let control
  if (f.type === 'select') {
    control = `<select id="${id}" name="${f.name}">
      ${f.options.map(([v, l]) => `<option value="${v}">${esc(l)}</option>`).join('')}</select>`
  } else if (f.type === 'rating') {
    control = `<div class="chipset" role="radiogroup" aria-label="${esc(f.label)}">
      ${[1, 2, 3, 4, 5].map((n) => `
        <button type="button" class="chip" data-rating="${f.name}" data-value="${n}"
                aria-pressed="${String(n) === value}" style="flex:1">${n}</button>`).join('')}
      <input type="hidden" name="${f.name}" value="${value}">
    </div>`
  } else if (f.type === 'text') {
    control = `<input type="text" id="${id}" name="${f.name}" placeholder="${esc(f.placeholder || '')}" value="${esc(value)}">`
  } else {
    // inputmode drives the mobile keyboard: numeric pad for numbers, decimal
    // pad where fractions are meaningful.
    control = `<input type="${f.type}" id="${id}" name="${f.name}"
      ${f.step ? `step="${f.step}"` : ''} ${f.inputmode ? `inputmode="${f.inputmode}"` : ''}
      placeholder="${esc(f.placeholder || '')}" value="${esc(value)}">`
  }

  return `<div class="field" data-field="${f.name}">
    <label for="${id}">${esc(f.label)}${f.unit ? ` <span class="faint">(${f.unit})</span>` : ''}${f.required ? ' <span class="req">*</span>' : ''}</label>
    ${f.quick ? `<div class="chipset" style="margin-bottom:0.25rem">
      ${f.quick.map((q) => `<button type="button" class="chip" data-fill="${f.name}" data-value="${q}">${q}</button>`).join('')}
    </div>` : ''}
    ${f.recent ? `<div class="chipset" style="margin-bottom:0.25rem">
      ${f.recent.slice(0, 3).map((r) => `<button type="button" class="chip" data-fill="${f.name}" data-value="${esc(r)}">${esc(r)}</button>`).join('')}
    </div>` : ''}
    ${control}
    ${f.help ? `<span class="help">${esc(f.help)}</span>` : ''}
    <span class="err" role="alert"></span>
  </div>`
}

/* ── API client (new) ─────────────────────────────────────────────────── */
const API_BASE = 'http://localhost:3000'
let AUTH = { accessToken: null, refreshToken: null, user: null }

async function apiFetch(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) }
  if (AUTH.accessToken) headers['Authorization'] = `Bearer ${AUTH.accessToken}`
  const res = await fetch(`${API_BASE}${path}`, { ...opts, headers })

  if (res.status === 401 && AUTH.refreshToken && path !== '/auth/refresh') {
    const refreshed = await tryRefresh()
    if (refreshed) return apiFetch(path, opts)
    clearAuth()
    STATE_UI.route = 'login'
    render()
    throw new Error('Session expired. Please log in again.')
  }
  if (!res.ok) {
    const body = await res.json().catch(() => ({}))
    throw new Error(body.error || `Request failed (${res.status})`)
  }
  return res.status === 204 ? null : res.json()
}

async function tryRefresh() {
  try {
    const res = await fetch(`${API_BASE}/auth/refresh`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ refreshToken: AUTH.refreshToken }),
    })
    if (!res.ok) return false
    const data = await res.json()
    AUTH.accessToken = data.accessToken
    localStorage.setItem('lifeos_access', data.accessToken)
    return true
  } catch { return false }
}

function setAuth(data) {
  AUTH.accessToken = data.accessToken
  AUTH.refreshToken = data.refreshToken
  AUTH.user = data.user
  localStorage.setItem('lifeos_access', data.accessToken)
  localStorage.setItem('lifeos_refresh', data.refreshToken)
}
function clearAuth() {
  AUTH = { accessToken: null, refreshToken: null, user: null }
  localStorage.removeItem('lifeos_access')
  localStorage.removeItem('lifeos_refresh')
}
function loadAuth() {
  AUTH.accessToken = localStorage.getItem('lifeos_access')
  AUTH.refreshToken = localStorage.getItem('lifeos_refresh')
}

const AUTH_API = {
  async register(email, password) {
    const res = await fetch(`${API_BASE}/auth/register`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    })
    const data = await res.json()
    if (!res.ok) throw new Error(data.error || 'Registration failed')
    setAuth(data)
    return data
  },
  async login(email, password) {
    const res = await fetch(`${API_BASE}/auth/login`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    })
    const data = await res.json()
    if (!res.ok) throw new Error(data.error || 'Login failed')
    setAuth(data)
    return data
  },
  async logout() {
    try {
      await fetch(`${API_BASE}/auth/logout`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ refreshToken: AUTH.refreshToken }),
      })
    } catch {}
    clearAuth()
  },
}

async function loadAllData() {
  const [
    me, prefs, goals,
    weights, measurements, sleep, wellbeing, vitals, medications, appointments,
    sessions, plans,
    meals, water,
    habits,
    income, accounts, categories, transactions, debts, bills, subscriptions,
  ] = await Promise.all([
    apiFetch('/users/me'),
    apiFetch('/users/me/preferences'),
    apiFetch('/users/me/goals'),
    apiFetch('/health/weights'),
    apiFetch('/health/measurements'),
    apiFetch('/health/sleep'),
    apiFetch('/health/wellbeing'),
    apiFetch('/health/vitals'),
    apiFetch('/health/medications'),
    apiFetch('/health/appointments'),
    apiFetch('/fitness/sessions'),
    apiFetch('/fitness/plans'),
    apiFetch('/nutrition/meals'),
    apiFetch('/nutrition/water'),
    apiFetch('/habits'),
    apiFetch('/finance/income').catch(() => null),
    apiFetch('/finance/accounts'),
    apiFetch('/finance/categories'),
    apiFetch('/finance/transactions'),
    apiFetch('/finance/debts'),
    apiFetch('/finance/bills'),
    apiFetch('/finance/subscriptions'),
  ])

  const d = (iso) => (iso ? String(iso).slice(0, 10) : null)

  // Habit logs need one call per habit, keyed by habit id.
  const habitLogs = {}
  await Promise.all(habits.map(async (h) => {
    const logs = await apiFetch(`/habits/${h.id}/logs`)
    habitLogs[h.id] = {}
    for (const l of logs) habitLogs[h.id][d(l.date)] = { status: l.status, value: l.value }
  }))

  // Sessions need their nested exercises/sets fetched individually.
  const fullSessions = await Promise.all(
    sessions.map((s) => apiFetch(`/fitness/sessions/${s.id}`))
  )

  S = {
    profile: {
      displayName: me.displayName || me.email,
      dateOfBirth: d(me.dateOfBirth),
      heightCm: me.heightCm,
      sexAtBirth: me.sexAtBirth,
      activityLevel: me.activityLevel,
      restingHrBaseline: me.restingHrBaseline,
      dietType: me.dietType,
    },
    prefs: {
      currencyCode: prefs.currencyCode, locale: prefs.locale,
      dateFormat: prefs.dateFormat, units: prefs.units, weekStartsOn: 1,
    },
    goals: {
      primary: goals.primaryGoal, targetWeightKg: goals.targetWeightKg,
      calories: goals.dailyCalories, protein: goals.dailyProteinG,
      carbs: goals.dailyCarbsG, fat: goals.dailyFatG,
      waterMl: goals.dailyWaterMl, sleepMinutes: goals.dailySleepMinutes,
      workoutsPerWeek: goals.workoutsPerWeek,
    },

    weights: weights.map((w) => ({ id: w.id, date: d(w.date), kg: w.kg })),
    measurements: measurements.map((m) => ({ id: m.id, date: d(m.date), site: m.site, value: m.valueCm })),
    sleep: sleep.map((s) => ({
      id: s.id, date: d(s.date), durationMinutes: s.durationMinutes,
      quality: s.quality, interruptions: s.interruptions,
      bedtime: s.bedtime ? String(s.bedtime).slice(11, 16) : '',
      wake: s.wake ? String(s.wake).slice(11, 16) : '',
    })),
    wellbeing: wellbeing.map((w) => ({
      id: w.id, date: d(w.date), mood: w.mood, stress: w.stress,
      energy: w.energy, soreness: w.soreness, fatigue: w.fatigue,
    })),
    vitals: vitals.map((v) => ({
      id: v.id, date: d(v.recordedAt), kind: v.kind,
      value: v.value, systolic: v.systolic, diastolic: v.diastolic,
    })),
    medications: medications.map((m) => ({
      id: m.id, name: m.name, isPrescription: m.isPrescription,
      dosage: m.dosage, frequency: m.frequency,
      quantityLeft: m.quantityLeft, refillOn: d(m.refillOn),
    })),
    appointments: appointments.map((a) => ({
      id: a.id, title: a.title, scheduledAt: d(a.scheduledAt),
      provider: a.provider, location: a.location,
    })),

/* ── Remote-backed features: Analytics, Calendar, Reviews, Search (new) ── */

async function fetchCalendar(from, to) {
  const q = new URLSearchParams({ from, to }).toString()
  const data = await apiFetch(`/calendar?${q}`)
  STATE_UI.remoteCalendar = data
  return data
}

async function fetchWeeklyReview() {
  const data = await apiFetch('/reviews/weekly')
  STATE_UI.remoteReview = data
  return data
}

async function fetchAnalyticsInsights() {
  const data = await apiFetch('/analytics/insights')
  STATE_UI.remoteInsights = data
  return data
}

async function fetchSearch(query) {
  if (query.trim().length < 2) {
    STATE_UI.remoteSearchResults = null
    return null
  }
  const data = await apiFetch(`/search?q=${encodeURIComponent(query.trim())}`)
  STATE_UI.remoteSearchResults = data
  return data
}

}

function renderChrome() {
  el.sidebarNav.innerHTML = NAV.map(([id, label, icon]) => `
    <a href="#${id}" class="s-link" data-goto="${id}" ${STATE_UI.route === id ? 'aria-current="page"' : ''}>
      ${ICON(icon, 20, STATE_UI.route === id ? 2.2 : 1.8)}
      <span class="s-label">${label}</span>
    </a>`).join('')

  el.bottomTabs.innerHTML = [
    ...MOBILE_PRIMARY.slice(0, 2).map(tabHtml),
    `<div style="display:grid;place-items:center">
       <button class="fab" data-open-sheet="quickadd" aria-label="Quick add">${ICON('plus', 24, 2.4)}</button>
     </div>`,
    ...MOBILE_PRIMARY.slice(2, 4).map(tabHtml),
  ].join('')

  function tabHtml(id) {
    const item = NAV.find((n) => n[0] === id)
    const active = STATE_UI.route === id
    return `<a href="#${id}" class="navtab" data-goto="${id}" ${active ? 'aria-current="page"' : ''}>
      ${ICON(item[2], 21, active ? 2.4 : 1.8)}${item[1]}<span class="dot"></span></a>`
  }

function render() {
  const isAuthScreen = STATE_UI.route === 'login' || STATE_UI.route === 'register'
  const view = VIEWS[STATE_UI.route] || VIEWS.home
  el.view.innerHTML = view(STATE_UI.sub)

  el.sidebar.style.display = isAuthScreen ? 'none' : ''
  document.querySelector('.bottomnav').style.display = isAuthScreen ? 'none' : ''
  el.app.style.paddingLeft = isAuthScreen ? '0' : ''

  if (!isAuthScreen) renderChrome()
  window.scrollTo({ top: 0, behavior: 'instant' })
  document.title = isAuthScreen ? 'LifeOS' : `${NAV.find((n) => n[0] === STATE_UI.route)?.[1] || 'Home'} · LifeOS`
}

function go(route, sub) {
  STATE_UI.route = route
  STATE_UI.sub = sub || null
  location.hash = sub ? `${route}/${sub}` : route
  render()

  if (route === 'calendar') {
    const from = dateKey(new Date())
    const to = dateKey(Date.now() + 30 * DAY)
    fetchCalendar(from, to).then(render).catch(() => {})
  }
  if (route === 'review') {
    fetchWeeklyReview().then(render).catch(() => {})
  }
  if (route === 'analytics') {
    fetchAnalyticsInsights().then(render).catch(() => {})
  }
}

function readHash() {
  const [route, sub] = (location.hash.replace('#', '') || 'home').split('/')
  STATE_UI.route = VIEWS[route] ? route : 'home'
  STATE_UI.sub = sub || null
}

/* ── Sheets ─────────────────────────────────────────────────────────────── */
function openSheet(key) {
  const spec = SHEETS[key]
  if (!spec) return
  STATE_UI.sheet = key
  el.sheetTitle.textContent = spec.title
  el.sheetDesc.textContent = spec.desc || ''
  el.sheetBody.innerHTML = renderSheet(key)
  el.overlay.classList.add('open')
  el.sheet.classList.add('open')
  document.body.style.overflow = 'hidden'
  // Focus the first control so keyboard and screen-reader users land inside.
  setTimeout(() => {
    const first = el.sheetBody.querySelector('input,select,button')
    if (first) first.focus()
  }, 260)
}

function closeSheet() {
  STATE_UI.sheet = null
  el.sheet.classList.remove('open')
  el.overlay.classList.remove('open')
  document.body.style.overflow = ''
}

/* ── Toast with undo ────────────────────────────────────────────────────── */
let toastTimer = null
let pendingUndo = null

function toast(message, undo) {
  clearTimeout(toastTimer)
  el.toastMsg.textContent = message
  pendingUndo = undo || null
  el.toastAction.hidden = !undo
  el.toast.classList.add('open')
  toastTimer = setTimeout(() => {
    el.toast.classList.remove('open')
    pendingUndo = null
  }, undo ? 6000 : 3000)
}

/* ── Form handling ──────────────────────────────────────────────────────── */
function handleSubmit(form) {
  const key = form.dataset.sheet
  const spec = SHEETS[key]
  const vals = {}
  new FormData(form).forEach((v, k) => { vals[k] = v })

  let firstBad = null
  form.querySelectorAll('.field').forEach((fieldEl) => {
    fieldEl.classList.remove('invalid')
    fieldEl.querySelector('.err').textContent = ''
  })

  for (const f of spec.fields) {
    const fieldEl = form.querySelector(`[data-field="${f.name}"]`)
    let error = null
    if (f.required && !vals[f.name]) error = `${f.label} is required.`
    else if (f.validate) error = f.validate(vals[f.name])
    if (error) {
      fieldEl.classList.add('invalid')
      fieldEl.querySelector('.err').textContent = error
      if (!firstBad) firstBad = fieldEl
    }
  }

  if (!firstBad && spec.validateAll) {
    const errors = spec.validateAll(vals)
    if (errors) {
      for (const [name, msg] of Object.entries(errors)) {
        const fieldEl = form.querySelector(`[data-field="${name}"]`)
        if (fieldEl) {
          fieldEl.classList.add('invalid')
          fieldEl.querySelector('.err').textContent = msg
          if (!firstBad) firstBad = fieldEl
        }
      }
    }
  }

  if (firstBad) {
    firstBad.scrollIntoView({ block: 'center', behavior: 'smooth' })
    const input = firstBad.querySelector('input,select')
    if (input) input.focus()
    return
  }

  if (spec.submitApi) {
    closeSheet()
    toast('Saving…')
    spec.submitApi(vals)
      .then(() => loadAllData())
      .then(() => { render(); toast(spec.successMessage ? spec.successMessage(vals) : 'Saved') })
      .catch((err) => toast(err.message || 'Could not save'))
    return
  }

  const result = spec.submit(vals)
  closeSheet()
  render()
  toast(result.message, result.undo)
}

/* ── Actions ────────────────────────────────────────────────────────────── */
function runAction(act) {
  if (!act || act === 'noop') {
    toast('Not built yet — that screen arrives in a later phase.')
    return
  }
  const [verb, ...rest] = act.split(':')
  const arg = rest.join(':')

  switch (verb) {
    case 'sheet':
      openSheet(arg); break
    case 'goto': {
      const [route, sub] = arg.split(':')
      closeSheet(); go(route, sub); break
    }
    case 'subtab': {
      const [route, sub] = arg.split(':')
      go(route, sub); break
    }
    case 'water': {
      const ml = parseInt(arg, 10)
      apiFetch('/nutrition/water', {
        method: 'POST',
        body: JSON.stringify({ date: dateKey(new Date()), amountMl: ml }),
      })
        .then(() => loadAllData())
        .then(() => { render(); toast(`${ml} ml added · ${(SEL.waterOn(dateKey(new Date())) / 1000).toFixed(1)} L today`) })
        .catch((err) => toast(err.message || 'Could not save'))
      break
    }
    case 'water-500':
      runAction('water:500'); break
    case 'habit': {
      const today = dateKey(new Date())
      const logs = S.habitLogs[arg] || {}
      const habit = S.habits.find((h) => h.id === arg)
      const wasDone = logs[today] && logs[today].status === 'done'

      const req = wasDone
        ? apiFetch(`/habits/${arg}/logs/${today}`, { method: 'DELETE' })
        : apiFetch(`/habits/${arg}/logs/${today}`, { method: 'PUT', body: JSON.stringify({ status: 'done' }) })

      req.then(() => loadAllData())
        .then(() => { render(); toast(wasDone ? `${esc(habit.name)} unmarked` : `${esc(habit.name)} done`) })
        .catch((err) => toast(err.message || 'Could not save'))
      break
    }
    case 'repeat-yesterday': {
      const yest = SEL.nutritionOn(daysAgo(1))
      if (!yest.meals.length) { toast('Nothing was logged yesterday to copy.'); return }
      const added = yest.meals.map((m) => ({ ...m, id: 'meal-' + Math.random(), date: dateKey(new Date()) }))
      S.meals.push(...added)
      render()
      toast(`${added.length} meals copied from yesterday`,
        () => { S.meals = S.meals.filter((m) => !added.includes(m)) })
      break
    }
    case 'session': {
      const s = S.sessions.find((x) => x.id === arg)
      if (!s) { toast('That session is no longer available.'); return }
      showSessionDetail(s)
      break
    }
    case 'exercise':
      STATE_UI.focusExercise = arg
      go('fitness', 'progress')
      break
    default:
      toast('Not built yet — that screen arrives in a later phase.')
  }
}

function showSessionDetail(s) {

  const vol = CALC.trainingVolume(sets)
  el.sheetTitle.textContent = s.title
  el.sheetDesc.textContent = `${FMT.relDay(s.date)} · ${s.status}`
  el.sheetBody.innerHTML = `
    <div class="grid-3" style="margin-bottom:1rem">
      ${statCard('Volume', metricBlock(vol, (v) => FMT.num(v), { compact: true }), 'kg, working sets')}
      ${statCard('Duration', `<span class="t-fig fig">${FMT.duration(s.durationMinutes)}</span>`, '')}
      ${statCard('Effort', `<span class="t-fig fig">${s.perceivedEffort || '—'}</span>`, 'out of 10')}
    </div>
    ${s.exercises.length ? s.exercises.map((e) => `
      <div class="card" style="margin-bottom:0.5rem">
        <div class="card-pad" style="padding-bottom:0.5rem"><div class="t-label semi">${esc(e.name)}</div></div>
        <table class="chart-data" style="margin:0 0 0.5rem">
          <thead><tr><th scope="col">Set</th><th scope="col">Weight</th><th scope="col">Reps</th><th scope="col">RPE</th></tr></thead>
          <tbody>
            ${e.sets.map((st, i) => `<tr style="${st.kind === 'warmup' ? 'opacity:0.5' : ''}">
              <td>${st.kind === 'warmup' ? 'W' : i}</td>

  el.overlay.classList.add('open')

/* ── Event wiring ───────────────────────────────────────────────────────── */
document.addEventListener('click', (e) => {
  const t = e.target

  const explain = t.closest('[data-explain]')
  if (explain) {
    const id = explain.dataset.explain
    if (id === 'bmi') openBmiExplainer()
    else openExplainer(id)
    return
  }

  const openBtn = t.closest('[data-open-sheet]')
  if (openBtn) { openSheet(openBtn.dataset.openSheet); return }

  if (t.closest('[data-close-sheet]')) { closeSheet(); return }
  if (t.closest('[data-close-explainer]')) { closeExplainer(); return }

  const goBtn = t.closest('[data-goto]')
  if (goBtn) { e.preventDefault(); closeSheet(); go(goBtn.dataset.goto); return }

  const subtab = t.closest('[data-subtab]')
  if (subtab) {
    const [route, sub] = subtab.dataset.subtab.split(':')
    go(route, sub)
    return
  }

  const fill = t.closest('[data-fill]')
  if (fill) {
    const input = document.querySelector(`[name="${fill.dataset.fill}"]`)
    if (input) { input.value = fill.dataset.value; input.dispatchEvent(new Event('input')) }
    return
  }

  const rating = t.closest('[data-rating]')
  if (rating) {
    const group = rating.parentElement
    group.querySelectorAll('[data-rating]').forEach((b) => b.setAttribute('aria-pressed', 'false'))
    rating.setAttribute('aria-pressed', 'true')
    group.querySelector('input[type="hidden"]').value = rating.dataset.value
    return
  }

  const actBtn = t.closest('[data-act]')
  if (actBtn) { runAction(actBtn.dataset.act); return }
})

   Ordered the same way as the health module above: data, then calculations
   ported from src/lib/calculations/finance.ts, then selectors, then views.

   Two rules that run through all of it:

     · Money is never a float. Every amount is stored in paise as an integer
       and divided only at the point of display. 0.1 + 0.2 !== 0.3 is a
       curiosity in a chart library and a defect in a ledger.

     · Nothing here gives advice. The affordability simulator has no
       "approved" field on purpose, the discipline score says in its own
       explainer that it is not a credit score, and no screen recommends a
       fund, a loan or a purchase. It shows what the numbers do and leaves
       the decision where it belongs.

  /* ── Transactions: six months, weighted so each category lands near but
        not on its budget, with a few deliberate overshoots. ─────────────── */

    c1:  ['Rent — landlord transfer'],

    const daysInMonth = new Date(year, month + 1, 0).getDate()
    const isCurrentMonth = monthsBack === 0
    const lastDay = isCurrentMonth ? new Date().getDate() : daysInMonth

    fin.transactions.push({
      id: 't' + ++txnSeq, date: dateKey(new Date(year, month, 1)),
      direction: 'income', amountPaise: fin.income.monthlyNetPaise,
      accountId: 'ac2', categoryId: null, merchant: 'Salary', need: null,
    })

    for (const cat of fin.categories) {
      // Some months run over. Shopping and eating out are the usual suspects.
      const overshoot = (cat.id === 'c8' && monthsBack === 1) ? 1.62
                      : (cat.id === 'c3' && monthsBack === 0) ? 1.28
                      : 0.82 + rand() * 0.34
      const monthTarget = Math.round(cat.budgetPaise * overshoot * (lastDay / daysInMonth))

      if (cat.id === 'c1' || cat.id === 'c10') {
        // Single fixed payment, early in the month.
        if (lastDay >= 5) {
          fin.transactions.push({
            id: 't' + ++txnSeq, date: dateKey(new Date(year, month, cat.id === 'c1' ? 5 : 3)),
            direction: 'expense', amountPaise: cat.budgetPaise, accountId: 'ac1',
            categoryId: cat.id, merchant: MERCHANTS[cat.id][0], need: cat.need,
          })
        }
        continue
      }

      let spent = 0
      let guard = 0
      while (spent < monthTarget && guard++ < 40) {
        const remaining = monthTarget - spent
        const amount = Math.min(remaining, Math.round((0.08 + rand() * 0.28) * cat.budgetPaise))
        if (amount < P(40)) break
        const day = 1 + Math.floor(rand() * lastDay)
        const names = MERCHANTS[cat.id]
        fin.transactions.push({
          id: 't' + ++txnSeq, date: dateKey(new Date(year, month, day)),
          direction: 'expense', amountPaise: amount,
          accountId: rand() > 0.55 ? 'ac4' : rand() > 0.5 ? 'ac1' : 'ac5',
          categoryId: cat.id, merchant: names[Math.floor(rand() * names.length)], need: cat.need,

        spent += amount
      }
    }

    // EMIs and SIPs leave the account too — they are real outflows, and a
    // cashflow figure that ignores them is a fiction.
    for (const debt of fin.debts) {
      if (lastDay >= 7) {
        fin.transactions.push({
          id: 't' + ++txnSeq, date: dateKey(new Date(year, month, 7)),
          direction: 'expense', amountPaise: debt.emiPaise, accountId: 'ac1',
          categoryId: null, merchant: `${esc(debt.name)} EMI`, need: 'need', isDebtPayment: true, debtId: debt.id,

    }
    for (const inv of fin.investments) {
      if (inv.sipPaise > 0 && lastDay >= inv.sipDay) {
        fin.transactions.push({
          id: 't' + ++txnSeq, date: dateKey(new Date(year, month, inv.sipDay)),
          direction: 'transfer', amountPaise: inv.sipPaise, accountId: 'ac1',
          categoryId: null, merchant: `${esc(inv.name)} SIP`, need: null, isInvestment: true, investmentId: inv.id,
        })
      }
    }
  }

  fin.transactions.sort((a, b) => b.date.localeCompare(a.date))

  /* ── Net worth history, 12 monthly snapshots. ───────────────────────── */
  for (let m = 11; m >= 0; m--) {
    const d = new Date()
    d.setMonth(d.getMonth() - m, 1)
    const growth = (11 - m) / 11
    fin.netWorthHistory.push({
      date: dateKey(d),
      value: Math.round((1_180_000 + growth * 742_000 + (rand() - 0.5) * 48_000)),
    })
  }

  return { finance: fin }
}

/* ─── Finance calculations, ported from src/lib/calculations/finance.ts ──── */

const FCALC = {
  /* Reducing-balance EMI. The zero-rate case is a genuine product — most
     "no cost EMI" offers really are 0% — and dividing by a zero rate would
     produce NaN, so it is handled explicitly rather than guarded against. */
  emi(principalPaise, annualRatePct, termMonths) {
    if (!(principalPaise > 0)) return missing('No amount was entered.', 'Enter the amount financed.')
    if (!(termMonths >= 1)) return missing('No tenure was entered.', 'Enter the number of months.')
    if (annualRatePct < 0) return missing('The interest rate cannot be negative.', 'Check the rate.')

    if (annualRatePct === 0) {
      return ok(Math.round(principalPaise / termMonths),
        { principalPaise, annualRatePct, termMonths },
        'A zero-interest schedule. Check whether a processing fee applies — it usually does.')
    }

    const r = annualRatePct / 12 / 100
    const factor = Math.pow(1 + r, termMonths)
    return ok(Math.round((principalPaise * r * factor) / (factor - 1)),
      { principalPaise, annualRatePct, termMonths })
  },

  /* Outstanding balance after n payments, by running the schedule rather
     than using a closed form — the two disagree by a few paise once
     rounding to the nearest paisa is applied, and the schedule is what the
     lender actually does. */
  outstandingAfter(principalPaise, annualRatePct, termMonths, paymentsMade) {
    const emi = FCALC.emi(principalPaise, annualRatePct, termMonths)
    if (!isOk(emi)) return emi

    const r = annualRatePct / 12 / 100
    let balance = principalPaise
    let interestPaid = 0

    for (let i = 0; i < Math.min(paymentsMade, termMonths); i++) {
      const interest = Math.round(balance * r)
      const principalPart = Math.min(emi.value - interest, balance)
      balance -= principalPart
      interestPaid += interest
      if (balance <= 0) { balance = 0; break }
    }

    return ok({
      outstandingPaise: balance,
      interestPaidPaise: interestPaid,
      principalPaidPaise: principalPaise - balance,
      paymentsRemaining: Math.max(0, termMonths - paymentsMade),
      emiPaise: emi.value,
    }, { principalPaise, annualRatePct, termMonths, paymentsMade })
  },

  totalInterest(principalPaise, annualRatePct, termMonths) {
    const emi = FCALC.emi(principalPaise, annualRatePct, termMonths)
    if (!isOk(emi)) return emi
    return ok(emi.value * termMonths - principalPaise, { emiPaise: emi.value, termMonths })
  },

  /* Snowball orders by smallest balance, avalanche by highest rate.
     Both are simulated month by month against the same extra payment, so
     the comparison is like for like. */
  simulatePayoff(debts, extraMonthlyPaise, strategy) {
    const live = debts
      .filter((d) => d.outstandingPaise > 0)
      .map((d) => ({ ...d }))

    if (live.length === 0) {
      return missing('There is no outstanding debt to simulate.', 'Add a loan or EMI first.')
    }

    const order = strategy === 'avalanche'
      ? [...live].sort((a, b) => b.annualRatePct - a.annualRatePct || a.outstandingPaise - b.outstandingPaise)
      : [...live].sort((a, b) => a.outstandingPaise - b.outstandingPaise)

    let month = 0
    let totalInterest = 0
    const clearedAt = {}
    // Freed-up EMIs roll into the next debt. That rolling is the whole
    // mechanism of both methods — a simulation that omits it understates
    // them equally and makes the comparison meaningless.
    let rolling = extraMonthlyPaise

    while (order.some((d) => d.outstandingPaise > 0) && month < 600) {
      month++

      // 1 · Every live debt accrues interest and receives its minimum EMI.
      for (const debt of order) {
        if (debt.outstandingPaise <= 0) continue
        const monthlyRate = debt.annualRatePct / 12 / 100
        const interest = Math.round(debt.outstandingPaise * monthlyRate)
        totalInterest += interest
        debt.outstandingPaise += interest
        const payment = Math.min(debt.emiPaise, debt.outstandingPaise)
        debt.outstandingPaise -= payment
      }

      // 2 · Everything spare goes to the first debt in the chosen order,
      //     cascading onward if that debt clears mid-month.
      let spare = rolling
      for (const debt of order) {
        if (spare <= 0) break
        if (debt.outstandingPaise <= 0) continue
        const applied = Math.min(spare, debt.outstandingPaise)
        debt.outstandingPaise -= applied
        spare -= applied
      }

      // 3 · Record anything cleared and roll its EMI forward.
      for (const debt of order) {
        if (debt.outstandingPaise <= 0 && !clearedAt[debt.id]) {
          clearedAt[debt.id] = month
          rolling += debt.emiPaise
        }
      }
    }

    if (month >= 600) {
      return missing('These payments never clear the balance.',
        'The monthly payment is below the interest accruing. Increase it to see a schedule.')
    }

    return ok({
      months: month,
      totalInterestPaise: totalInterest,
      clearedAt,
      order: order.map((d) => d.name),
      strategy,
    }, { debtCount: live.length, extraMonthlyPaise, strategy })
  },

  savingsRate(incomePaise, expensePaise) {
    if (!(incomePaise > 0)) {
      return missing('No income has been recorded for this period.', 'Log your income to see this.')
    }
    // Deliberately allowed to go negative. A month where you spent more than
    // you earned is information, and clamping it at zero hides exactly the
    // month you most need to see.
    return ok(round(((incomePaise - expensePaise) / incomePaise) * 100, 1),
      { incomePaise, expensePaise })
  },

  netWorth(assetsPaise, liabilitiesPaise) {
    if (assetsPaise === 0 && liabilitiesPaise === 0) {
      return missing('No accounts, assets or debts have been added.', 'Add an account to begin.')
    }
    return ok({
      netPaise: assetsPaise - liabilitiesPaise,
      assetsPaise, liabilitiesPaise,
    }, { assetsPaise, liabilitiesPaise })
  },

  debtToIncome(monthlyDebtPaise, monthlyIncomePaise) {
    if (!(monthlyIncomePaise > 0)) {
      return missing('No monthly income has been set.', 'Add your income in Settings.')
    }
    const ratio = round((monthlyDebtPaise / monthlyIncomePaise) * 100, 1)
    return ok({
      ratio,
      band: ratio <= 20 ? 'low' : ratio <= 36 ? 'moderate' : ratio <= 50 ? 'elevated' : 'high',
    }, { monthlyDebtPaise, monthlyIncomePaise },
      'Lenders use varying definitions of this ratio. Yours may be assessed differently.')
  },

  budgetUsage(spentPaise, budgetPaise) {
    if (!(budgetPaise > 0)) return missing('No budget is set for this category.', 'Set a budget to track it.')
    const pct = round((spentPaise / budgetPaise) * 100, 0)
    return ok({
      percent: pct,
      remainingPaise: budgetPaise - spentPaise,
      state: pct <= 75 ? 'on_track' : pct <= 100 ? 'close' : 'over',
    }, { spentPaise, budgetPaise })
  },

  /* Refuses to forecast before day 3. Two days of spending extrapolated
     across a month is not a projection, it is a rumour. */
  forecastMonthEndSpend(spentSoFarPaise, dayOfMonth, daysInMonth) {
    if (dayOfMonth < 3) {
      return missing('It is too early in the month to project a total.',
        'A forecast appears from the third day.')
    }
    const projected = Math.round((spentSoFarPaise / dayOfMonth) * daysInMonth)
    return ok({
      projectedPaise: projected,
      dailyAveragePaise: Math.round(spentSoFarPaise / dayOfMonth),
      daysRemaining: daysInMonth - dayOfMonth,
    }, { spentSoFarPaise, dayOfMonth, daysInMonth },
      dayOfMonth < 10 ? 'Based on under ten days, so this will move a lot yet.' : undefined)
  },

  investmentGain(investedPaise, currentPaise) {
    if (!(investedPaise > 0)) return missing('No purchase cost has been recorded.', 'Add your cost basis.')
    const absolute = currentPaise - investedPaise
    return ok({
      absolutePaise: absolute,
      percent: round((absolute / investedPaise) * 100, 2),
    }, { investedPaise, currentPaise })
  },

  /* XIRR by Newton–Raphson with a bisection fallback. Newton converges fast
     on well-behaved flows and diverges on the ones a real SIP produces, so
     the fallback is not optional. */
  xirr(flows, guess = 0.1) {
    if (flows.length < 2) return missing('At least two cash flows are needed.', 'Add more transactions.')
    const hasPositive = flows.some((f) => f.amount > 0)
    const hasNegative = flows.some((f) => f.amount < 0)
    if (!hasPositive || !hasNegative) {
      return missing('A return needs both money in and money out.', 'Record the current value as an inflow.')
    }

    const t0 = new Date(flows[0].date).getTime()
    const npv = (rate) => flows.reduce((sum, f) => {
      const years = (new Date(f.date).getTime() - t0) / (365 * DAY)
      return sum + f.amount / Math.pow(1 + rate, years)
    }, 0)

    let rate = guess
    for (let i = 0; i < 60; i++) {
      const value = npv(rate)
      if (Math.abs(value) < 1e-4) return ok(round(rate * 100, 2), { flowCount: flows.length, method: 'newton' })
      const derivative = (npv(rate + 1e-6) - value) / 1e-6
      if (!isFinite(derivative) || derivative === 0) break
      const next = rate - value / derivative
      if (!isFinite(next) || next <= -0.9999) break
      rate = next
    }

    let low = -0.9999, high = 10
    if (npv(low) * npv(high) > 0) {
      return missing('A rate of return could not be computed from these flows.',
        'Check the dates and amounts.')
    }
    for (let i = 0; i < 200; i++) {
      const mid = (low + high) / 2
      if (npv(low) * npv(mid) <= 0) high = mid
      else low = mid
    }
    return ok(round(((low + high) / 2) * 100, 2), { flowCount: flows.length, method: 'bisection' })
  },

  goalProgress(savedPaise, targetPaise, targetDate, monthlyContributionPaise) {
    if (!(targetPaise > 0)) return missing('No target amount is set.', 'Set a target for this goal.')

    const percent = round(Math.min(100, (savedPaise / targetPaise) * 100), 1)
    const shortfall = Math.max(0, targetPaise - savedPaise)
    const monthsLeft = targetDate
      ? Math.max(0, Math.round((new Date(targetDate) - new Date()) / (DAY * 30.44)))
      : null

    const requiredMonthly = monthsLeft && monthsLeft > 0 ? Math.round(shortfall / monthsLeft) : null
    const monthsAtCurrentRate = monthlyContributionPaise > 0
      ? Math.ceil(shortfall / monthlyContributionPaise)
      : null

    return ok({
      percent, shortfallPaise: shortfall, monthsLeft, requiredMonthlyPaise: requiredMonthly,
      monthsAtCurrentRate,
      onTrack: requiredMonthly === null || monthlyContributionPaise >= requiredMonthly,
    }, { savedPaise, targetPaise, monthlyContributionPaise })
  },

  /* Affordability.
     There is deliberately no `approved`, `verdict` or `recommendation` field
     on this result, and there never should be. Whether someone can afford a
     phone depends on things this app cannot see: job security, family
     obligations, what else is coming. The honest thing to compute is what
     changes if they go ahead, shown plainly, and then get out of the way. */
  simulateAffordability(input) {
    const {
      pricePaise, downPaymentPaise, annualRatePct, termMonths,
      monthlyIncomePaise, existingDebtPaise, monthlySurplusPaise,
      emergencyFundPaise, monthlyEssentialsPaise,
    } = input

    const financed = pricePaise - downPaymentPaise
    if (financed <= 0) {
      return ok({
        emiPaise: 0, totalCostPaise: pricePaise, totalInterestPaise: 0,
        newDtiPercent: round((existingDebtPaise / monthlyIncomePaise) * 100, 1),
        currentDtiPercent: round((existingDebtPaise / monthlyIncomePaise) * 100, 1),
        surplusAfterPaise: monthlySurplusPaise,
        emergencyMonthsBefore: monthlyEssentialsPaise > 0 ? round(emergencyFundPaise / monthlyEssentialsPaise, 1) : null,
        emergencyMonthsAfter: monthlyEssentialsPaise > 0 ? round((emergencyFundPaise - downPaymentPaise) / monthlyEssentialsPaise, 1) : null,
        paidOutright: true,
      }, input, 'Paid outright, so there is no EMI — but the cash leaves your buffer today.')
    }

    const emi = FCALC.emi(financed, annualRatePct, termMonths)
    if (!isOk(emi)) return emi

    const totalPaid = emi.value * termMonths
    const currentDti = (existingDebtPaise / monthlyIncomePaise) * 100
    const newDti = ((existingDebtPaise + emi.value) / monthlyIncomePaise) * 100

    return ok({
      emiPaise: emi.value,
      financedPaise: financed,
      totalCostPaise: totalPaid + downPaymentPaise,
      totalInterestPaise: totalPaid - financed,
      currentDtiPercent: round(currentDti, 1),
      newDtiPercent: round(newDti, 1),
      surplusBeforePaise: monthlySurplusPaise,
      surplusAfterPaise: monthlySurplusPaise - emi.value,
      emergencyMonthsBefore: monthlyEssentialsPaise > 0 ? round(emergencyFundPaise / monthlyEssentialsPaise, 1) : null,
      emergencyMonthsAfter: monthlyEssentialsPaise > 0 ? round((emergencyFundPaise - downPaymentPaise) / monthlyEssentialsPaise, 1) : null,
      paidOutright: false,
      // Observations, not judgements. Each one states a fact the person can
      // check; none of them says what to do.
      observations: [
        emi.value > monthlySurplusPaise
          ? `The EMI is larger than your current monthly surplus of ${FMT.money(monthlySurplusPaise)}.`
          : null,
        newDti > 40
          ? `Debt payments would reach ${round(newDti, 1)}% of income, up from ${round(currentDti, 1)}%.`
          : null,
        (totalPaid - financed) > financed * 0.15
          ? `Interest adds ${FMT.money(totalPaid - financed)} — ${round(((totalPaid - financed) / financed) * 100, 0)}% on top of the financed amount.`
          : null,
        annualRatePct === 0
          ? 'A zero-interest offer. Check the processing fee, which is often charged separately.'
          : null,
      ].filter(Boolean),
    }, input)
  },

  /* Discipline score. Explicitly not a credit score, and the explainer says
     so — people will assume otherwise unless told. */
  financialDisciplineScore(input) {
    const { savingsRatePct, budgetAdherencePct, billsPaidOnTimePct, emergencyMonths } = input
    return CALC.composeScore([
      savingsRatePct !== null
        ? { label: 'Savings rate', value: round(Math.max(0, Math.min(100, (savingsRatePct / 25) * 100)), 0), weight: 0.35,
            detail: `${savingsRatePct}% of income kept, measured against a 25% reference` }
        : null,
      budgetAdherencePct !== null
        ? { label: 'Budget adherence', value: round(Math.min(100, budgetAdherencePct), 0), weight: 0.3,
            detail: `${budgetAdherencePct}% of categories finished within budget` }
        : null,
      billsPaidOnTimePct !== null
        ? { label: 'Bills paid on time', value: round(billsPaidOnTimePct, 0), weight: 0.2,
            detail: `${billsPaidOnTimePct}% of bills settled by their due date` }
        : null,
      emergencyMonths !== null
        ? { label: 'Emergency buffer', value: round(Math.min(100, (emergencyMonths / 6) * 100), 0), weight: 0.15,
            detail: `${emergencyMonths} months of essentials covered, against a 6-month reference` }
        : null,
    ], 'Savings rate carries 35%, budget adherence 30%, paying bills on time 20%, and the size of your emergency buffer 15%. The reference points — 25% saved, six months of essentials — are common rules of thumb, not rules. This is a measure of your own consistency and has nothing to do with a credit score or CIBIL rating.')
  },
}

/* ─── Money formatting ──────────────────────────────────────────────────── */

/* Indian digit grouping: ₹12,34,567 not ₹1,234,567. Intl handles this given
   the en-IN locale, which is why locale is a preference rather than a
   constant. */
FMT.money = function (paise, opts = {}) {
  if (paise == null || !isFinite(paise)) return '—'
  const rupees = paise / 100
  const { compact = false, showSign = false, decimals = null } = opts

  if (compact && Math.abs(rupees) >= 10000000) return `${sign()}₹${(Math.abs(rupees) / 10000000).toFixed(2)} Cr`
  if (compact && Math.abs(rupees) >= 100000)   return `${sign()}₹${(Math.abs(rupees) / 100000).toFixed(2)} L`
  if (compact && Math.abs(rupees) >= 1000)     return `${sign()}₹${(Math.abs(rupees) / 1000).toFixed(1)}k`

  const d = decimals !== null ? decimals : (Math.abs(rupees) % 1 === 0 ? 0 : 2)
  return `${sign()}₹${new Intl.NumberFormat(S.prefs.locale, {
    minimumFractionDigits: d, maximumFractionDigits: d,
  }).format(Math.abs(rupees))}`

  function sign() {
    if (!showSign) return rupees < 0 ? '−' : ''
    return rupees > 0 ? '+' : rupees < 0 ? '−' : ''
  }
}

/* ─── Finance selectors ─────────────────────────────────────────────────── */

const FSEL = {
  monthBounds(offset = 0) {
    const d = new Date()
    d.setMonth(d.getMonth() - offset, 1)
    const year = d.getFullYear(), month = d.getMonth()
    return {
      from: dateKey(new Date(year, month, 1)),
      to: dateKey(new Date(year, month + 1, 0)),
      daysInMonth: new Date(year, month + 1, 0).getDate(),
      label: d.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' }),
    }
  },

  txnsInMonth(offset = 0) {
    const { from, to } = FSEL.monthBounds(offset)
    return S.finance.transactions.filter((t) => t.date >= from && t.date <= to)
  },

  monthSpend(offset = 0) {
    return FSEL.txnsInMonth(offset)
      .filter((t) => t.direction === 'expense')
      .reduce((sum, t) => sum + t.amountPaise, 0)
  },

  monthIncome(offset = 0) {
    return FSEL.txnsInMonth(offset)
      .filter((t) => t.direction === 'income')
      .reduce((sum, t) => sum + t.amountPaise, 0)
  },

  monthInvested(offset = 0) {
    return FSEL.txnsInMonth(offset)
      .filter((t) => t.isInvestment)
      .reduce((sum, t) => sum + t.amountPaise, 0)
  },

  spendByCategory(offset = 0) {
    const txns = FSEL.txnsInMonth(offset).filter((t) => t.direction === 'expense' && t.categoryId)
    const totals = new Map()
    for (const t of txns) totals.set(t.categoryId, (totals.get(t.categoryId) || 0) + t.amountPaise)
    return S.finance.categories
      .map((c) => ({ ...c, spentPaise: totals.get(c.id) || 0 }))
      .sort((a, b) => b.spentPaise - a.spentPaise)
  },

  needsWantsSplit(offset = 0) {
    const txns = FSEL.txnsInMonth(offset).filter((t) => t.direction === 'expense')
    const need = txns.filter((t) => t.need === 'need').reduce((s, t) => s + t.amountPaise, 0)
    const want = txns.filter((t) => t.need === 'want').reduce((s, t) => s + t.amountPaise, 0)
    return { need, want, total: need + want }
  },

  /* Liquid assets exclude credit cards, whose negative balance is a liability
     and gets counted on the other side of the ledger. */
  liquidPaise() {
    return S.finance.accounts
      .filter((a) => a.kind !== 'credit_card')
      .reduce((sum, a) => sum + a.balancePaise, 0)
  },

  cardDebtPaise() {
    return S.finance.accounts
      .filter((a) => a.kind === 'credit_card')
      .reduce((sum, a) => sum + Math.abs(Math.min(0, a.balancePaise)), 0)
  },

  investedValuePaise() {
    return S.finance.investments.reduce((sum, i) => sum + Math.round(i.units * i.currentNavPaise), 0)
  },

  investedCostPaise() {
    return S.finance.investments.reduce((sum, i) => sum + Math.round(i.units * i.avgCostPaise), 0)
  },

  assetsPaise() {
    return S.finance.assets.reduce((sum, a) => sum + a.valuePaise, 0)
  },

  /* Every debt's live outstanding balance, recomputed from its schedule
     rather than stored — a stored balance drifts the moment a payment is
     recorded out of order. */
  debtsWithOutstanding() {
    return S.finance.debts.map((d) => {
      const state = FCALC.outstandingAfter(d.principalPaise, d.annualRatePct, d.termMonths, d.paidMonths)
      return {
        ...d,
        outstandingPaise: isOk(state) ? state.value.outstandingPaise : d.principalPaise,
        interestPaidPaise: isOk(state) ? state.value.interestPaidPaise : 0,
        paymentsRemaining: isOk(state) ? state.value.paymentsRemaining : d.termMonths,
      }
    })
  },

  totalDebtPaise() {
    return FSEL.debtsWithOutstanding().reduce((s, d) => s + d.outstandingPaise, 0) + FSEL.cardDebtPaise()
  },

  monthlyEmiPaise() {
    return FSEL.debtsWithOutstanding()
      .filter((d) => d.outstandingPaise > 0)
      .reduce((s, d) => s + d.emiPaise, 0)
  },

  netWorth() {
    const assets = FSEL.liquidPaise() + FSEL.investedValuePaise() + FSEL.assetsPaise()
    return FCALC.netWorth(assets, FSEL.totalDebtPaise())
  },

  /* Monthly essentials — what the emergency fund actually has to cover.
     Wants are excluded on purpose: in a genuine emergency they stop. */
  monthlyEssentialsPaise() {
    const needs = S.finance.categories
      .filter((c) => c.need === 'need')
      .reduce((s, c) => s + c.budgetPaise, 0)
    return needs + FSEL.monthlyEmiPaise()
  },

  emergencyMonths() {
    const essentials = FSEL.monthlyEssentialsPaise()
    if (essentials <= 0) return null
    return round(FSEL.liquidPaise() / essentials, 1)
  },

  monthlySurplusPaise() {
    const income = S.finance.income.monthlyNetPaise
    const budgeted = S.finance.categories.reduce((s, c) => s + c.budgetPaise, 0)
    const sips = S.finance.investments.reduce((s, i) => s + i.sipPaise, 0)
    return income - budgeted - FSEL.monthlyEmiPaise() - sips
  },

  upcoming(days = 21) {
    const items = []
    const today = new Date()
    const push = (day, item) => {
      // Next occurrence of that day-of-month, this month or next.
      let due = new Date(today.getFullYear(), today.getMonth(), day)
      if (due < new Date(dateKey(today))) due = new Date(today.getFullYear(), today.getMonth() + 1, day)
      const gap = Math.round((due - new Date(dateKey(today))) / DAY)
      if (gap <= days) items.push({ ...item, date: dateKey(due), inDays: gap })
    }

    for (const b of S.finance.bills) {
      push(b.dueDay, { kind: 'bill', name: b.name, amountPaise: b.amountPaise, autopay: b.autopay, variable: b.variable })
    }
    for (const d of FSEL.debtsWithOutstanding()) {
      if (d.outstandingPaise > 0) push(7, { kind: 'emi', name: `${esc(d.name)} EMI`, amountPaise: d.emiPaise, autopay: true })
    }
    for (const s of S.finance.subscriptions) {
      if (s.recurrence === 'monthly') push(s.dueDay, { kind: 'subscription', name: s.name, amountPaise: s.amountPaise, autopay: true })
    }
    for (const a of S.finance.accounts.filter((a) => a.kind === 'credit_card')) {
      push(a.dueDay, { kind: 'card', name: `${esc(a.name)} payment`, amountPaise: Math.abs(a.balancePaise), autopay: false })
    }
    for (const i of S.finance.insurance) {
      const gap = Math.round((new Date(i.renewalOn) - new Date(dateKey(today))) / DAY)
      if (gap >= 0 && gap <= days) {
        items.push({ kind: 'insurance', name: `${esc(i.provider)} renewal`, amountPaise: i.premiumPaise, date: i.renewalOn, inDays: gap, autopay: false })
      }
    }
    return items.sort((a, b) => a.inDays - b.inDays)
  },

  /* Cash flows for XIRR: SIPs out (negative), current value in (positive). */
  investmentFlows(investment) {
    const flows = []
    const monthlyTxns = S.finance.transactions
      .filter((t) => t.isInvestment && t.investmentId === investment.id)
      .sort((a, b) => a.date.localeCompare(b.date))

    if (investment.sipPaise > 0) {
      // Reconstruct the SIP history back to the start date — the transaction
      // log only holds six months.
      const start = new Date(investment.since)
      const cursor = new Date(start)
      while (cursor < new Date()) {
        flows.push({ date: dateKey(cursor), amount: -investment.sipPaise / 100 })
        cursor.setMonth(cursor.getMonth() + 1)
      }
    } else {
      flows.push({ date: investment.since, amount: -(investment.units * investment.avgCostPaise) / 100 })
    }

    flows.push({ date: dateKey(new Date()), amount: (investment.units * investment.currentNavPaise) / 100 })
    return flows
  },

  portfolioXirr() {
    const flows = []
    for (const inv of S.finance.investments) flows.push(...FSEL.investmentFlows(inv))
    flows.sort((a, b) => a.date.localeCompare(b.date))
    return FCALC.xirr(flows)
  },

  disciplineScore() {
    const income = FSEL.monthIncome(1)
    const spend = FSEL.monthSpend(1)
    const rate = FCALC.savingsRate(income, spend)

    const cats = FSEL.spendByCategory(1)
    const withBudget = cats.filter((c) => c.budgetPaise > 0)
    const withinBudget = withBudget.filter((c) => c.spentPaise <= c.budgetPaise).length
    const adherence = withBudget.length ? (withinBudget / withBudget.length) * 100 : null

    return FCALC.financialDisciplineScore({
      savingsRatePct: isOk(rate) ? rate.value : null,
      budgetAdherencePct: adherence,
      billsPaidOnTimePct: 94,   // derived from bill payment history in the real app
      emergencyMonths: FSEL.emergencyMonths(),
    })
  },

  financeAttention() {
    const items = []
    const now = FSEL.monthBounds(0)
    const day = new Date().getDate()

    const forecast = FCALC.forecastMonthEndSpend(FSEL.monthSpend(0), day, now.daysInMonth)
    const budgetTotal = S.finance.categories.reduce((s, c) => s + c.budgetPaise, 0)
    if (isOk(forecast) && forecast.value.projectedPaise > budgetTotal * 1.05) {
      items.push({
        tone: 'cau', icon: 'rupee',
        title: 'On track to exceed this month\u2019s budget',
        detail: `Projecting ${FMT.money(forecast.value.projectedPaise, { compact: true })} against a ${FMT.money(budgetTotal, { compact: true })} budget.`,
        action: { label: 'Spending', act: 'subtab:finance:spending' },
      })
    }

    for (const c of FSEL.spendByCategory(0)) {
      if (c.budgetPaise > 0 && c.spentPaise > c.budgetPaise) {
        items.push({
          tone: 'cau', icon: 'rupee',
          title: `${esc(c.name)} is over budget`,
          detail: `${FMT.money(c.spentPaise)} spent against ${FMT.money(c.budgetPaise)}.`,
          action: { label: 'View', act: 'subtab:finance:spending' },
        })
        break   // one is a signal; five is noise
      }
    }

    for (const a of S.finance.accounts.filter((x) => x.kind === 'credit_card')) {
      const used = Math.abs(a.balancePaise) / a.limitPaise
      if (used > 0.3) {
        items.push({
          tone: used > 0.5 ? 'neg' : 'cau', icon: 'rupee',
          title: `${esc(a.name)} is at ${Math.round(used * 100)}% of its limit`,
          detail: `${FMT.money(Math.abs(a.balancePaise))} outstanding, due on the ${a.dueDay}th.`,
          action: { label: 'Cards', act: 'subtab:finance:accounts' },
        })
      }
    }

    const stale = S.finance.subscriptions.filter((s) => s.lastUsedDaysAgo > 30)
    if (stale.length) {
      const total = stale.reduce((s, x) => s + x.amountPaise, 0)
      items.push({
        tone: 'cau', icon: 'repeat',
        title: `${stale.length} subscriptions unused for over a month`,
        detail: `${stale.map((s) => s.name).join(', ')} — ${FMT.money(total)} a month, ${FMT.money(total * 12)} a year.`,
        action: { label: 'Review', act: 'subtab:finance:spending' },
      })
    }

    for (const i of S.finance.insurance) {
      const gap = Math.round((new Date(i.renewalOn) - new Date(dateKey(new Date()))) / DAY)
      if (gap >= 0 && gap <= 30) {
        items.push({
          tone: gap <= 10 ? 'neg' : 'cau', icon: 'file',
          title: `${esc(i.provider)} policy renews ${FMT.relDay(i.renewalOn).toLowerCase()}`,
          detail: `${FMT.money(i.premiumPaise)} premium · ${FMT.money(i.coverPaise, { compact: true })} cover.`,
          action: { label: 'View', act: 'subtab:finance:goals' },
        })
      }
    }

    const em = FSEL.emergencyMonths()
    if (em !== null && em < 3) {
      items.push({
        tone: 'cau', icon: 'rupee',
        title: 'Emergency buffer under three months',
        detail: `${em} months of essentials covered by liquid savings.`,
        action: { label: 'Goals', act: 'subtab:finance:goals' },
      })
    }

    return items
  },
}

      ${statCard('Invested monthly',

    <!-- Upcoming -->

      ${sectionHead('Due in the next 14 days')}
      <div class="card divide" style="margin-top:0.5rem">
        ${upcoming.length ? upcoming.slice(0, 8).map((u) => `
          <div class="card-pad row-between">
            <div style="min-width:0">
              <div class="row" style="gap:0.375rem">
                <span class="t-label semi">${esc(u.name)}</span>
                ${u.autopay ? '<span class="badge">Autopay</span>' : ''}
                ${u.variable ? '<span class="badge">Varies</span>' : ''}

            </div>
            <span class="t-body fig semi">${FMT.money(u.amountPaise)}</span>

    <!-- Quick actions -->
