<!doctype html>
<html lang="en" class="">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover" />
<title>LifeOS — Phase 2 Dashboard</title>
<meta name="theme-color" content="#f5f6f9" />
<!--
  ═══════════════════════════════════════════════════════════════════════════
  LifeOS · Phase 2 dashboard prototype
  ═══════════════════════════════════════════════════════════════════════════

  A single self-contained file. No build step, no CDN, no network calls —
  open it directly from disk and it works, including offline and on a phone.

  What this file is FOR:
    · Reviewing the Phase 2 screens as an interacting user, not as code
    · Handing a designer or stakeholder something they can actually tap
    · Serving as the visual and behavioural reference the React components
      in src/features/ are built to match

  What it is NOT:
    · Not the production app. State lives in memory and resets on reload.
    · No auth, no Supabase, no persistence. The React implementation in
      src/ does all of that; this is the screen layer in isolation.

  The design tokens, type scale, spacing and component shapes below are
  identical to src/app/globals.css and tailwind.config.ts, so anything
  changed here must be changed there too.

  Charts are hand-rolled inline SVG rather than a charting library. At this
  size a library costs ~90 KB to draw four shapes, and writing them by hand
  keeps the accessible table fallback honest — every chart has one.
  ═══════════════════════════════════════════════════════════════════════════
-->
<style>
/* ── Design tokens ─────────────────────────────────────────────────────────
   Mirrors src/app/globals.css. Light and dark are a single class on <html>.

   Every foreground/background pair below is verified by
   scripts/audit/contrast.mjs, which reads these values directly rather than
   from a copy, so the audit cannot drift from what ships. All text pairs
   clear WCAG AA (4.5:1).

   ONE DELIBERATE DEVIATION: --line on --surface is 1.30:1, below the 3:1
   that WCAG 1.4.11 sets for non-text contrast. That rule applies to
   boundaries needed to IDENTIFY a control. These borders separate cards
   that are already distinguished by their background fill, and raising them
   to 3:1 turns a calm interface into a wireframe. Interactive boundaries
   that genuinely carry meaning — input borders, focus rings, the selected
   segmented-control state — are held to the threshold. Recorded here so it
   reads as a decision rather than an oversight.                              */
:root {
  --canvas: 220 20% 97%;
  --surface: 0 0% 100%;
  --surface-raised: 220 20% 99%;
  --line: 220 14% 89%;
  --ink: 222 25% 12%;
  --ink-muted: 220 10% 42%;
  --ink-faint: 220 9% 45.5%;   /* solved for 4.5:1 on surface AND canvas */
  --accent: 248 62% 56%;
  --accent-soft: 248 70% 96%;
  --accent-ink: 0 0% 100%;
  --positive: 158 68% 30%;
  --negative: 355 68% 46%;
  --caution: 33 82% 35%;       /* was 38%, which gave 4.31:1 */
  --shadow: 222 40% 20%;
  color-scheme: light;
}
html.dark {
  --canvas: 224 24% 8%;
  --surface: 223 22% 11%;
  --surface-raised: 223 20% 14%;
  --line: 223 16% 22%;
  --ink: 220 20% 95%;
  --ink-muted: 220 12% 66%;
  --ink-faint: 220 10% 53%;    /* solved for 4.5:1 in dark */
  --accent: 248 78% 70%;
  --accent-soft: 248 40% 17.5%; /* darkened so accent text clears 4.5:1 */
  --accent-ink: 224 30% 10%;
  --positive: 158 58% 52%;
  --negative: 355 78% 68%;
  --caution: 36 88% 60%;
  --shadow: 0 0% 0%;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
* { margin: 0; padding: 0; }

html {
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}

body {
  background: hsl(var(--canvas));
  color: hsl(var(--ink));
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 0.9375rem;
  line-height: 1.45rem;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;                 /* no horizontal page overflow, ever */
  min-height: 100dvh;
}

/* The numeric spine: every figure in the app is tabular mono, so weights,
   rupees and reps align on the decimal down a column. */
.fig, th[data-numeric], td[data-numeric] {
  font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
}

:focus-visible {
  outline: 2px solid hsl(var(--accent));
  outline-offset: 2px;
  border-radius: 6px;
}

button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: none; cursor: pointer; }
a { color: inherit; text-decoration: none; }
svg { display: block; }

/* ── Type scale ──────────────────────────────────────────────────────────── */
.t-micro  { font-size: 0.6875rem; line-height: 1rem; letter-spacing: 0.04em; }
.t-label  { font-size: 0.75rem;   line-height: 1.1rem; letter-spacing: 0.02em; }
.t-body   { font-size: 0.9375rem; line-height: 1.45rem; }
.t-fig    { font-size: 1.375rem;  line-height: 1.6rem; letter-spacing: -0.02em; }
.t-fig-lg { font-size: 2rem;      line-height: 2.25rem; letter-spacing: -0.03em; }

.muted { color: hsl(var(--ink-muted)); }
.faint { color: hsl(var(--ink-faint)); }
.pos { color: hsl(var(--positive)); }
.neg { color: hsl(var(--negative)); }
.cau { color: hsl(var(--caution)); }
.acc { color: hsl(var(--accent)); }
.semi { font-weight: 600; }
.med { font-weight: 500; }

.caps {
  font-size: 0.75rem; line-height: 1.1rem;
  letter-spacing: 0.04em; text-transform: uppercase;
  font-weight: 500; color: hsl(var(--ink-muted));
}

/* ── Layout ──────────────────────────────────────────────────────────────── */
.app { min-height: 100dvh; }

main {
  max-width: 48rem;
  margin: 0 auto;
  padding: 1rem 1rem calc(6.5rem + env(safe-area-inset-bottom));
}

.stack   { display: flex; flex-direction: column; gap: 1rem; }
.stack-s { display: flex; flex-direction: column; gap: 0.5rem; }
.row     { display: flex; align-items: center; gap: 0.5rem; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; }
.grid-2  { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 0.625rem; }
.grid-3  { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 0.625rem; }
.spacer  { flex: 1; }

/* Horizontal card rails snap so a swipe lands cleanly. */
.rail {
  display: flex; gap: 0.625rem;
  overflow-x: auto; scroll-snap-type: x mandatory;
  padding-bottom: 0.25rem; margin: 0 -1rem; padding-left: 1rem; padding-right: 1rem;
  scrollbar-width: none;
}
.rail::-webkit-scrollbar { display: none; }
.rail > * { scroll-snap-align: start; flex: 0 0 auto; }

/* ── Card ────────────────────────────────────────────────────────────────── */
.card {
  background: hsl(var(--surface));
  border: 1px solid hsl(var(--line));
  border-radius: 0.875rem;
  overflow: hidden;
}
.card-pad { padding: 0.875rem 1rem; }
.card-head {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 0.75rem; padding: 0.875rem 1rem 0;
}
.card-head h2 { font-size: 0.9375rem; font-weight: 600; }
.divide > * + * { border-top: 1px solid hsl(var(--line)); }

/* ── Buttons ─────────────────────────────────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
  min-height: 44px; padding: 0 1rem;            /* 44px: comfortable one-handed */
  border-radius: 0.75rem; font-size: 0.9375rem; font-weight: 500;
  transition: background-color 140ms, border-color 140ms, transform 100ms;
}
.btn:active { transform: scale(0.98); }
.btn-primary { background: hsl(var(--accent)); color: hsl(var(--accent-ink)); }
.btn-secondary { background: hsl(var(--surface)); border: 1px solid hsl(var(--line)); }
.btn-secondary:hover { background: hsl(var(--surface-raised)); }
.btn-ghost { color: hsl(var(--ink-muted)); }
.btn-ghost:hover { background: hsl(var(--canvas)); color: hsl(var(--ink)); }
.btn-sm { min-height: 36px; padding: 0 0.75rem; font-size: 0.75rem; border-radius: 0.625rem; }
.btn-icon { min-width: 44px; padding: 0; }

/* ── Badge ───────────────────────────────────────────────────────────────── */
.badge {
  display: inline-flex; align-items: center; gap: 0.25rem;
  padding: 0.125rem 0.5rem; border-radius: 999px;
  font-size: 0.6875rem; font-weight: 500; line-height: 1rem;
  background: hsl(var(--canvas)); color: hsl(var(--ink-muted));
}
.badge-acc { background: hsl(var(--accent-soft)); color: hsl(var(--accent)); }
.badge-pos { background: hsl(var(--positive) / 0.12); color: hsl(var(--positive)); }
.badge-cau { background: hsl(var(--caution) / 0.12); color: hsl(var(--caution)); }
.badge-neg { background: hsl(var(--negative) / 0.12); color: hsl(var(--negative)); }

/* ── Progress ────────────────────────────────────────────────────────────── */
.bar { height: 6px; border-radius: 999px; background: hsl(var(--canvas)); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 999px; transition: width 600ms cubic-bezier(0.32,0.72,0,1); }
.bar-acc > i { background: hsl(var(--accent)); }
.bar-pos > i { background: hsl(var(--positive)); }
.bar-cau > i { background: hsl(var(--caution)); }
.bar-neg > i { background: hsl(var(--negative)); }

/* ── Segmented control (sub-navigation) ──────────────────────────────────── */
.seg {
  display: flex; gap: 0.25rem; padding: 0.25rem;
  background: hsl(var(--canvas)); border: 1px solid hsl(var(--line));
  border-radius: 0.75rem; overflow-x: auto; scrollbar-width: none;
}
.seg::-webkit-scrollbar { display: none; }
.seg button {
  flex: 1 0 auto; min-height: 36px; padding: 0 0.875rem;
  border-radius: 0.5rem; font-size: 0.8125rem; font-weight: 500;
  color: hsl(var(--ink-muted)); white-space: nowrap;
  transition: background-color 140ms, color 140ms;
}
.seg button[aria-selected="true"] {
  background: hsl(var(--surface)); color: hsl(var(--ink));
  box-shadow: 0 1px 2px hsl(var(--shadow) / 0.06);
}

/* ── Sidebar (lg and up only) ────────────────────────────────────────────── */
.sidebar { display: none; }

/* ── Bottom navigation ───────────────────────────────────────────────────── */
.bottomnav {
  position: fixed; inset-inline: 0; bottom: 0; z-index: 40;
  background: hsl(var(--surface) / 0.95);
  backdrop-filter: blur(12px);
  border-top: 1px solid hsl(var(--line));
  padding-bottom: env(safe-area-inset-bottom);
}
.bottomnav .tabs {
  max-width: 32rem; margin: 0 auto;
  display: grid; grid-template-columns: repeat(5, 1fr); align-items: end;
}
.navtab {
  display: flex; flex-direction: column; align-items: center; gap: 0.125rem;
  min-height: 44px; padding: 0.5rem 0 0.25rem;
  font-size: 0.6875rem; font-weight: 500; color: hsl(var(--ink-muted));
  transition: color 140ms;
}
.navtab[aria-current="page"] { color: hsl(var(--accent)); }
/* Active state is icon weight + a dot, never colour alone. */
.navtab .dot { width: 4px; height: 4px; border-radius: 999px; background: transparent; }
.navtab[aria-current="page"] .dot { background: hsl(var(--accent)); }
.fab {
  display: grid; place-items: center;
  width: 48px; height: 48px; margin: 0.25rem auto 0.375rem;
  border-radius: 0.875rem;
  background: hsl(var(--accent)); color: hsl(var(--accent-ink));
  transition: transform 120ms;
}
.fab:active { transform: scale(0.94); }
.morebar {
  max-width: 32rem; margin: 0 auto;
  border-top: 1px solid hsl(var(--line) / 0.6);
}
.morebar button {
  display: flex; align-items: center; justify-content: center; gap: 0.375rem;
  width: 100%; min-height: 40px; font-size: 0.75rem; font-weight: 500;
  color: hsl(var(--ink-muted));
}

/* ── Sheets and overlays ─────────────────────────────────────────────────── */
.overlay {
  position: fixed; inset: 0; z-index: 50;
  background: hsl(0 0% 0% / 0.42);
  opacity: 0; pointer-events: none; transition: opacity 200ms;
}
.overlay.open { opacity: 1; pointer-events: auto; }

.sheet {
  position: fixed; inset-inline: 0; bottom: 0; z-index: 51;
  max-height: 88dvh; display: flex; flex-direction: column;
  background: hsl(var(--canvas));
  border-radius: 1.125rem 1.125rem 0 0;
  box-shadow: 0 -2px 24px hsl(var(--shadow) / 0.14);
  transform: translateY(100%);
  transition: transform 260ms cubic-bezier(0.32, 0.72, 0, 1);
  padding-bottom: env(safe-area-inset-bottom);
}
.sheet.open { transform: translateY(0); }
.sheet .grabber {
  width: 2.5rem; height: 4px; margin: 0.75rem auto 0;
  border-radius: 999px; background: hsl(var(--line)); flex: none;
}
.sheet .sheet-head { padding: 0.75rem 1.25rem 0.5rem; }
.sheet .sheet-body { overflow-y: auto; padding: 0 1rem 1.5rem; }

/* ── Forms ───────────────────────────────────────────────────────────────── */
.field { display: flex; flex-direction: column; gap: 0.375rem; }
.field label { font-size: 0.75rem; font-weight: 500; color: hsl(var(--ink-muted)); }
.field .req { color: hsl(var(--negative)); }
.field input, .field select, .field textarea {
  min-height: 44px; padding: 0 0.75rem;
  background: hsl(var(--surface));
  border: 1px solid hsl(var(--line)); border-radius: 0.625rem;
  font-size: 1rem;                     /* 16px stops iOS zooming on focus */
  width: 100%;
}
.field input:focus, .field select:focus { border-color: hsl(var(--accent)); }
.field .help { font-size: 0.6875rem; color: hsl(var(--ink-faint)); }
.field .err  { font-size: 0.6875rem; color: hsl(var(--negative)); display: none; }
.field.invalid input { border-color: hsl(var(--negative)); }
.field.invalid .err { display: block; }

.chipset { display: flex; flex-wrap: wrap; gap: 0.375rem; }
.chip {
  min-height: 40px; padding: 0 0.875rem; border-radius: 0.625rem;
  background: hsl(var(--surface)); border: 1px solid hsl(var(--line));
  font-size: 0.8125rem; font-weight: 500;
}
.chip[aria-pressed="true"] {
  background: hsl(var(--accent-soft)); border-color: hsl(var(--accent)); color: hsl(var(--accent));
}

/* ── Empty / loading states ──────────────────────────────────────────────── */
.empty { display: grid; place-items: center; gap: 0.25rem; padding: 2.5rem 1.5rem; text-align: center; }
.empty h2, .empty h3 { font-size: 0.9375rem; font-weight: 600; }
.empty p { font-size: 0.75rem; color: hsl(var(--ink-muted)); max-width: 20rem; line-height: 1.15rem; }

.skel {
  background: hsl(var(--line) / 0.6); border-radius: 0.375rem;
  position: relative; overflow: hidden;
}
.skel::after {
  content: ""; position: absolute; inset: 0; transform: translateX(-100%);
  background: linear-gradient(90deg, transparent, hsl(var(--surface) / 0.7), transparent);
  animation: shimmer 1.6s infinite;
}
@keyframes shimmer { 100% { transform: translateX(100%); } }

/* ── Toast ───────────────────────────────────────────────────────────────── */
.toast {
  position: fixed; z-index: 60; left: 50%; bottom: calc(7.5rem + env(safe-area-inset-bottom));
  transform: translate(-50%, 1rem);
  display: flex; align-items: center; gap: 0.625rem;
  padding: 0.625rem 0.75rem 0.625rem 0.875rem;
  background: hsl(var(--ink)); color: hsl(var(--canvas));
  border-radius: 0.75rem; font-size: 0.8125rem; font-weight: 500;
  box-shadow: 0 4px 20px hsl(var(--shadow) / 0.2);
  opacity: 0; pointer-events: none; transition: opacity 200ms, transform 200ms;
  max-width: calc(100vw - 2rem);
}
.toast.open { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast button { color: hsl(var(--accent)); font-weight: 600; font-size: 0.8125rem; }

/* ── Score explainer popover ─────────────────────────────────────────────── */
.explainer {
  position: fixed; z-index: 55; inset-inline: 1rem; top: 50%;
  transform: translateY(-50%) scale(0.96);
  max-width: 26rem; margin-inline: auto;
  background: hsl(var(--surface)); border: 1px solid hsl(var(--line));
  border-radius: 1.125rem; box-shadow: 0 8px 40px hsl(var(--shadow) / 0.18);
  opacity: 0; pointer-events: none; transition: opacity 180ms, transform 180ms;
  max-height: 80dvh; overflow-y: auto;
}
.explainer.open { opacity: 1; transform: translateY(-50%) scale(1); pointer-events: auto; }

/* ── Heat map ────────────────────────────────────────────────────────────── */
.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 1fr); gap: 3px; }
.heat i {
  width: 100%; aspect-ratio: 1; border-radius: 3px;
  background: hsl(var(--line) / 0.7); display: block;
}
.heat i[data-l="1"] { background: hsl(var(--accent) / 0.28); }
.heat i[data-l="2"] { background: hsl(var(--accent) / 0.55); }
.heat i[data-l="3"] { background: hsl(var(--accent) / 0.85); }
.heat i[data-l="s"] { background: hsl(var(--line) / 0.35); border: 1px dashed hsl(var(--line)); }

/* ── Accessible chart fallback table ─────────────────────────────────────── */
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}
.chart-data { border-collapse: collapse; width: 100%; font-size: 0.75rem; }
.chart-data th, .chart-data td { padding: 0.25rem 0.5rem; text-align: right; border-bottom: 1px solid hsl(var(--line)); }
.chart-data th:first-child, .chart-data td:first-child { text-align: left; }

details.data-toggle > summary {
  cursor: pointer; font-size: 0.6875rem; color: hsl(var(--ink-faint));
  padding: 0.375rem 0; list-style: none;
}
details.data-toggle > summary::-webkit-details-marker { display: none; }
details.data-toggle > summary::before { content: "▸ "; }
details.data-toggle[open] > summary::before { content: "▾ "; }

/* ── Disclaimer strip ────────────────────────────────────────────────────── */
.disclaimer {
  font-size: 0.6875rem; line-height: 1rem; color: hsl(var(--ink-faint));
  padding: 0.625rem 0.75rem; background: hsl(var(--canvas));
  border-radius: 0.625rem; border: 1px solid hsl(var(--line));
}

/* ── Desktop ─────────────────────────────────────────────────────────────── */
@media (min-width: 1024px) {
  .sidebar {
    position: fixed; inset-block: 0; left: 0; z-index: 30; width: 15rem;
    display: flex; flex-direction: column;
    background: hsl(var(--surface)); border-right: 1px solid hsl(var(--line));
    transition: width 200ms;
  }
  .sidebar[data-collapsed="true"] { width: 4.25rem; }
  .sidebar[data-collapsed="true"] .s-label { display: none; }
  .sidebar[data-collapsed="true"] .s-link { justify-content: center; }
  .s-link {
    position: relative; display: flex; align-items: center; gap: 0.75rem;
    padding: 0.625rem 0.625rem; margin: 0 0.5rem; border-radius: 0.5rem;
    color: hsl(var(--ink-muted)); font-size: 0.9375rem;
  }
  .s-link:hover { background: hsl(var(--canvas)); color: hsl(var(--ink)); }
  .s-link[aria-current="page"] {
    background: hsl(var(--accent-soft)); color: hsl(var(--accent)); font-weight: 500;
  }
  .s-link[aria-current="page"]::before {
    content: ""; position: absolute; left: -0.5rem; top: 0.375rem; bottom: 0.375rem;
    width: 2px; border-radius: 999px; background: hsl(var(--accent));
  }
  .app { padding-left: 15rem; transition: padding-left 200ms; }
  .app[data-collapsed="true"] { padding-left: 4.25rem; }
  main { max-width: 64rem; padding: 1.5rem 2rem 3rem; }
  .bottomnav { display: none; }
  .grid-2 { gap: 0.875rem; }
  .lg-grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 0.875rem; align-items: start; }
  .rail { margin: 0; padding-left: 0; padding-right: 0; flex-wrap: wrap; overflow: visible; }
  .rail > * { flex: 1 1 12rem; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important; animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important; scroll-behavior: auto !important;
  }
}
</style>
</head>
<body>

<a href="#main" class="sr-only">Skip to content</a>

<!-- ═══ Desktop sidebar ═══════════════════════════════════════════════════ -->
<aside class="sidebar" id="sidebar" data-collapsed="false" aria-label="Primary">
  <div class="row" style="height:3.5rem;padding:0 0.75rem;gap:0.5rem">
    <div style="width:32px;height:32px;border-radius:0.5rem;background:hsl(var(--accent));color:hsl(var(--accent-ink));display:grid;place-items:center;font-weight:700;flex:none" class="fig t-label">L</div>
    <span class="semi s-label">LifeOS</span>
  </div>
  <div style="padding:0 0.75rem 0.75rem">
    <button class="btn btn-primary" style="width:100%" data-open-sheet="quickadd">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      <span class="s-label">Quick add</span>
    </button>
  </div>
  <nav id="sidebarNav" aria-label="Sections" style="flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px"></nav>
  <div style="border-top:1px solid hsl(var(--line));padding:0.5rem">
    <button class="s-link" style="width:calc(100% - 1rem)" data-goto="settings">
      <span style="width:32px;height:32px;border-radius:999px;background:hsl(var(--canvas));display:grid;place-items:center;flex:none;font-weight:600" class="fig t-label">AK</span>
      <span class="s-label" style="text-align:left;min-width:0">
        <span class="t-label semi" style="display:block;color:hsl(var(--ink))">Arun K.</span>
        <span class="t-micro faint" style="display:block">Settings</span>
      </span>
    </button>
    <button class="s-link" style="width:calc(100% - 1rem)" id="collapseBtn" aria-expanded="true">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="flex:none"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg>
      <span class="s-label t-label">Collapse</span>
    </button>
  </div>
</aside>

<div class="app" id="app" data-collapsed="false">
  <main id="main">
    <!-- Every view renders into here. -->
    <div id="view"></div>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   LifeOS · Phase 2 dashboard prototype
   ═══════════════════════════════════════════════════════════════════════════

   Structure, in order:
     1. STATE      — in-memory demo dataset, generated deterministically
     2. CALC       — the calculation engine, ported verbatim from
                     src/lib/calculations/. Same Metric<T> contract.
     3. FMT        — display formatting, from src/lib/formatting/
     4. SVG        — hand-rolled charts, each with a table fallback
     5. VIEWS      — one render function per screen
     6. SHEETS     — logging forms with inline validation
     7. APP        — routing, events, boot

   The calculation and formatting sections are deliberate copies of the
   production TypeScript rather than re-implementations. If a number here
   disagrees with the React app, one of the two has drifted and this file is
   the place to notice it.
   ═══════════════════════════════════════════════════════════════════════════ */

'use strict'

/* ─────────────────────────────────────────────────────────────────────────
   1 · STATE
   ───────────────────────────────────────────────────────────────────────── */

const DAY = 86400000

function dateKey(d) {
  return new Date(d).toISOString().slice(0, 10)
}
function daysAgo(n) {
  return dateKey(Date.now() - n * DAY)
}

/* A tiny seeded PRNG so the demo data is identical on every load. Real
   Math.random() would make the charts jump around between reloads, which
   makes it impossible to tell a rendering bug from noise. */
function makeRandom(seed) {
  let s = seed
  return function () {
    s = (s * 1664525 + 1013904223) % 4294967296
    return s / 4294967296
  }
}

function buildDemoData() {
  const rand = makeRandom(20250728)
  const state = {
    profile: {
      displayName: 'Arun K.',
      dateOfBirth: '1992-03-14',
      heightCm: 170.2,
      sexAtBirth: 'male',
      activityLevel: 'moderately_active',
      restingHrBaseline: 56,
      // Drives food suggestions, meal templates and the insight engine.
      // Nothing in the app should ever propose a food outside this.
      dietType: 'lacto_vegetarian',
    },
    prefs: {
      currencyCode: 'INR',
      locale: 'en-IN',
      dateFormat: 'dd/MM/yyyy',
      units: 'metric',
      weekStartsOn: 1,
    },
    goals: {
      primary: 'gain_weight',
      targetWeightKg: 63,
      calories: 2800,
      protein: 145,
      carbs: 340,
      fat: 78,
      waterMl: 3200,
      sleepMinutes: 450,
      workoutsPerWeek: 5,
    },
    weights: [],
    measurements: [],
    sleep: [],
    wellbeing: [],
    vitals: [],
    sessions: [],
    meals: [],
    water: [],
    habits: [],
    habitLogs: {},
    medications: [
      { id: 'm1', name: 'Vitamin D3 60k', isPrescription: false, dosage: '1 capsule', frequency: 'Weekly, Sunday', quantityLeft: 6, refillOn: daysAgo(-38) },
      { id: 'm2', name: 'Whey protein', isPrescription: false, dosage: '30 g', frequency: 'Post-workout', quantityLeft: 21, refillOn: daysAgo(-21) },
      { id: 'm3', name: 'Creatine monohydrate', isPrescription: false, dosage: '5 g', frequency: 'Daily', quantityLeft: 4, refillOn: daysAgo(-4) },
    ],
    appointments: [
      { id: 'a1', title: 'Annual health check-up', scheduledAt: daysAgo(-11), provider: 'Dr. Meera Rao', location: 'Apollo, Jayanagar' },
    ],
  }

  /* ── Weight: 90 days trending 56.8 → 58.6 with realistic daily noise.
        A gain phase, matching the 57 kg / gain-weight onboarding profile. */
  for (let i = 89; i >= 0; i--) {
    // Two logging gaps, because nobody weighs in every single day.
    if ((i > 61 && i < 66) || i === 23 || i === 22) continue
    const base = 56.8 + (89 - i) * 0.020
    const noise = (rand() - 0.5) * 1.1
    state.weights.push({ date: daysAgo(i), kg: Math.round((base + noise) * 10) / 10 })
  }

  /* ── Body measurements, monthly. */
  const sites = [
    { site: 'waist', start: 76.5, drift: -0.3 },
    { site: 'chest', start: 92.0, drift: 1.1 },
    { site: 'arm_right', start: 31.4, drift: 0.5 },
    { site: 'thigh_right', start: 51.0, drift: 0.8 },
    { site: 'shoulders', start: 112.0, drift: 1.4 },
  ]
  for (const s of sites) {
    ;[84, 56, 28, 2].forEach((d, idx) => {
      state.measurements.push({
        date: daysAgo(d),
        site: s.site,
        value: Math.round((s.start + s.drift * idx) * 10) / 10,
      })
    })
  }

  /* ── Sleep: 60 nights, ~6h50m average, worse on weekends. */
  for (let i = 59; i >= 0; i--) {
    if (i === 34 || i === 12) continue // two unlogged nights
    const d = new Date(Date.now() - i * DAY)
    const weekend = d.getDay() === 0 || d.getDay() === 6
    const dur = Math.round(
      (weekend ? 445 : 405) + (rand() - 0.45) * 80 + (i < 7 ? -18 : 0)
    )
    state.sleep.push({
      date: daysAgo(i),
      durationMinutes: Math.max(240, Math.min(560, dur)),
      quality: Math.max(1, Math.min(5, Math.round(2.6 + rand() * 2))),
      interruptions: rand() > 0.7 ? 1 : 0,
      bedtime: weekend ? '00:40' : '23:50',
      wake: weekend ? '08:05' : '06:45',
    })
  }

  /* ── Wellbeing self-reports. */
  for (let i = 29; i >= 0; i--) {
    if (rand() > 0.82) continue
    state.wellbeing.push({
      date: daysAgo(i),
      mood: Math.max(1, Math.min(5, Math.round(3.3 + (rand() - 0.5) * 2))),
      stress: Math.max(1, Math.min(5, Math.round(2.7 + (rand() - 0.5) * 2))),
      energy: Math.max(1, Math.min(5, Math.round(3.4 + (rand() - 0.5) * 2))),
      soreness: Math.max(1, Math.min(5, Math.round(2.4 + (rand() - 0.5) * 2))),
      fatigue: Math.max(1, Math.min(5, Math.round(2.5 + (rand() - 0.5) * 2))),
    })
  }

  /* ── Vitals: resting HR every few days, BP weekly. */
  for (let i = 84; i >= 0; i -= 3) {
    state.vitals.push({
      date: daysAgo(i),
      kind: 'resting_heart_rate',
      value: Math.round(56 + (rand() - 0.45) * 8 - (84 - i) * 0.02),
    })
  }
  for (let i = 84; i >= 0; i -= 7) {
    state.vitals.push({
      date: daysAgo(i),
      kind: 'blood_pressure',
      systolic: Math.round(118 + (rand() - 0.5) * 9),
      diastolic: Math.round(76 + (rand() - 0.5) * 7),
    })
  }

  /* ── Training: a Push / Pull / Legs split, 5 days a week, 12 weeks,
        with progressive overload and the occasional missed session. */
  const SPLIT = [
    {
      title: 'Push A',
      muscles: ['Chest', 'Shoulders', 'Triceps'],
      exercises: [
        { name: 'Barbell bench press', start: 52.5, step: 0.42, sets: 4, reps: [8, 8, 7, 6] },
        { name: 'Incline dumbbell press', start: 20, step: 0.16, sets: 3, reps: [10, 10, 9] },
        { name: 'Seated shoulder press', start: 30, step: 0.22, sets: 3, reps: [10, 9, 8] },
        { name: 'Cable lateral raise', start: 7.5, step: 0.06, sets: 3, reps: [14, 13, 12] },
        { name: 'Rope triceps pushdown', start: 25, step: 0.18, sets: 3, reps: [13, 12, 11] },
      ],
    },
    {
      title: 'Pull A',
      muscles: ['Back', 'Biceps', 'Rear delts'],
      exercises: [
        { name: 'Deadlift', start: 85, step: 0.75, sets: 3, reps: [6, 5, 5] },
        { name: 'Lat pulldown', start: 50, step: 0.35, sets: 4, reps: [11, 10, 10, 9] },
        { name: 'Seated cable row', start: 45, step: 0.32, sets: 3, reps: [11, 10, 10] },
        { name: 'Face pull', start: 20, step: 0.12, sets: 3, reps: [15, 14, 14] },
        { name: 'Barbell curl', start: 22.5, step: 0.14, sets: 3, reps: [11, 10, 9] },
      ],
    },
    {
      title: 'Legs',
      muscles: ['Quads', 'Hamstrings', 'Glutes', 'Calves'],
      exercises: [
        { name: 'Back squat', start: 65, step: 0.6, sets: 4, reps: [8, 8, 7, 6] },
        { name: 'Romanian deadlift', start: 55, step: 0.45, sets: 3, reps: [10, 10, 9] },
        { name: 'Leg press', start: 120, step: 1.1, sets: 3, reps: [12, 11, 10] },
        { name: 'Seated leg curl', start: 35, step: 0.25, sets: 3, reps: [12, 12, 11] },
        { name: 'Standing calf raise', start: 40, step: 0.3, sets: 4, reps: [15, 14, 13, 12] },
      ],
    },
    {
      title: 'Push B',
      muscles: ['Shoulders', 'Chest', 'Triceps'],
      exercises: [
        { name: 'Overhead press', start: 37.5, step: 0.3, sets: 4, reps: [7, 7, 6, 6] },
        { name: 'Dumbbell bench press', start: 24, step: 0.2, sets: 3, reps: [10, 9, 9] },
        { name: 'Cable fly', start: 12.5, step: 0.1, sets: 3, reps: [13, 12, 12] },
        { name: 'Overhead triceps extension', start: 20, step: 0.15, sets: 3, reps: [12, 11, 10] },
      ],
    },
    {
      title: 'Pull B',
      muscles: ['Back', 'Biceps'],
      exercises: [
        { name: 'Barbell row', start: 55, step: 0.42, sets: 4, reps: [9, 8, 8, 7] },
        { name: 'Chin-up', start: 0, step: 0.15, sets: 3, reps: [9, 8, 7] },
        { name: 'Single-arm dumbbell row', start: 26, step: 0.2, sets: 3, reps: [11, 10, 10] },
        { name: 'Hammer curl', start: 12, step: 0.1, sets: 3, reps: [12, 11, 10] },
      ],
    },
  ]

  let sessionSeq = 0
  for (let i = 83; i >= 0; i--) {
    const d = new Date(Date.now() - i * DAY)
    const dow = d.getDay()
    if (dow === 0) continue // rest day, always
    const slot = [null, 0, 1, 2, 3, 4, null][dow]
    if (slot === null) continue

    const planned = SPLIT[slot]
    const weekIndex = Math.floor((83 - i) / 7)

    // Miss roughly one session a fortnight — travel, work, illness.
    const missed = rand() > 0.9
    const session = {
      id: 's' + ++sessionSeq,
      date: daysAgo(i),
      title: planned.title,
      muscles: planned.muscles,
      status: missed ? 'skipped' : 'completed',
      durationMinutes: missed ? 0 : Math.round(58 + rand() * 22),
      perceivedEffort: missed ? null : Math.round(6 + rand() * 3),
      exercises: [],
    }

    if (!missed) {
      for (const ex of planned.exercises) {
        const load = Math.round((ex.start + ex.step * (83 - i) / 1.6) * 2) / 2
        const sets = []
        // One warm-up, then working sets. The warm-up is excluded from
        // volume by the calc engine — see CALC.trainingVolume.
        sets.push({ kind: 'warmup', weightKg: Math.round(load * 0.5 * 2) / 2, reps: 10, completed: true })
        for (let s = 0; s < ex.sets; s++) {
          sets.push({
            kind: 'working',
            weightKg: load,
            reps: ex.reps[s] + (rand() > 0.85 ? 1 : 0),
            rpe: Math.round((7 + s * 0.4 + rand()) * 2) / 2,
            completed: true,
          })
        }
        session.exercises.push({ name: ex.name, sets })
      }
    }
    state.sessions.push(session)
  }

  /* ── Nutrition: 45 days. Gain phase, so calories are usually close to
        target but protein is the thing that slips. */
  /* Lacto-vegetarian, Indian context, built to hit a 145 g protein target.
     Paneer, soya chunks, dal, curd and whey do the heavy lifting — soya
     chunks in particular are about 52 g protein per 100 g dry, which is why
     they appear as a staple rather than a novelty. No meat, no fish, no egg. */
  const FOODS = [
    ['Oats with milk and banana', 520, 22, 78, 12],
    ['Paneer bhurji with 2 roti', 580, 34, 52, 26],
    ['Soya chunk curry with rice', 610, 45, 72, 14],
    ['Dal, rice and sabzi', 640, 24, 96, 17],
    ['Rajma chawal', 610, 24, 98, 13],
    ['Whey shake', 165, 30, 5, 2],
    ['Peanut butter toast', 380, 14, 38, 20],
    ['Curd rice with peanuts', 420, 16, 68, 11],
    ['Paneer tikka 200 g', 390, 42, 12, 20],
    ['Moong dal chilla with chutney', 340, 20, 38, 11],
    ['Chana masala with 2 roti', 560, 26, 74, 16],
    ['Sprouts and paneer salad', 310, 24, 28, 12],
    ['Greek yoghurt with almonds', 290, 20, 22, 14],
    ['Tofu bhurji with toast', 400, 28, 34, 18],
    ['Banana and almonds', 290, 8, 34, 15],
  ]
  const SLOTS = ['breakfast', 'lunch', 'snack', 'dinner', 'post_workout']

  for (let i = 44; i >= 0; i--) {
    if (rand() > 0.9) continue // unlogged day
    const count = 3 + Math.floor(rand() * 2.4)
    for (let m = 0; m < count; m++) {
      const f = FOODS[Math.floor(rand() * FOODS.length)]
      const scale = 0.82 + rand() * 0.42
      state.meals.push({
        id: `meal-${i}-${m}`,
        date: daysAgo(i),
        slot: SLOTS[Math.min(m, SLOTS.length - 1)],
        label: f[0],
        calories: Math.round(f[1] * scale),
        protein: Math.round(f[2] * scale),
        carbs: Math.round(f[3] * scale),
        fat: Math.round(f[4] * scale),
      })
    }
  }

  /* ── Water. */
  for (let i = 44; i >= 0; i--) {
    if (rand() > 0.93) continue
    const target = 2100 + rand() * 1500
    let logged = 0
    while (logged < target) {
      const amt = [250, 300, 500, 750][Math.floor(rand() * 4)]
      state.water.push({ id: `w-${i}-${logged}`, date: daysAgo(i), amountMl: amt })
      logged += amt
    }
  }

  /* ── Habits. */
  state.habits = [
    { id: 'h1', name: 'Gym session', cadence: 'custom_days', weekdays: [1, 2, 3, 4, 5], metric: 'boolean' },
    { id: 'h2', name: 'Hit protein target', cadence: 'daily', metric: 'boolean' },
    { id: 'h3', name: 'Water 3 L', cadence: 'daily', metric: 'boolean' },
    { id: 'h4', name: 'Lights out by 23:30', cadence: 'daily', metric: 'boolean' },
    { id: 'h5', name: 'Read 20 minutes', cadence: 'daily', metric: 'duration_minutes', target: 20 },
    { id: 'h6', name: 'Creatine', cadence: 'daily', metric: 'boolean' },
    { id: 'h7', name: '8,000 steps', cadence: 'daily', metric: 'count', target: 8000 },
  ]
  const rates = { h1: 0.86, h2: 0.62, h3: 0.71, h4: 0.54, h5: 0.68, h6: 0.9, h7: 0.75 }
  for (const h of state.habits) {
    state.habitLogs[h.id] = {}
    for (let i = 89; i >= 0; i--) {
      const d = new Date(Date.now() - i * DAY)
      if (h.weekdays && !h.weekdays.includes(d.getDay())) continue
      const r = rand()
      if (r < 0.045) {
        state.habitLogs[h.id][daysAgo(i)] = { status: 'skipped' }
      } else if (r < rates[h.id]) {
        state.habitLogs[h.id][daysAgo(i)] = { status: 'done' }
      }
      // Otherwise: scheduled and not logged — a genuine miss.
    }
  }

  return state
}

let S = buildDemoData()

/* ─────────────────────────────────────────────────────────────────────────
   2 · CALC — ported from src/lib/calculations/
   Same Metric<T> contract: a metric with no data returns insufficient_data,
   never zero. See docs/CALCULATIONS.md.
   ───────────────────────────────────────────────────────────────────────── */

const ok = (value, inputs = {}, caveat) => ({ status: 'ok', value, inputs, caveat })
const missing = (reason, needed) => ({ status: 'insufficient_data', reason, needed })
const isOk = (m) => m && m.status === 'ok'
const round = (v, d = 2) => {
  const f = Math.pow(10, d)
  return Math.round((v + Number.EPSILON) * f) / f
}

const CALC = {
  bmi(weightKg, heightCm) {
    if (!(weightKg > 0)) return missing('No weight has been recorded.', 'Log your weight to see this.')
    if (!(heightCm > 0)) return missing('Height is not set.', 'Add your height in Settings.')
    const m = heightCm / 100
    const value = round(weightKg / (m * m), 1)
    const band = value < 18.5 ? 'under' : value < 25 ? 'healthy' : value < 30 ? 'over' : 'obese'
    return ok({ bmi: value, band }, { weightKg, heightCm },
      'A general population indicator. It does not distinguish muscle from fat.')
  },

  waistToHeight(waistCm, heightCm) {
    if (!(waistCm > 0)) return missing('No waist measurement has been recorded.', 'Log a waist measurement.')
    if (!(heightCm > 0)) return missing('Height is not set.', 'Add your height in Settings.')
    return ok(round(waistCm / heightCm, 3), { waistCm, heightCm })
  },

  /* 7-point moving average. Daily weight swings 1–2 kg on water alone, so
     the trend is never taken from first-vs-last readings. */
  weightTrend(entries, windowSize = 7) {
    if (entries.length < 2) {
      return missing('At least two weight entries are needed to show a trend.',
        entries.length === 0 ? 'Log your weight to begin.' : 'Log your weight once more.')
    }
    const sorted = [...entries].sort((a, b) => a.date.localeCompare(b.date))
    const movingAverage = sorted.map((e, i) => {
      const slice = sorted.slice(Math.max(0, i - windowSize + 1), i + 1)
      return { date: e.date, value: round(slice.reduce((s, x) => s + x.kg, 0) / slice.length, 2) }
    })
    const first = movingAverage[0], last = movingAverage[movingAverage.length - 1]
    const changeKg = round(last.value - first.value, 2)
    const days = Math.max(1, (new Date(last.date) - new Date(first.date)) / DAY)
    const weeklyRateKg = round((changeKg / days) * 7, 2)
    const direction = Math.abs(weeklyRateKg) < 0.1 ? 'stable' : weeklyRateKg > 0 ? 'gaining' : 'losing'
    return ok(
      { changeKg, changePercent: round((changeKg / first.value) * 100, 1), weeklyRateKg, direction, movingAverage, raw: sorted },
      { entryCount: sorted.length, spanDays: round(days, 0), windowSize },
      days < 14 ? 'Based on under two weeks of data, so day-to-day noise still dominates.' : undefined
    )
  },

  /* Warm-ups and drop sets excluded — including them would inflate volume
     every time an extra warm-up was logged. */
  trainingVolume(sets) {
    const counted = sets.filter((s) =>
      s.completed && ['working', 'failure', 'amrap', 'backoff'].includes(s.kind) &&
      s.weightKg != null && s.reps != null)
    if (counted.length === 0) {
      return missing('No completed working sets were recorded.', 'Log weight and reps against your sets.')
    }
    return ok(round(counted.reduce((sum, s) => sum + s.weightKg * s.reps, 0)),
      { workingSets: counted.length, totalSets: sets.length })
  },

  /* Epley. Refuses above 12 reps rather than reporting false precision. */
  estimatedOneRepMax(weightKg, reps) {
    if (!(weightKg > 0)) return missing('No weight was recorded for this set.', 'Enter the weight lifted.')
    if (!(reps >= 1)) return missing('No repetitions were recorded.', 'Enter the reps completed.')
    if (reps > 12) return missing('Estimates above 12 repetitions are too unreliable to show.', 'Log a heavier set of 12 reps or fewer.')
    if (reps === 1) return ok(round(weightKg, 1), { weightKg, reps })
    return ok(round(weightKg * (1 + reps / 30), 1), { weightKg, reps },
      'An estimate from the Epley formula, not a tested maximum.')
  },

  trainingAdherence(planned, completed) {
    if (planned <= 0) return missing('No workouts were scheduled for this period.', 'Create a workout plan.')
    return ok(round(Math.min(100, (completed / planned) * 100), 0), { planned, completed })
  },

  sleepSummary(nights) {
    if (nights.length === 0) return missing('No sleep has been logged for this period.', 'Add a sleep record.')
    const durations = nights.map((n) => n.durationMinutes).filter((d) => d > 0)
    if (durations.length === 0) return missing('The sleep records have no duration.', 'Check your sleep entries.')
    const mean = durations.reduce((a, b) => a + b, 0) / durations.length
    const variance = durations.reduce((s, d) => s + Math.pow(d - mean, 2), 0) / durations.length
    return ok({
      averageMinutes: round(mean, 0), averageHours: round(mean / 60, 1),
      consistencyMinutes: round(Math.sqrt(variance), 0), nightsLogged: durations.length,
      shortestMinutes: Math.min(...durations), longestMinutes: Math.max(...durations),
    }, { nightsLogged: durations.length },
      durations.length < 3 ? 'Based on fewer than three nights.' : undefined)
  },

  /* Each day capped at 100% before averaging, so one huge day cannot paper
     over several small ones. Unlogged days are excluded, not zeroed. */
  targetAdherence(dailyValues, target, toleranceBelowPct = 10) {
    if (!(target > 0)) return missing('No target has been set.', 'Set a daily target in your nutrition goals.')
    if (dailyValues.length === 0) return missing('Nothing has been logged for this period.', 'Log a meal to start tracking this.')
    const threshold = target * (1 - toleranceBelowPct / 100)
    const perDay = dailyValues.map((d) => Math.min(100, (d.value / target) * 100))
    return ok({
      adherencePercent: round(perDay.reduce((a, b) => a + b, 0) / perDay.length, 0),
      daysOnTarget: dailyValues.filter((d) => d.value >= threshold).length,
      daysLogged: dailyValues.length,
      averageValue: round(dailyValues.reduce((s, d) => s + d.value, 0) / dailyValues.length, 1),
      target,
    }, { target, daysLogged: dailyValues.length, toleranceBelowPct })
  },

  /* Skipped days are neither credited nor penalised — a tracker that
     punishes a planned rest day teaches people to lie to it. */
  habitStreak(logs, scheduledDates) {
    if (scheduledDates.length === 0) return missing('This habit has no scheduled days in the period.', 'Check the habit schedule.')
    const ordered = [...scheduledDates].sort()
    let longest = 0, running = 0, completedDays = 0, eligibleDays = 0, current = 0

    for (const date of ordered) {
      const status = logs[date] && logs[date].status
      if (status === 'skipped') continue
      eligibleDays++
      if (status === 'done') { completedDays++; running++; longest = Math.max(longest, running) }
      else running = 0
    }
    for (let i = ordered.length - 1; i >= 0; i--) {
      const status = logs[ordered[i]] && logs[ordered[i]].status
      if (status === 'skipped') continue
      if (status === 'done') current++
      else break
    }
    return ok({
      current, longest,
      completionRate: eligibleDays > 0 ? round((completedDays / eligibleDays) * 100, 0) : 0,
      completedDays, eligibleDays,
    }, { scheduledDays: scheduledDates.length, eligibleDays })
  },

  /* Weighted mean over up to six self-reports, renormalised over whichever
     are present. Fewer than two is an opinion, not an indicator. */
  recoveryIndicator(input) {
    const components = [], missingInputs = []
    const clamp = (v) => Math.max(0, Math.min(1, v))

    if (input.sleepMinutes != null && input.sleepMinutes > 0) {
      components.push({ name: 'Sleep duration', weight: 0.3, normalised: clamp((input.sleepMinutes / 60 - 4) / 4) })
    } else missingInputs.push('sleep duration')

    if (input.sleepQuality != null) components.push({ name: 'Sleep quality', weight: 0.2, normalised: clamp((input.sleepQuality - 1) / 4) })
    else missingInputs.push('sleep quality')

    if (input.soreness != null) components.push({ name: 'Soreness', weight: 0.15, normalised: clamp((5 - input.soreness) / 4) })
    else missingInputs.push('soreness')

    if (input.fatigue != null) components.push({ name: 'Fatigue', weight: 0.15, normalised: clamp((5 - input.fatigue) / 4) })
    else missingInputs.push('fatigue')

    if (input.stress != null) components.push({ name: 'Stress', weight: 0.1, normalised: clamp((5 - input.stress) / 4) })
    else missingInputs.push('stress')

    if (input.restingHeartRate != null && input.baselineRestingHeartRate != null) {
      components.push({ name: 'Resting heart rate', weight: 0.1, normalised: clamp((10 - (input.restingHeartRate - input.baselineRestingHeartRate)) / 10) })
    } else missingInputs.push('resting heart rate')

    if (components.length < 2) {
      return missing('Not enough has been logged today to summarise recovery.', 'Log your sleep, plus how sore or tired you feel.')
    }
    const totalWeight = components.reduce((s, c) => s + c.weight, 0)
    const score = round((components.reduce((s, c) => s + c.weight * c.normalised, 0) / totalWeight) * 100, 0)
    return ok({ score, label: score >= 70 ? 'good' : score >= 45 ? 'moderate' : 'low', components, missingInputs },
      { componentCount: components.length, coverage: round(totalWeight * 100, 0) },
      missingInputs.length > 0
        ? `Based on ${components.length} of 6 inputs. Not a medical assessment.`
        : 'Based on your own logs. Not a medical assessment.')
  },

  /* Missing components are excluded and the rest reweighted — never scored
     as zero. Not logging is not the same as doing badly. */
  composeScore(components, explanation, minimumComponents = 2) {
    const present = components.filter(Boolean)
    const excluded = components.filter((c) => !c).length
    if (present.length < minimumComponents) {
      return missing('There is not enough logged data to calculate this score yet.',
        `Log at least ${minimumComponents} of the tracked areas for this period.`)
    }
    const totalWeight = present.reduce((s, c) => s + c.weight, 0)
    const score = round(present.reduce((s, c) => s + c.value * c.weight, 0) / totalWeight, 0)
    const band = score >= 85 ? 'excellent' : score >= 70 ? 'consistent' : score >= 50 ? 'fair' : 'needs_attention'
    return ok({ score, band, components: present, explanation, excludedCount: excluded },
      { componentsUsed: present.length, componentsTotal: components.length },
      excluded > 0 ? `Calculated from ${present.length} of ${components.length} areas. The rest had no data for this period.` : undefined)
  },
}

/* ─────────────────────────────────────────────────────────────────────────
   3 · FMT — display formatting, from src/lib/formatting/
   Everything reads S.prefs, so switching units or locale changes every
   figure in the app rather than only the ones someone remembered to update.
   ───────────────────────────────────────────────────────────────────────── */

const FMT = {
  weight(kg, d = 1) {
    if (kg == null || !isFinite(kg)) return '—'
    return S.prefs.units === 'imperial' ? `${(kg * 2.20462).toFixed(d)} lb` : `${kg.toFixed(d)} kg`
  },
  length(cm, d = 1) {
    if (cm == null || !isFinite(cm)) return '—'
    return S.prefs.units === 'imperial' ? `${(cm / 2.54).toFixed(d)} in` : `${cm.toFixed(d)} cm`
  },
  volume(ml) {
    if (ml == null || !isFinite(ml)) return '—'
    if (S.prefs.units === 'imperial') return `${Math.round(ml / 29.5735)} fl oz`
    return ml >= 1000 ? `${(ml / 1000).toFixed(2)} L` : `${Math.round(ml)} ml`
  },
  duration(min) {
    if (min == null || !isFinite(min)) return '—'
    const t = Math.round(min), h = Math.floor(t / 60), m = t % 60
    return h === 0 ? `${m}m` : m === 0 ? `${h}h` : `${h}h ${m}m`
  },
  num(v, d = 0) {
    if (v == null || !isFinite(v)) return '—'
    return new Intl.NumberFormat(S.prefs.locale, { minimumFractionDigits: d, maximumFractionDigits: d }).format(v)
  },
  pct(v, d = 0) {
    return v == null || !isFinite(v) ? '—' : `${v.toFixed(d)}%`
  },
  delta(v, unit = '', d = 1) {
    if (v == null || !isFinite(v)) return '—'
    const sign = v > 0 ? '+' : v < 0 ? '−' : ''
    return `${sign}${Math.abs(v).toFixed(d)}${unit}`
  },
  date(iso) {
    if (!iso) return '—'
    const d = new Date(iso)
    const dd = String(d.getDate()).padStart(2, '0')
    const mm = String(d.getMonth() + 1).padStart(2, '0')
    return S.prefs.dateFormat === 'dd/MM/yyyy' ? `${dd}/${mm}/${d.getFullYear()}` : `${d.getFullYear()}-${mm}-${dd}`
  },
  dayShort(iso) {
    return new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })
  },
  relDay(iso) {
    const diff = Math.round((new Date(dateKey(new Date())) - new Date(iso)) / DAY)
    if (diff === 0) return 'Today'
    if (diff === 1) return 'Yesterday'
    if (diff === -1) return 'Tomorrow'
    if (diff > 1 && diff < 7) return `${diff} days ago`
    if (diff < -1 && diff > -14) return `in ${Math.abs(diff)} days`
    return FMT.date(iso)
  },
  age(dob) {
    const d = new Date(dob), now = new Date()
    let a = now.getFullYear() - d.getFullYear()
    if (now.getMonth() < d.getMonth() || (now.getMonth() === d.getMonth() && now.getDate() < d.getDate())) a--
    return a
  },
}

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))

/* ─────────────────────────────────────────────────────────────────────────
   4 · SVG — hand-rolled charts
   Each chart returns markup that includes a <details> table of the same
   numbers. A chart nobody can read with a screen reader is decoration.
   ───────────────────────────────────────────────────────────────────────── */

const SVG = {
  /* Line chart with optional smoothed overlay, goal line and area fill. */
  line(opts) {
    const {
      raw = [], smooth = [], goal = null, height = 150, unit = '',
      label = 'Trend', decimals = 1, showRaw = true,
    } = opts
    const series = smooth.length ? smooth : raw
    if (series.length < 2) return SVG.emptyChart(label)

    const W = 320, H = height, PT = 12, PB = 20, PL = 34, PR = 8
    const values = [...raw.map((p) => p.value), ...smooth.map((p) => p.value)]
    if (goal != null) values.push(goal)
    let min = Math.min(...values), max = Math.max(...values)
    const pad = (max - min) * 0.12 || 1
    min -= pad; max += pad

    const x = (i, n) => PL + (i / (n - 1)) * (W - PL - PR)
    const y = (v) => PT + (1 - (v - min) / (max - min)) * (H - PT - PB)

    const path = (pts) => pts.map((p, i) => `${i ? 'L' : 'M'}${x(i, pts.length).toFixed(1)},${y(p.value).toFixed(1)}`).join(' ')
    const area = smooth.length
      ? `${path(smooth)} L${x(smooth.length - 1, smooth.length).toFixed(1)},${H - PB} L${PL},${H - PB} Z`
      : ''

    const ticks = [max - pad * 0.6, (min + max) / 2, min + pad * 0.6]
    const gid = 'g' + Math.random().toString(36).slice(2, 8)

    return `
    <figure style="margin:0">
      <svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img"
           aria-label="${esc(label)}. ${series.length} points from ${FMT.dayShort(series[0].date)} to ${FMT.dayShort(series[series.length - 1].date)}.">
        <defs>
          <linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="hsl(var(--accent))" stop-opacity="0.18"/>
            <stop offset="100%" stop-color="hsl(var(--accent))" stop-opacity="0"/>
          </linearGradient>
        </defs>
        ${ticks.map((t) => `
          <line x1="${PL}" x2="${W - PR}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}"
                stroke="hsl(var(--line))" stroke-width="1" stroke-dasharray="2 3"/>
          <text x="${PL - 5}" y="${(y(t) + 3.5).toFixed(1)}" text-anchor="end"
                font-size="9" fill="hsl(var(--ink-faint))"
                font-family="ui-monospace,monospace">${t.toFixed(decimals)}</text>`).join('')}
        ${goal != null && goal >= min && goal <= max ? `
          <line x1="${PL}" x2="${W - PR}" y1="${y(goal).toFixed(1)}" y2="${y(goal).toFixed(1)}"
                stroke="hsl(var(--positive))" stroke-width="1.2" stroke-dasharray="5 3" opacity="0.75"/>
          <text x="${W - PR}" y="${(y(goal) - 4).toFixed(1)}" text-anchor="end" font-size="9"
                fill="hsl(var(--positive))" font-family="ui-monospace,monospace">goal ${goal}${unit}</text>` : ''}
        ${area ? `<path d="${area}" fill="url(#${gid})"/>` : ''}
        ${showRaw && smooth.length && raw.length ? `
          <path d="${path(raw)}" fill="none" stroke="hsl(var(--ink-faint))"
                stroke-width="1" opacity="0.32" stroke-linejoin="round"/>` : ''}
        <path d="${path(series)}" fill="none" stroke="hsl(var(--accent))" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="${x(series.length - 1, series.length).toFixed(1)}" cy="${y(series[series.length - 1].value).toFixed(1)}"
                r="3.5" fill="hsl(var(--accent))" stroke="hsl(var(--surface))" stroke-width="2"/>
        <text x="${PL}" y="${H - 6}" font-size="9" fill="hsl(var(--ink-faint))">${FMT.dayShort(series[0].date)}</text>
        <text x="${W - PR}" y="${H - 6}" font-size="9" text-anchor="end" fill="hsl(var(--ink-faint))">${FMT.dayShort(series[series.length - 1].date)}</text>
      </svg>
      ${SVG.dataTable(label, series, unit, decimals)}
    </figure>`
  },

  /* Vertical bars. Values below `dim` render muted, so a missed target
     reads as different without relying on colour alone. */
  bars(opts) {
    const { data = [], height = 110, unit = '', label = 'Values', target = null, decimals = 0 } = opts
    if (!data.length) return SVG.emptyChart(label)

    const W = 320, H = height, PB = 18, PT = 6
    const max = Math.max(...data.map((d) => d.value), target || 0) * 1.1 || 1
    const bw = (W / data.length) * 0.62
    const gap = (W / data.length) * 0.38

    return `
    <figure style="margin:0">
      <svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img"
           aria-label="${esc(label)}. ${data.length} bars.">
        ${target ? `<line x1="0" x2="${W}" y1="${(PT + (1 - target / max) * (H - PT - PB)).toFixed(1)}"
              y2="${(PT + (1 - target / max) * (H - PT - PB)).toFixed(1)}"
              stroke="hsl(var(--positive))" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.7"/>` : ''}
        ${data.map((d, i) => {
          const h = Math.max(2, (d.value / max) * (H - PT - PB))
          const xx = i * (bw + gap) + gap / 2
          const below = target && d.value < target * 0.9
          return `<rect x="${xx.toFixed(1)}" y="${(H - PB - h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}"
                    rx="2.5" fill="hsl(var(--accent))" opacity="${below ? 0.3 : 0.9}">
                    <title>${esc(d.label)}: ${d.value.toFixed(decimals)}${unit}</title></rect>`
        }).join('')}
        ${data.map((d, i) => i % Math.ceil(data.length / 7) === 0
          ? `<text x="${(i * (bw + gap) + gap / 2 + bw / 2).toFixed(1)}" y="${H - 5}" font-size="8.5"
                text-anchor="middle" fill="hsl(var(--ink-faint))">${esc(d.short || d.label)}</text>` : '').join('')}
      </svg>
      ${SVG.dataTable(label, data.map((d) => ({ date: d.label, value: d.value })), unit, decimals)}
    </figure>`
  },

  /* Progress ring for macros. */
  ring(opts) {
    const { value, target, size = 72, stroke = 7, label = '', sub = '', tone = 'accent' } = opts
    const pct = target > 0 ? Math.min(1, value / target) : 0
    const r = (size - stroke) / 2
    const c = 2 * Math.PI * r
    const over = target > 0 && value > target * 1.05
    const colour = over ? 'hsl(var(--caution))' : `hsl(var(--${tone}))`

    return `
    <div style="display:flex;flex-direction:column;align-items:center;gap:0.375rem">
      <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img"
           aria-label="${esc(label)}: ${Math.round(pct * 100)} percent of target">
        <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none"
                stroke="hsl(var(--line))" stroke-width="${stroke}"/>
        <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none"
                stroke="${colour}" stroke-width="${stroke}" stroke-linecap="round"
                stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c * (1 - pct)).toFixed(1)}"
                transform="rotate(-90 ${size / 2} ${size / 2})"
                style="transition:stroke-dashoffset 700ms cubic-bezier(0.32,0.72,0,1)"/>
        <text x="50%" y="50%" text-anchor="middle" dy="0.36em" font-size="${size * 0.24}"
              font-weight="600" fill="hsl(var(--ink))"
              font-family="ui-monospace,monospace">${Math.round(pct * 100)}</text>
      </svg>
      <div style="text-align:center">
        <div class="t-micro caps" style="letter-spacing:0.04em">${esc(label)}</div>
        <div class="t-micro fig faint">${esc(sub)}</div>
      </div>
    </div>`
  },

  /* Habit heat map, one column per week. */
  heatmap(levels, weeks = 13) {
    const cells = []
    const today = new Date()
    const start = new Date(today.getTime() - (weeks * 7 - 1) * DAY)
    // Align to the week start so the rows are consistent weekdays.
    start.setDate(start.getDate() - ((start.getDay() + 6) % 7))

    for (let w = 0; w < weeks; w++) {
      for (let d = 0; d < 7; d++) {
        const day = new Date(start.getTime() + (w * 7 + d) * DAY)
        if (day > today) { cells.push('<i data-l="s" aria-hidden="true"></i>'); continue }
        const key = dateKey(day)
        const l = levels[key]
        cells.push(`<i data-l="${l === undefined ? '0' : l}" title="${key}: ${
          l === 's' ? 'skipped' : l === undefined ? 'not scheduled' : l + ' of 3 habits'
        }"></i>`)
      }
    }
    return `<div class="heat" style="grid-auto-columns:1fr">${cells.join('')}</div>`
  },

  emptyChart(label) {
    return `<div class="empty" style="padding:2rem 1rem">
      <h3 class="t-label semi">Nothing to chart yet</h3>
      <p>${esc(label)} needs at least two entries before a trend means anything.</p>
    </div>`
  },

  /* Every chart ships with its numbers in a table. */
  dataTable(label, series, unit, decimals) {
    const rows = series.slice(-14).reverse()
    return `<details class="data-toggle">
      <summary>Show the ${rows.length} most recent values</summary>
      <table class="chart-data"><caption class="sr-only">${esc(label)}</caption>
        <thead><tr><th scope="col">Date</th><th scope="col">Value</th></tr></thead>
        <tbody>${rows.map((p) => `<tr><td>${esc(FMT.dayShort ? (p.date.length === 10 ? FMT.dayShort(p.date) : p.date) : p.date)}</td>
          <td data-numeric>${p.value.toFixed(decimals)}${esc(unit)}</td></tr>`).join('')}</tbody>
      </table>
    </details>`
  },
}

/* ─────────────────────────────────────────────────────────────────────────
   5 · SELECTORS — derive everything the views need from raw state
   Kept separate from rendering so a figure is computed once and reused,
   and so the same derivation can be checked against the SQL views.
   ───────────────────────────────────────────────────────────────────────── */

const SEL = {
  latestWeight() {
    const sorted = [...S.weights].sort((a, b) => b.date.localeCompare(a.date))
    return sorted[0] || null
  },
  latestMeasurement(site) {
    const rows = S.measurements.filter((m) => m.site === site).sort((a, b) => b.date.localeCompare(a.date))
    return rows[0] || null
  },
  latestVital(kind) {
    const rows = S.vitals.filter((v) => v.kind === kind).sort((a, b) => b.date.localeCompare(a.date))
    return rows[0] || null
  },
  sleepOn(date) { return S.sleep.find((s) => s.date === date) || null },
  wellbeingOn(date) { return S.wellbeing.find((w) => w.date === date) || null },

  nutritionOn(date) {
    const meals = S.meals.filter((m) => m.date === date)
    return {
      meals,
      calories: meals.reduce((s, m) => s + m.calories, 0),
      protein: meals.reduce((s, m) => s + m.protein, 0),
      carbs: meals.reduce((s, m) => s + m.carbs, 0),
      fat: meals.reduce((s, m) => s + m.fat, 0),
    }
  },
  waterOn(date) {
    return S.water.filter((w) => w.date === date).reduce((s, w) => s + w.amountMl, 0)
  },

  /* Daily totals across a window, only for days that were actually logged. */
  dailyNutrition(days) {
    const out = []
    for (let i = days - 1; i >= 0; i--) {
      const d = daysAgo(i)
      const n = SEL.nutritionOn(d)
      if (n.meals.length) out.push({ date: d, ...n })
    }
    return out
  },
  dailyWater(days) {
    const out = []
    for (let i = days - 1; i >= 0; i--) {
      const d = daysAgo(i)
      const ml = SEL.waterOn(d)
      if (ml > 0) out.push({ date: d, value: ml })
    }
    return out
  },

  sessionVolume(session) {
    if (session.status !== 'completed') return 0
    const sets = session.exercises.flatMap((e) => e.sets)
    const v = CALC.trainingVolume(sets)
    return isOk(v) ? v.value : 0
  },

  sessionsInLast(days) {
    const from = daysAgo(days - 1)
    return S.sessions.filter((s) => s.date >= from)
  },

  weeklyVolume(weeks = 8) {
    const out = []
    for (let w = weeks - 1; w >= 0; w--) {
      const end = daysAgo(w * 7)
      const start = daysAgo(w * 7 + 6)
      const vol = S.sessions
        .filter((s) => s.date >= start && s.date <= end)
        .reduce((sum, s) => sum + SEL.sessionVolume(s), 0)
      out.push({ label: FMT.dayShort(start), short: FMT.dayShort(start).split(' ')[0], value: Math.round(vol) })
    }
    return out
  },

  /* Best estimated 1RM per exercise, and whether it was set recently. */
  personalRecords() {
    const best = {}
    for (const s of S.sessions) {
      if (s.status !== 'completed') continue
      for (const ex of s.exercises) {
        for (const st of ex.sets) {
          if (st.kind !== 'working' || !st.completed) continue
          const e = CALC.estimatedOneRepMax(st.weightKg, st.reps)
          if (!isOk(e)) continue
          if (!best[ex.name] || e.value > best[ex.name].e1rm) {
            best[ex.name] = { name: ex.name, e1rm: e.value, weightKg: st.weightKg, reps: st.reps, date: s.date }
          }
        }
      }
    }
    return Object.values(best).sort((a, b) => b.date.localeCompare(a.date))
  },

  exerciseHistory(name) {
    const points = []
    for (const s of [...S.sessions].sort((a, b) => a.date.localeCompare(b.date))) {
      if (s.status !== 'completed') continue
      const ex = s.exercises.find((e) => e.name === name)
      if (!ex) continue
      let top = 0
      for (const st of ex.sets) {
        if (st.kind !== 'working' || !st.completed) continue
        const e = CALC.estimatedOneRepMax(st.weightKg, st.reps)
        if (isOk(e) && e.value > top) top = e.value
      }
      if (top) points.push({ date: s.date, value: top })
    }
    return points
  },

  /* Scheduled dates for a habit inside a window. */
  habitSchedule(habit, days) {
    const out = []
    for (let i = days - 1; i >= 0; i--) {
      const d = new Date(Date.now() - i * DAY)
      if (habit.weekdays && !habit.weekdays.includes(d.getDay())) continue
      out.push(dateKey(d))
    }
    return out
  },

  habitStats(habit, days = 90) {
    return CALC.habitStreak(S.habitLogs[habit.id] || {}, SEL.habitSchedule(habit, days))
  },

  /* Heat map levels: how many of today's scheduled habits were completed,
     bucketed 0–3. */
  habitHeatLevels(weeks = 13) {
    const levels = {}
    for (let i = weeks * 7; i >= 0; i--) {
      const d = new Date(Date.now() - i * DAY)
      const key = dateKey(d)
      const scheduled = S.habits.filter((h) => !h.weekdays || h.weekdays.includes(d.getDay()))
      if (!scheduled.length) continue
      let done = 0, skipped = 0
      for (const h of scheduled) {
        const log = (S.habitLogs[h.id] || {})[key]
        if (log && log.status === 'done') done++
        else if (log && log.status === 'skipped') skipped++
      }
      const eligible = scheduled.length - skipped
      if (eligible === 0) { levels[key] = 's'; continue }
      const ratio = done / eligible
      levels[key] = ratio === 0 ? 0 : ratio < 0.5 ? 1 : ratio < 0.9 ? 2 : 3
    }
    return levels
  },

  todaysPlannedSession() {
    const today = dateKey(new Date())
    const existing = S.sessions.find((s) => s.date === today)
    if (existing) return existing
    // Nothing logged yet: infer from the split by weekday.
    const dow = new Date().getDay()
    const titles = [null, 'Push A', 'Pull A', 'Legs', 'Push B', 'Pull B', null]
    return titles[dow] ? { date: today, title: titles[dow], status: 'planned', exercises: [] } : null
  },

  /* ── Scores ───────────────────────────────────────────────────────────── */

  fitnessScore(days = 7) {
    const sessions = SEL.sessionsInLast(days)
    const completed = sessions.filter((s) => s.status === 'completed')
    const planned = sessions.length
    const activeDays = new Set(completed.map((s) => s.date)).size

    const thisVol = completed.reduce((s, x) => s + SEL.sessionVolume(x), 0)
    const prevSessions = S.sessions.filter((s) => s.date >= daysAgo(days * 2 - 1) && s.date < daysAgo(days - 1))
    const prevVol = prevSessions.reduce((s, x) => s + SEL.sessionVolume(x), 0)

    return CALC.composeScore([
      planned > 0 ? {
        label: 'Planned sessions completed',
        value: round(Math.min(100, (completed.length / planned) * 100), 0),
        weight: 0.5,
        detail: `${completed.length} of ${planned} planned sessions`,
      } : null,
      {
        label: 'Days active',
        value: round(Math.min(100, (activeDays / (days * (4 / 7))) * 100), 0),
        weight: 0.3,
        detail: `${activeDays} active days out of ${days}`,
      },
      prevVol > 0 ? {
        label: 'Volume held or increased',
        value: thisVol >= prevVol * 0.95 ? 100 : 60,
        weight: 0.2,
        detail: `${FMT.num(Math.round(thisVol))} kg this week vs ${FMT.num(Math.round(prevVol))} kg last`,
      } : null,
    ], 'Half from the share of planned sessions you completed, three-tenths from how many days you were active, and two-tenths from whether training volume held up against the previous period. Areas with no data are left out and the rest are reweighted.')
  },

  nutritionScore(days = 7) {
    const daily = SEL.dailyNutrition(days)
    const cal = CALC.targetAdherence(daily.map((d) => ({ date: d.date, value: d.calories })), S.goals.calories)
    const pro = CALC.targetAdherence(daily.map((d) => ({ date: d.date, value: d.protein })), S.goals.protein)
    const wat = CALC.targetAdherence(SEL.dailyWater(days), S.goals.waterMl)

    return CALC.composeScore([
      isOk(cal) ? { label: 'Calorie target', value: cal.value.adherencePercent, weight: 0.35, detail: `${cal.value.adherencePercent}% of your daily calorie target, averaged` } : null,
      isOk(pro) ? { label: 'Protein target', value: pro.value.adherencePercent, weight: 0.35, detail: `${pro.value.adherencePercent}% of your daily protein target, averaged` } : null,
      isOk(wat) ? { label: 'Water target', value: wat.value.adherencePercent, weight: 0.15, detail: `${wat.value.adherencePercent}% of your daily water target, averaged` } : null,
      { label: 'Days logged', value: round(Math.min(100, (daily.length / days) * 100), 0), weight: 0.15, detail: `${daily.length} of ${days} days had meals logged` },
    ], 'Calories and protein carry 35% each, water 15%, and how many days you logged at all the remaining 15%. Each day is capped at 100% before averaging, so one very large day cannot offset several small ones.')
  },

  habitScore(days = 7) {
    const parts = S.habits.map((h) => {
      const st = SEL.habitStats(h, days)
      return isOk(st) && st.value.eligibleDays > 0
        ? { label: h.name, value: st.value.completionRate, weight: 1 / S.habits.length, detail: `${st.value.completedDays} of ${st.value.eligibleDays} scheduled days` }
        : null
    })
    return CALC.composeScore(parts,
      'An equal-weighted average of the completion rate of every habit scheduled this week. Days you explicitly skipped are removed from the denominator rather than counted as misses.', 2)
  },

  recoveryToday() {
    const today = dateKey(new Date())
    const sleep = SEL.sleepOn(today) || SEL.sleepOn(daysAgo(1))
    const wb = SEL.wellbeingOn(today) || SEL.wellbeingOn(daysAgo(1))
    const hr = SEL.latestVital('resting_heart_rate')
    return CALC.recoveryIndicator({
      sleepMinutes: sleep ? sleep.durationMinutes : null,
      sleepQuality: sleep ? sleep.quality : null,
      soreness: wb ? wb.soreness : null,
      fatigue: wb ? wb.fatigue : null,
      stress: wb ? wb.stress : null,
      restingHeartRate: hr ? hr.value : null,
      baselineRestingHeartRate: S.profile.restingHrBaseline,
    })
  },

  lifeScore() {
    const f = SEL.fitnessScore(), n = SEL.nutritionScore(), h = SEL.habitScore(), r = SEL.recoveryToday()
    return CALC.composeScore([
      isOk(f) ? { label: 'Fitness', value: f.value.score, weight: 0.25, detail: 'Training consistency this week' } : null,
      isOk(n) ? { label: 'Nutrition', value: n.value.score, weight: 0.25, detail: 'Adherence to your nutrition targets' } : null,
      isOk(r) ? { label: 'Recovery', value: r.value.score, weight: 0.25, detail: 'Sleep and self-reported recovery' } : null,
      isOk(h) ? { label: 'Habits', value: h.value.score, weight: 0.25, detail: 'Habit completion rate' } : null,
    ], 'An equal-weighted average of your fitness, nutrition, recovery and habit scores. Domains with no data for the period are left out rather than counted as zero. Finance joins this score in Phase 3.', 3)
  },

  /* ── Attention items ──────────────────────────────────────────────────── */
  attention() {
    const items = []
    const today = dateKey(new Date())

    const water = SEL.waterOn(today)
    if (water < S.goals.waterMl * 0.5) {
      items.push({
        tone: 'cau', icon: 'droplet',
        title: 'Water is behind for today',
        detail: `${FMT.volume(water)} of ${FMT.volume(S.goals.waterMl)} logged`,
        action: { label: 'Add 500 ml', act: 'water-500' },
      })
    }

    const nut = SEL.nutritionOn(today)
    if (nut.meals.length === 0) {
      items.push({
        tone: 'cau', icon: 'utensils',
        title: 'No meals logged today',
        detail: 'Your calorie and protein figures will read as missing until something is logged.',
        action: { label: 'Add meal', act: 'sheet:meal' },
      })
    } else if (nut.protein < S.goals.protein * 0.6) {
      items.push({
        tone: 'cau', icon: 'utensils',
        title: 'Protein is tracking low today',
        detail: `${nut.protein} g of ${S.goals.protein} g. Roughly ${Math.round((S.goals.protein - nut.protein) / 25)} more servings would close it.`,
        action: { label: 'Add meal', act: 'sheet:meal' },
      })
    }

    const lastSleep = [...S.sleep].sort((a, b) => b.date.localeCompare(a.date))[0]
    if (lastSleep && lastSleep.durationMinutes < 360) {
      items.push({
        tone: 'cau', icon: 'moon',
        title: 'Short night recorded',
        detail: `${FMT.duration(lastSleep.durationMinutes)} on ${FMT.relDay(lastSleep.date).toLowerCase()}, against a ${FMT.duration(S.goals.sleepMinutes)} target.`,
        action: { label: 'View sleep', act: 'goto:health:sleep' },
      })
    }

    const planned = SEL.todaysPlannedSession()
    if (planned && planned.status === 'planned') {
      items.push({
        tone: 'acc', icon: 'dumbbell',
        title: `${esc(planned.title)} is scheduled today`,
        detail: 'Not started yet.',
        action: { label: 'Start workout', act: 'goto:fitness' },
      })
    }

    const missed = S.sessions.filter((s) => s.status === 'skipped' && s.date >= daysAgo(6))
    if (missed.length) {
      items.push({
        tone: 'cau', icon: 'dumbbell',
        title: `${missed.length} missed session${missed.length > 1 ? 's' : ''} this week`,
        detail: missed.map((m) => `${esc(m.title)} on ${FMT.relDay(m.date).toLowerCase()}`).join(', '),
        action: { label: 'View training', act: 'goto:fitness' },
      })
    }

    const lastWeigh = SEL.latestWeight()
    if (lastWeigh) {
      const gap = Math.round((new Date(today) - new Date(lastWeigh.date)) / DAY)
      if (gap >= 4) {
        items.push({
          tone: 'cau', icon: 'scale',
          title: 'Weight not recorded for ' + gap + ' days',
          detail: 'The trend line needs regular readings to stay meaningful.',
          action: { label: 'Record weight', act: 'sheet:weight' },
        })
      }
    }

    for (const m of S.medications) {
      const days = Math.round((new Date(m.refillOn) - new Date(today)) / DAY)
      if (days <= 7) {
        items.push({
          tone: days <= 2 ? 'neg' : 'cau', icon: 'pill',
          title: `${esc(m.name)} running low`,
          detail: `About ${m.quantityLeft} left · refill ${FMT.relDay(m.refillOn).toLowerCase()}`,
          action: { label: 'View', act: 'goto:health:meds' },
        })
      }
    }

    for (const a of S.appointments) {
      const days = Math.round((new Date(a.scheduledAt) - new Date(today)) / DAY)
      if (days <= 14 && days >= 0) {
        items.push({
          tone: 'acc', icon: 'calendar',
          title: a.title,
          detail: `${FMT.date(a.scheduledAt)} · ${esc(a.provider)}`,
          action: { label: 'Details', act: 'goto:health:records' },
        })
      }
    }

    return items
  },
}

/* Renders a Metric<T>. The whole reason insufficient_data exists as a
   first-class result: a missing metric becomes a prompt, never a zero. */
function metricBlock(m, render, opts = {}) {
  if (!isOk(m)) {
    return `<div class="stack-s">
      <div class="t-fig fig faint">—</div>
      ${opts.compact ? '' : `<p class="t-label muted" style="line-height:1.15rem">
        ${esc(m.reason)} <span class="faint">${esc(m.needed)}</span></p>`}
    </div>`
  }
  return `<div>
    <div class="t-fig fig">${render(m.value)}</div>
    ${m.caveat && !opts.compact ? `<p class="t-micro faint row" style="align-items:flex-start;gap:0.25rem;margin-top:0.25rem;line-height:1rem">
      ${ICON('info', 12, 2)}<span>${esc(m.caveat)}</span></p>` : ''}
  </div>`
}

function statCard(label, valueHtml, meta) {
  return `<div class="card card-pad" style="min-width:8.5rem">
    <div class="caps">${esc(label)}</div>
    <div style="margin-top:0.25rem">${valueHtml}</div>
    ${meta ? `<div class="t-micro faint" style="margin-top:0.125rem">${meta}</div>` : ''}
  </div>`
}

/* Score card with the info button that opens the explainer. Every score in
   the app is rendered through here, so none of them can ship without one. */
function scoreCard(id, title, metric, sub) {
  if (!isOk(metric)) {
    return `<div class="card card-pad stack-s" style="min-width:11rem">
      <div class="row-between"><span class="caps">${esc(title)}</span></div>
      <div class="t-fig fig faint">—</div>
      <p class="t-micro muted" style="line-height:1rem">${esc(metric.reason)}</p>
    </div>`
  }
  const v = metric.value
  const tone = v.band === 'excellent' || v.band === 'consistent' ? 'pos' : v.band === 'fair' ? 'cau' : 'neg'
  const bandLabel = { excellent: 'Excellent', consistent: 'Consistent', fair: 'Fair', needs_attention: 'Needs attention' }[v.band]

  SCORE_CACHE[id] = { title, metric }

  return `<div class="card card-pad stack-s" style="min-width:11rem">
    <div class="row-between">
      <span class="caps">${esc(title)}</span>
      <button class="btn-ghost" data-explain="${id}" aria-label="How ${esc(title)} is calculated"
              style="padding:0.25rem;margin:-0.25rem;border-radius:6px;color:hsl(var(--ink-faint))">
        ${ICON('info', 15, 2)}
      </button>
    </div>
    <div class="row" style="align-items:baseline;gap:0.375rem">
      <span class="t-fig-lg fig">${v.score}</span>
      <span class="t-micro faint fig">/100</span>
    </div>
    <div class="bar bar-${tone === 'pos' ? 'pos' : tone === 'cau' ? 'cau' : 'neg'}"><i style="width:${v.score}%"></i></div>
    <div class="row" style="gap:0.375rem">
      <span class="badge badge-${tone}">${ICON('check', 11, 2.4)}${bandLabel}</span>
      ${sub ? `<span class="t-micro faint">${esc(sub)}</span>` : ''}
    </div>
  </div>`
}

const SCORE_CACHE = {}

function attentionRow(item) {
  const toneClass = { cau: 'badge-cau', neg: 'badge-neg', acc: 'badge-acc' }[item.tone] || 'badge'
  return `<div class="card-pad row" style="gap:0.75rem;align-items:flex-start">
    <span class="badge ${toneClass}" style="width:28px;height:28px;padding:0;justify-content:center;flex:none;border-radius:8px">
      ${ICON(item.icon, 15, 2)}
    </span>
    <div style="min-width:0;flex:1">
      <div class="t-label semi">${esc(item.title)}</div>
      <div class="t-micro muted" style="line-height:1rem">${esc(item.detail)}</div>
    </div>
    ${item.action ? `<button class="btn btn-secondary btn-sm" data-act="${esc(item.action.act)}" style="flex:none">
      ${esc(item.action.label)}</button>` : ''}
  </div>`
}

function sectionHead(title, actionLabel, act) {
  return `<div class="row-between" style="padding:0 0.125rem">
    <h2 class="t-body semi">${esc(title)}</h2>
    ${actionLabel ? `<button class="btn btn-ghost btn-sm" data-act="${esc(act)}">${esc(actionLabel)}</button>` : ''}
  </div>`
}

VIEWS.home = function () {
  const today = dateKey(new Date())
  const hour = new Date().getHours()
  const greeting = hour < 5 ? 'Still up' : hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening'

  const w = SEL.latestWeight()
  const trend = CALC.weightTrend(S.weights)
  const nut = SEL.nutritionOn(today)
  const water = SEL.waterOn(today)
  const sleep = SEL.sleepOn(today) || SEL.sleepOn(daysAgo(1))
  const recovery = SEL.recoveryToday()
  const planned = SEL.todaysPlannedSession()
  const attention = SEL.attention()

  const weekSessions = SEL.sessionsInLast(7)
  const weekCompleted = weekSessions.filter((s) => s.status === 'completed')
  const weekSleep = CALC.sleepSummary(S.sleep.filter((s) => s.date >= daysAgo(6)))
  const weekProtein = CALC.targetAdherence(
    SEL.dailyNutrition(7).map((d) => ({ date: d.date, value: d.protein })), S.goals.protein)

  return `
  <header class="row-between" style="margin-bottom:1.25rem">

      <p class="t-micro faint">${new Date().toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' })}</p>
    </div>
    <div class="row" style="gap:0.375rem">
      <button class="btn btn-secondary btn-icon" aria-label="Search" data-act="noop">
        ${ICON('info', 18)}
      </button>
      <button class="btn btn-secondary btn-icon" aria-label="Notifications" data-act="noop" style="position:relative">
        ${ICON('calendar', 18)}
        <span style="position:absolute;top:9px;right:9px;width:7px;height:7px;border-radius:999px;background:hsl(var(--caution));border:1.5px solid hsl(var(--surface))"></span>
      </button>
    </div>
  </header>

  <div class="stack">

    <!-- Today's overview -->
    <section>
      ${sectionHead('Today')}
      <div class="rail" style="margin-top:0.5rem">
        ${statCard('Weight',
          metricBlock(w ? ok(w.kg) : missing('Not recorded yet.', 'Log your weight.'), (v) => FMT.weight(v), { compact: true }),
          w ? `${FMT.relDay(w.date)} · ${isOk(trend) ? FMT.delta(trend.value.weeklyRateKg, ' kg/wk', 2) : ''}` : '')}

        ${statCard('Calories',
          nut.meals.length
