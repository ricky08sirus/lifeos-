}

/* ── Spending ─────────────────────────────────────────────────────────── */
FINANCE_TABS.spending = function () {
  const cats = FSEL.spendByCategory(0)
  const split = FSEL.needsWantsSplit(0)
  const month = FSEL.monthBounds(0)
  const day = new Date().getDate()
  const elapsed = day / month.daysInMonth
  const recent = FSEL.txnsInMonth(0).filter((t) => t.direction === 'expense').slice(0, 12)

  const monthlyTotals = []
  for (let m = 5; m >= 0; m--) {
    monthlyTotals.push({
      label: FSEL.monthBounds(m).label.split(' ')[0].slice(0, 3),
      short: FSEL.monthBounds(m).label.split(' ')[0].slice(0, 3),
      value: Math.round(FSEL.monthSpend(m) / 100),
    })
  }

  return `<div class="stack">
    <div class="card card-pad">
      <div class="caps" style="margin-bottom:0.5rem">Spending, last 6 months</div>
      ${SVG.bars({ data: monthlyTotals, label: 'Monthly spending in rupees', unit: '', height: 110 })}
    </div>

    <section>
      ${sectionHead('Budgets', 'Add expense', 'sheet:expense')}
      <p class="t-micro faint" style="padding:0.25rem 0.125rem">
        The thin marker on each bar is where you would be if spending were even across the
        month — ${Math.round(elapsed * 100)}% of the way through. Being past it is not
        automatically a problem; rent lands on the 5th.
      </p>
      <div class="card divide" style="margin-top:0.5rem">
        ${cats.map((c) => {
          const usage = FCALC.budgetUsage(c.spentPaise, c.budgetPaise)
          if (!isOk(usage)) return ''
          const u = usage.value
          const tone = u.state === 'over' ? 'neg' : u.state === 'close' ? 'cau' : 'acc'
          return `<div class="card-pad">
            <div class="row-between" style="margin-bottom:0.375rem">
              <div style="min-width:0">
                <div class="row" style="gap:0.375rem">
                  <span class="t-label semi">${esc(c.name)}</span>
                  <span class="badge">${c.need === 'need' ? 'Need' : 'Want'}</span>
                </div>
                <div class="t-micro faint">${esc(c.group)}</div>
              </div>
              <div style="text-align:right;flex:none">
                <div class="t-label fig semi ${tone === 'neg' ? 'neg' : ''}">${FMT.money(c.spentPaise)}</div>
                <div class="t-micro faint fig">of ${FMT.money(c.budgetPaise)}</div>
              </div>
            </div>
            <div class="bar bar-${tone === 'acc' ? 'acc' : tone === 'cau' ? 'cau' : 'neg'}" style="position:relative">
              <i style="width:${Math.min(100, u.percent)}%"></i>
              <span style="position:absolute;top:-2px;bottom:-2px;left:${elapsed * 100}%;width:1.5px;background:hsl(var(--ink-faint));opacity:0.55"></span>
            </div>
            <div class="row-between t-micro faint" style="margin-top:0.25rem">
              <span>${u.percent}% used</span>
              <span class="fig">${u.remainingPaise >= 0 ? `${FMT.money(u.remainingPaise)} left` : `${FMT.money(-u.remainingPaise)} over`}</span>
            </div>
          </div>`
        }).join('')}
      </div>
    </section>

    <section>
      ${sectionHead('Needs and wants')}
      <div class="card card-pad stack-s" style="margin-top:0.5rem">
        <div class="row" style="height:30px;border-radius:0.5rem;overflow:hidden;gap:2px">
          <div style="width:${(split.need / split.total) * 100}%;background:hsl(var(--accent));display:grid;place-items:center">
            <span class="t-micro fig semi" style="color:hsl(var(--accent-ink))">${Math.round((split.need / split.total) * 100)}%</span>
          </div>
          <div style="width:${(split.want / split.total) * 100}%;background:hsl(var(--accent) / 0.3);display:grid;place-items:center">
            <span class="t-micro fig semi">${Math.round((split.want / split.total) * 100)}%</span>
          </div>
        </div>
        <div class="row-between t-label">
          <span>Needs <span class="fig muted">${FMT.money(split.need)}</span></span>
          <span>Wants <span class="fig muted">${FMT.money(split.want)}</span></span>
        </div>
        <p class="t-micro faint" style="line-height:1rem">
          You set which categories count as needs. The app does not decide that for you —
          a gym membership is discretionary for one person and medical for another.
        </p>
      </div>
    </section>

    <section>
      ${sectionHead('Subscriptions')}
      <div class="card divide" style="margin-top:0.5rem">
        ${S.finance.subscriptions.map((s) => {
          const annual = s.recurrence === 'monthly' ? s.amountPaise * 12 : s.amountPaise
          const stale = s.lastUsedDaysAgo > 30
          return `<div class="card-pad row-between">
            <div style="min-width:0">
              <div class="row" style="gap:0.375rem">
                <span class="t-label semi">${esc(s.name)}</span>
                ${stale ? `<span class="badge badge-cau">Unused ${s.lastUsedDaysAgo}d</span>` : ''}
              </div>
              <div class="t-micro faint">${s.recurrence} · ${FMT.money(annual)} a year</div>
            </div>
            <div class="row" style="gap:0.5rem;flex:none">
              <span class="t-body fig semi ${stale ? 'cau' : ''}">${FMT.money(s.amountPaise)}</span>
              ${rowMenu('subscription', s.id)}
            </div>
          </div>`
        }).join('')}
      </div>
      <p class="t-micro faint" style="padding:0.5rem 0.125rem">
        Annualised cost is shown because ₹1,059 a month reads as small and ₹12,708 a year
        does not. Both are the same number.
      </p>
    </section>

    <section>
      ${sectionHead('Recent transactions')}
      <div class="card divide" style="margin-top:0.5rem">
        ${recent.map((t) => {
          const cat = S.finance.categories.find((c) => c.id === t.categoryId)
          const acc = S.finance.accounts.find((a) => a.id === t.accountId)
          return `<div class="card-pad row-between">
            <div style="min-width:0">
              <div class="t-label semi">${esc(t.merchant)}</div>
              <div class="t-micro faint">${cat ? esc(cat.name) : 'Uncategorised'} · ${acc ? esc(acc.name) : ''} · ${FMT.relDay(t.date)}</div>
            </div>
            <div class="row" style="gap:0.5rem;flex:none">
              <span class="t-body fig semi">${FMT.money(t.amountPaise)}</span>
              ${rowMenu('transaction', t.id)}
            </div>
          </div>`
        }).join('')}
      </div>
    </section>
  </div>`
}

/* ── Debts and EMIs ───────────────────────────────────────────────────── */
FINANCE_TABS.debts = function () {
  const debts = FSEL.debtsWithOutstanding().filter((d) => d.outstandingPaise > 0)
  const total = debts.reduce((s, d) => s + d.outstandingPaise, 0)
  const monthlyEmi = debts.reduce((s, d) => s + d.emiPaise, 0)
  const dti = FCALC.debtToIncome(monthlyEmi, S.finance.income.monthlyNetPaise)

  const extra = STATE_UI.payoffExtra ?? 0
  const payoffDebts = debts.map((d) => ({
    id: d.id, name: d.name, outstandingPaise: d.outstandingPaise,
    annualRatePct: d.annualRatePct, emiPaise: d.emiPaise,
  }))
  const snowball = FCALC.simulatePayoff(payoffDebts, extra, 'snowball')
  const avalanche = FCALC.simulatePayoff(payoffDebts, extra, 'avalanche')

  const better = isOk(snowball) && isOk(avalanche)
    ? (avalanche.value.totalInterestPaise < snowball.value.totalInterestPaise ? 'avalanche' : 'snowball')
    : null
  const saving = isOk(snowball) && isOk(avalanche)
    ? Math.abs(snowball.value.totalInterestPaise - avalanche.value.totalInterestPaise)
    : 0

  return `<div class="stack">
    <div class="grid-3">
      ${statCard('Outstanding', `<span class="t-fig fig">${FMT.money(total, { compact: true })}</span>`, `${debts.length} active`)}
      ${statCard('Monthly EMI', `<span class="t-fig fig">${FMT.money(monthlyEmi, { compact: true })}</span>`, 'across all loans')}
      ${statCard('Debt to income', metricBlock(dti, (v) => `${v.ratio}%`, { compact: true }), isOk(dti) ? dti.value.band : '')}
    </div>

    <section>
      ${sectionHead('Active loans and EMIs', 'Add', 'noop')}
      <div class="card divide" style="margin-top:0.5rem">
        ${debts.map((d) => {
          const paidPct = ((d.principalPaise - d.outstandingPaise) / d.principalPaise) * 100
          const totalInt = FCALC.totalInterest(d.principalPaise, d.annualRatePct, d.termMonths)
          return `<div class="card-pad" data-act="debt:${d.id}" style="cursor:pointer">
            <div class="row-between" style="margin-bottom:0.375rem">
              <div style="min-width:0">
                <div class="row" style="gap:0.375rem">
                  <span class="t-label semi">${esc(d.name)}</span>
                  ${d.annualRatePct === 0 ? '<span class="badge badge-pos">0%</span>' : `<span class="badge">${d.annualRatePct}%</span>`}
                </div>
                <div class="t-micro faint">${esc(d.lender)} · ${d.paymentsRemaining} of ${d.termMonths} payments left</div>
              </div>
              <div class="row" style="gap:0.5rem;flex:none">
                <div style="text-align:right">
                  <div class="t-body fig semi">${FMT.money(d.outstandingPaise)}</div>
                  <div class="t-micro faint fig">${FMT.money(d.emiPaise)}/mo</div>
                </div>
                ${rowMenu('debt', d.id)}
              </div>
            </div>
            <div class="bar bar-acc"><i style="width:${paidPct}%"></i></div>
            <div class="row-between t-micro faint" style="margin-top:0.25rem">
              <span>${Math.round(paidPct)}% repaid</span>
              <span class="fig">${isOk(totalInt) && totalInt.value > 0 ? `${FMT.money(totalInt.value)} interest over the full term` : 'no interest'}</span>
            </div>
          </div>`
        }).join('')}
      </div>
    </section>

    <!-- Payoff strategy comparison -->
    <section>
      ${sectionHead('Paying it off faster')}
      <div class="card card-pad stack-s" style="margin-top:0.5rem">
        <div>
          <label class="t-label muted" for="extraSlider">Extra each month, on top of your EMIs</label>
          <div class="row" style="gap:0.75rem;margin-top:0.375rem">
            <input type="range" id="extraSlider" min="0" max="25000" step="1000" value="${extra / 100}"
                   style="flex:1;accent-color:hsl(var(--accent));height:44px" aria-label="Extra monthly payment">
            <span class="t-body fig semi" style="min-width:5.5rem;text-align:right">${FMT.money(extra)}</span>
          </div>
        </div>

        <div class="grid-2" style="margin-top:0.25rem">
          ${[['snowball', 'Snowball', snowball, 'Smallest balance first'],
             ['avalanche', 'Avalanche', avalanche, 'Highest rate first']].map(([key, label, result, sub]) => `
            <div class="card card-pad" style="${better === key ? 'border-color:hsl(var(--accent))' : ''}">
              <div class="row-between" style="margin-bottom:0.25rem">
                <span class="caps">${label}</span>
                ${better === key ? '<span class="badge badge-acc">Less interest</span>' : ''}
              </div>
              ${isOk(result) ? `
                <div class="t-fig fig">${result.value.months} mo</div>
                <div class="t-micro faint">${FMT.money(result.value.totalInterestPaise)} interest</div>
                <div class="t-micro muted" style="margin-top:0.375rem">${sub}</div>
                <div class="t-micro faint" style="margin-top:0.25rem;line-height:1rem">
                  Order: ${result.value.order.join(' → ')}
                </div>
              ` : `<p class="t-micro faint">${esc(result.reason)}</p>`}
            </div>`).join('')}
        </div>

        ${isOk(snowball) && isOk(avalanche) ? `
          <div class="card-pad" style="background:hsl(var(--canvas));border-radius:0.625rem">
            <p class="t-label" style="line-height:1.2rem">
              Avalanche saves <strong class="fig">${FMT.money(saving)}</strong> in interest.
              ${saving < 500000
                ? 'That is a small gap over the full term, and snowball clears your first loan sooner — some people stick with a plan better when they see one disappear early.'
                : 'Over this size of balance the difference is material.'}
            </p>
            <p class="t-micro faint" style="margin-top:0.375rem;line-height:1rem">
              Both assume you keep paying every EMI and roll each cleared payment into the next
              loan. Neither accounts for prepayment charges, which several lenders apply.
            </p>
          </div>` : ''}
      </div>
    </section>

    <button class="btn btn-secondary" data-act="sheet:affordability">
      ${ICON('rupee', 16, 2)} Simulate a new purchase
    </button>
  </div>`
}

/* ── Investments ──────────────────────────────────────────────────────── */
FINANCE_TABS.invest = function () {
  const invested = FSEL.investedCostPaise()
  const current = FSEL.investedValuePaise()
  const gain = FCALC.investmentGain(invested, current)
  const portfolioXirr = FSEL.portfolioXirr()
  const monthlySip = S.finance.investments.reduce((s, i) => s + i.sipPaise, 0)

  const byKind = {}
  for (const i of S.finance.investments) {
    const value = Math.round(i.units * i.currentNavPaise)
    byKind[i.kind] = (byKind[i.kind] || 0) + value
  }
  const kindLabels = { mutual_fund: 'Mutual funds', stock: 'Stocks', epf: 'EPF', ppf: 'PPF' }
  const allocation = Object.entries(byKind).sort((a, b) => b[1] - a[1])

  return `<div class="stack">
    <div class="card card-pad">
      <div class="row-between" style="margin-bottom:0.5rem">
        <div>
          <span class="caps">Portfolio value</span>
          <div class="t-fig-lg fig">${FMT.money(current)}</div>
          ${isOk(gain) ? `<div class="t-micro ${gain.value.absolutePaise >= 0 ? 'pos' : 'neg'}">
            ${FMT.money(gain.value.absolutePaise, { showSign: true })} · ${gain.value.percent > 0 ? '+' : ''}${gain.value.percent}%
          </div>` : ''}
        </div>
        <div style="text-align:right">
          <div class="caps">XIRR</div>
          ${metricBlock(portfolioXirr, (v) => `${v}%`, { compact: true })}
          <div class="t-micro faint">annualised</div>
        </div>
      </div>
      <p class="t-micro faint" style="line-height:1rem">
        XIRR weights every contribution by how long it has been invested, which is the only
        honest way to measure a SIP. A simple percentage gain would flatter a portfolio you
        have only recently added to.
      </p>
    </div>

    <div class="grid-2">
      ${statCard('Invested', `<span class="t-fig fig">${FMT.money(invested, { compact: true })}</span>`, 'total cost basis')}
      ${statCard('Monthly SIP', `<span class="t-fig fig">${FMT.money(monthlySip, { compact: true })}</span>`, `${S.finance.investments.filter((i) => i.sipPaise > 0).length} active`)}
    </div>

    <section>
      ${sectionHead('Allocation')}
      <div class="card card-pad stack-s" style="margin-top:0.5rem">
        ${allocation.map(([kind, value]) => `
          <div>
            <div class="row-between" style="margin-bottom:0.25rem">
              <span class="t-label">${kindLabels[kind] || kind}</span>
              <span class="t-label fig muted">${FMT.money(value, { compact: true })} · ${Math.round((value / current) * 100)}%</span>
            </div>
            <div class="bar bar-acc"><i style="width:${(value / current) * 100}%"></i></div>
          </div>`).join('')}
      </div>
    </section>

    <section>
      ${sectionHead('Holdings', 'Add', 'noop')}
      <div class="card divide" style="margin-top:0.5rem">
        ${S.finance.investments.map((i) => {
          const value = Math.round(i.units * i.currentNavPaise)
          const cost = Math.round(i.units * i.avgCostPaise)
          const g = FCALC.investmentGain(cost, value)
          const x = FCALC.xirr(FSEL.investmentFlows(i))
          return `<div class="card-pad row-between">
            <div style="min-width:0">
              <div class="t-label semi">${esc(i.name)}</div>
              <div class="t-micro faint">
                ${kindLabels[i.kind] || i.kind}${i.sipPaise > 0 ? ` · ${FMT.money(i.sipPaise)}/mo SIP` : ''}
                ${isOk(x) ? ` · XIRR ${x.value}%` : ''}
              </div>
            </div>
            <div class="row" style="gap:0.5rem;flex:none">
              <div style="text-align:right">
                <div class="t-body fig semi">${FMT.money(value, { compact: true })}</div>
                ${isOk(g) ? `<div class="t-micro fig ${g.value.absolutePaise >= 0 ? 'pos' : 'neg'}">
                  ${g.value.percent > 0 ? '+' : ''}${g.value.percent}%</div>` : ''}
              </div>
              ${rowMenu('investment', i.id)}
            </div>
          </div>`
        }).join('')}
      </div>
      <p class="t-micro faint" style="padding:0.5rem 0.125rem">
        NAVs are the ones you last entered by hand. There is no live price feed — a stale
        figure you can see the date of beats a fabricated one you cannot.
      </p>
    </section>
  </div>`
}

/* ── Accounts ─────────────────────────────────────────────────────────── */

  const cards = S.finance.accounts.filter((a) => a.kind === 'credit_card')

  return `<div class="stack">
    <section>
      ${sectionHead('Bank and cash', 'Add', 'noop')}
      <div class="card divide" style="margin-top:0.5rem">
        ${banks.map((a) => `
          <div class="card-pad row-between">
            <div style="min-width:0">
              <div class="row" style="gap:0.375rem">
                <span class="t-label semi">${esc(a.name)}</span>
                ${a.isPrimary ? '<span class="badge badge-acc">Primary</span>' : ''}
              </div>
              <div class="t-micro faint">${a.institution ? esc(a.institution) : 'Cash'}${a.masked ? ` · ····${a.masked}` : ''}</div>
            </div>
            <div class="row" style="gap:0.5rem;flex:none">
              <span class="t-body fig semi">${FMT.money(a.balancePaise)}</span>
              ${rowMenu('account', a.id)}
            </div>
          </div>`).join('')}
        <div class="card-pad row-between" style="background:hsl(var(--canvas))">
          <span class="t-label semi">Total liquid</span>
          <span class="t-body fig semi">${FMT.money(FSEL.liquidPaise())}</span>
        </div>
      </div>
    </section>

    <section>
      ${sectionHead('Credit cards', 'Add', 'noop')}
      <div class="card divide" style="margin-top:0.5rem">
        ${cards.map((a) => {
          const used = Math.abs(a.balancePaise)
          const pct = (used / a.limitPaise) * 100
          const tone = pct > 50 ? 'neg' : pct > 30 ? 'cau' : 'acc'
          return `<div class="card-pad">
            <div class="row-between" style="margin-bottom:0.375rem">
              <div style="min-width:0">
                <div class="t-label semi">${esc(a.name)}</div>
                <div class="t-micro faint">····${a.masked} · statement ${a.statementDay}th · due ${a.dueDay}th</div>
              </div>
              <div style="text-align:right;flex:none">
                <div class="t-body fig semi">${FMT.money(used)}</div>
                <div class="t-micro faint fig">of ${FMT.money(a.limitPaise, { compact: true })}</div>
              </div>
            </div>
            <div class="bar bar-${tone === 'acc' ? 'acc' : tone === 'cau' ? 'cau' : 'neg'}"><i style="width:${pct}%"></i></div>
            <div class="t-micro ${tone === 'neg' ? 'neg' : 'faint'}" style="margin-top:0.25rem">
              ${Math.round(pct)}% utilisation

          </div>`
        }).join('')}
      </div>
      <p class="disclaimer" style="margin-top:0.5rem">

        this application for a CVV, a PIN, a full card number or a banking password, and
        there will not be one.
      </p>

   by side, and stops. The person decides.
   ─────────────────────────────────────────────────────────────────────── */

function renderAffordability() {
  const st = STATE_UI.afford || (STATE_UI.afford = {
    price: 139900, down: 20000, rate: 0, term: 12,
  })

  const input = {
    pricePaise: Math.round(st.price * 100),
    downPaymentPaise: Math.round(st.down * 100),
    annualRatePct: st.rate,
    termMonths: st.term,
    monthlyIncomePaise: S.finance.income.monthlyNetPaise,
    existingDebtPaise: FSEL.monthlyEmiPaise(),
    monthlySurplusPaise: FSEL.monthlySurplusPaise(),
    emergencyFundPaise: FSEL.liquidPaise(),
    monthlyEssentialsPaise: FSEL.monthlyEssentialsPaise(),
  }

  const result = FCALC.simulateAffordability(input)

  const field = (id, label, value, suffix, step, max) => `
    <div class="field">
      <label for="af-${id}">${label}${suffix ? ` <span class="faint">(${suffix})</span>` : ''}</label>
      <input type="number" id="af-${id}" data-afford="${id}" value="${value}"
             inputmode="numeric" step="${step}" ${max ? `max="${max}"` : ''}>
    </div>`

  if (!isOk(result)) {
    return `<div class="stack">
      ${affordInputs()}
      <div class="card"><div class="empty"><h3>Cannot simulate this yet</h3>
        <p>${esc(result.reason)} ${esc(result.needed)}</p></div></div>
    </div>`
  }

  const r = result.value
  const dtiWorsens = r.newDtiPercent > r.currentDtiPercent
  const surplusNegative = r.surplusAfterPaise < 0

  return `<div class="stack">
    ${affordInputs()}

    <!-- The four things that change -->
    <div class="card card-pad">
      <div class="caps" style="margin-bottom:0.75rem">What changes if you go ahead</div>
      <div class="stack-s">
        ${[
          ['Monthly EMI', '—', FMT.money(r.emiPaise), 'neutral'],
          ['Monthly surplus', FMT.money(r.surplusBeforePaise), FMT.money(r.surplusAfterPaise), surplusNegative ? 'bad' : 'neutral'],
          ['Debt to income', `${r.currentDtiPercent}%`, `${r.newDtiPercent}%`, dtiWorsens && r.newDtiPercent > 40 ? 'bad' : 'neutral'],
          ['Emergency buffer', `${r.emergencyMonthsBefore} mo`, `${r.emergencyMonthsAfter} mo`, r.emergencyMonthsAfter < 3 ? 'bad' : 'neutral'],
        ].map(([label, before, after, tone]) => `
          <div class="row-between card-pad" style="background:hsl(var(--canvas));border-radius:0.625rem;padding:0.625rem 0.75rem">
            <span class="t-label">${label}</span>
            <span class="row" style="gap:0.5rem">
              <span class="t-label fig faint">${before}</span>
              <span class="faint">${ICON('trend', 13, 2)}</span>
              <span class="t-body fig semi ${tone === 'bad' ? 'cau' : ''}">${after}</span>
            </span>
          </div>`).join('')}
      </div>
    </div>

    <!-- Total cost -->
    <div class="card card-pad">
      <div class="caps" style="margin-bottom:0.5rem">Total cost</div>
      <div class="grid-3">
        ${[
          ['Sticker price', FMT.money(input.pricePaise)],
          ['You pay', FMT.money(r.totalCostPaise)],
          ['Interest', r.totalInterestPaise > 0 ? FMT.money(r.totalInterestPaise) : 'None'],
        ].map(([k, v]) => `
          <div style="text-align:center">
            <div class="t-micro muted">${k}</div>
            <div class="t-body fig semi">${v}</div>
          </div>`).join('')}
      </div>
      ${r.totalInterestPaise > 0 ? `
        <p class="t-micro faint" style="margin-top:0.5rem;line-height:1rem">
          Over ${st.term} months you would pay ${FMT.money(r.totalInterestPaise)} more than the
          price on the tag — ${Math.round((r.totalInterestPaise / r.financedPaise) * 100)}% on top of
          the financed amount.
        </p>` : ''}
    </div>

    <!-- Observations, explicitly not a verdict -->
    ${r.observations.length ? `
      <div class="card card-pad">
        <div class="caps" style="margin-bottom:0.5rem">Worth noticing</div>
        <ul class="stack-s" style="list-style:none">
          ${r.observations.map((o) => `
            <li class="row" style="align-items:flex-start;gap:0.5rem">
              <span class="cau" style="flex:none;margin-top:1px">${ICON('info', 14, 2)}</span>
              <span class="t-label" style="line-height:1.15rem">${esc(o)}</span>
            </li>`).join('')}
        </ul>
      </div>` : `
      <div class="card card-pad row" style="gap:0.5rem">
        <span class="pos" style="flex:none">${ICON('check', 16, 2.4)}</span>
        <span class="t-label">Nothing here stands out against your current numbers.</span>
      </div>`}

    <!-- Down payment comparison -->
    <div class="card card-pad">
      <div class="caps" style="margin-bottom:0.5rem">If you put more down</div>
      <table class="chart-data">
        <thead><tr>
          <th scope="col">Down payment</th><th scope="col">EMI</th><th scope="col">Total interest</th>
        </tr></thead>
        <tbody>
          ${[0, 0.1, 0.2, 0.35, 0.5].map((frac) => {
            const down = Math.round(input.pricePaise * frac)
            const financed = input.pricePaise - down
            const emi = FCALC.emi(financed, st.rate, st.term)
            const interest = isOk(emi) ? emi.value * st.term - financed : 0
            const isCurrent = Math.abs(down - input.downPaymentPaise) < 100000
            return `<tr style="${isCurrent ? 'background:hsl(var(--accent-soft))' : ''}">
              <td>${FMT.money(down, { compact: true })}${isCurrent ? ' ·' : ''}</td>
              <td data-numeric>${isOk(emi) ? FMT.money(emi.value) : '—'}</td>
              <td data-numeric>${interest > 0 ? FMT.money(interest) : '—'}</td>
            </tr>`
          }).join('')}
        </tbody>
      </table>
    </div>

    <p class="disclaimer">
      This simulator deliberately does not tell you whether to buy. It cannot see your job
      security, your family's commitments or what else is coming — so it shows what the
      numbers do and leaves the decision with you. It is not financial advice.
    </p>
  </div>`

  function affordInputs() {
    return `<div class="card card-pad">
      <div class="grid-2">
        ${field('price', 'Price', st.price, '₹', '1000')}
        ${field('down', 'Down payment', st.down, '₹', '1000')}
        ${field('rate', 'Interest rate', st.rate, '% a year', '0.5')}
        ${field('term', 'Tenure', st.term, 'months', '1', '360')}
      </div>
      <div class="chipset" style="margin-top:0.75rem">
        ${[['Phone on 0% EMI', 139900, 20000, 0, 12],
           ['Laptop, 13%', 199900, 0, 13, 18],
           ['Used car, 9.4%', 650000, 130000, 9.4, 60]].map(([label, p, d, r, t]) => `
          <button class="chip" data-afford-preset="${p},${d},${r},${t}">${label}</button>`).join('')}
      </div>
    </div>`
  }
}

/* ═════════════════════════════════════════════════════════════════════════
   PHASE 4 · ANALYTICS
   ═════════════════════════════════════════════════════════════════════════
   Ported from src/lib/calculations/analytics.ts, which carries 46 tests.

   The governing worry for this whole module: it is trivially easy to build
   something here that looks insightful and is worthless. Comparing 15
   measurements pairwise is 105 tests; at p < 0.05 you would expect about
   five "findings" from pure noise, and anyone reading that grid will
   construct a story around them.

   So: every correlation reports its sample size and a confidence interval,
   the whole family is corrected together with Benjamini–Hochberg, anything
   under 14 overlapping days is refused outright, and the vocabulary never
   leaves "moved together". There is no cause, driver or impact anywhere.
   ═════════════════════════════════════════════════════════════════════════ */

const ACALC = {
  normalCdf(z) {
    const sign = z < 0 ? -1 : 1
    const x = Math.abs(z) / Math.SQRT2
    const t = 1 / (1 + 0.3275911 * x)
    const y = 1 - ((((1.061405429 * t - 1.453152027) * t + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x)
    return 0.5 * (1 + sign * y)
  },

  mean: (v) => v.reduce((s, x) => s + x, 0) / v.length,

  rankWithTies(values) {
    const idx = values.map((value, index) => ({ value, index }))
    idx.sort((a, b) => a.value - b.value)
    const ranks = new Array(values.length)
    let i = 0
    while (i < idx.length) {
      let j = i
      while (j + 1 < idx.length && idx[j + 1].value === idx[i].value) j++
      const avg = (i + j) / 2 + 1
      for (let k = i; k <= j; k++) ranks[idx[k].index] = avg
      i = j + 1
    }
    return ranks
  },

  /* Positive lag pairs A on day n with B on day n+lag — "does last night's
     sleep relate to today's training". Still not causation: a busy week
     lowers both without either touching the other. */
  alignSeries(a, b, lagDays = 0) {
    const map = new Map(b.map((p) => [p.date, p.value]))
    const pairs = []
    for (const p of a) {
      const key = lagDays === 0 ? p.date : dateKey(new Date(p.date).getTime() + lagDays * DAY)
      const partner = map.get(key)
      if (partner !== undefined && isFinite(p.value) && isFinite(partner)) pairs.push([p.value, partner])
    }
    return pairs
  },

  pearson(pairs, opts = {}) {
    const { minSample = 14, lagDays = 0 } = opts
    const n = pairs.length
    if (n < minSample) {
      return missing(`Only ${n} day${n === 1 ? '' : 's'} have both measurements.`,
        `At least ${minSample} overlapping days are needed before a relationship means anything.`)
    }
    const xs = pairs.map((p) => p[0]), ys = pairs.map((p) => p[1])
    const mx = ACALC.mean(xs), my = ACALC.mean(ys)
    let num = 0, sxx = 0, syy = 0
    for (let i = 0; i < n; i++) {
      const dx = xs[i] - mx, dy = ys[i] - my
      num += dx * dy; sxx += dx * dx; syy += dy * dy
    }
    // A habit done every single day has no variance. r = 0 would read as
    // "no relationship" when the honest answer is "unanswerable".
    //
    // Compared RELATIVE to scale, not against exact zero: differencing a
    // linear series leaves residuals near 1e-17, which is not zero, and an
    // exact test would let the engine correlate numerical dust.
    if (ACALC.effectivelyConstant(xs, sxx) || ACALC.effectivelyConstant(ys, syy)) {
      return missing('One of these measurements never changes over this period.',
        'A relationship needs both values to vary.')
    }
    return ok(ACALC.build(num / Math.sqrt(sxx * syy), n, 'pearson', lagDays), { n, lagDays })
  },

  effectivelyConstant(values, sumSquaredDeviations) {
    if (sumSquaredDeviations === 0) return true
    const scale = Math.max(...values.map((v) => Math.abs(v)), Number.MIN_VALUE)
    return Math.sqrt(sumSquaredDeviations / values.length) <= scale * 1e-9
  },

  /* Does this series drift consistently over time? Two series that each
     trend will correlate with each other whether or not they are related —
     spurious regression, the commonest way a correlation tool misleads. */
  hasStrongTimeTrend(points, threshold = 0.5) {
    if (points.length < 4) return false
    const sorted = [...points].sort((a, b) => a.date.localeCompare(b.date))
    const origin = new Date(sorted[0].date).getTime()
    const xs = sorted.map((p) => (new Date(p.date).getTime() - origin) / DAY)
    const ys = sorted.map((p) => p.value)
    const mx = ACALC.mean(xs), my = ACALC.mean(ys)
    let num = 0, sxx = 0, syy = 0
    for (let i = 0; i < xs.length; i++) {
      const dx = xs[i] - mx, dy = ys[i] - my
      num += dx * dy; sxx += dx * dx; syy += dy * dy
    }
    if (sxx === 0 || syy === 0) return false
    return Math.abs(num / Math.sqrt(sxx * syy)) >= threshold
  },

  spearman(pairs, opts = {}) {
    const { minSample = 14, lagDays = 0 } = opts
    if (pairs.length < minSample) {
      return missing(`Only ${pairs.length} day${pairs.length === 1 ? '' : 's'} have both measurements.`,
        `At least ${minSample} overlapping days are needed before a relationship means anything.`)
    }
    const rx = ACALC.rankWithTies(pairs.map((p) => p[0]))
    const ry = ACALC.rankWithTies(pairs.map((p) => p[1]))
    const r = ACALC.pearson(rx.map((x, i) => [x, ry[i]]), { minSample, lagDays })
    if (!isOk(r)) return r
    return ok({ ...r.value, method: 'spearman' }, { n: pairs.length, lagDays })
  },

  /* Fisher z-transform gives the p-value and the interval together. */
  build(r, n, method, lagDays) {
    const clamped = Math.max(-0.999999, Math.min(0.999999, r))
    const z = Math.atanh(clamped)
    const se = 1 / Math.sqrt(n - 3)
    const p = 2 * (1 - ACALC.normalCdf(Math.abs(z / se)))
    const mag = Math.abs(r)
    return {
      r: round(r, 3), n, pValue: round(p, 5), adjustedPValue: null,
      confidenceInterval: [round(Math.tanh(z - 1.959964 * se), 3), round(Math.tanh(z + 1.959964 * se), 3)],
      strength: mag < 0.2 ? 'negligible' : mag < 0.4 ? 'weak' : mag < 0.6 ? 'moderate' : 'strong',
      direction: mag < 0.2 ? 'none' : r > 0 ? 'together' : 'opposite',
      isSignificant: false, method, lagDays, sharedTrend: false,
    }
  },

  /* Benjamini–Hochberg. Chosen over Bonferroni because Bonferroni at 100+
     comparisons suppresses real effects along with the noise, and a tool
     that shows nothing is as useless as one that shows everything. */
  benjaminiHochberg(pValues) {
    const m = pValues.length
    if (m === 0) return []
    const idx = pValues.map((p, index) => ({ p, index })).sort((a, b) => a.p - b.p)
    const adjusted = new Array(m)
    let runningMin = 1
    for (let i = m - 1; i >= 0; i--) {
      runningMin = Math.min(runningMin, Math.min(1, (idx[i].p * m) / (i + 1)))
      adjusted[idx[i].index] = runningMin
    }
    return adjusted.map((v) => round(v, 5))
  },

  correlationMatrix(series, opts = {}) {
    const { minSample = 14, falseDiscoveryRate = 0.1, lagDays = 0 } = opts
    if (series.length < 2) {
      return missing('At least two measurements are needed to compare.', 'Log a second kind of data.')
    }
    const tested = [], skipped = []
    for (let i = 0; i < series.length; i++) {
      for (let j = i + 1; j < series.length; j++) {
        const a = series[i], b = series[j]

        // A total and one of its own components correlate by arithmetic. A
        // tautology dressed as a finding is worse than no finding at all.
        if (a.componentOf === b.key || b.componentOf === a.key) {
          skipped.push({ labelA: a.label, labelB: b.label,
            reason: 'One of these is part of the other, so they correlate by arithmetic rather than by any relationship.' })
          continue
        }

        const pairs = ACALC.alignSeries(a.points, b.points, lagDays)
        const useSpearman = a.preferSpearman || b.preferSpearman
        const res = useSpearman
          ? ACALC.spearman(pairs, { minSample, lagDays })
          : ACALC.pearson(pairs, { minSample, lagDays })
        if (!isOk(res)) { skipped.push({ labelA: a.label, labelB: b.label, reason: res.reason }); continue }
        // Flag pairs where the calendar plausibly explains both.
        res.value.sharedTrend = ACALC.hasStrongTimeTrend(a.points) && ACALC.hasStrongTimeTrend(b.points)
        tested.push({ keyA: a.key, keyB: b.key, labelA: a.label, labelB: b.label,
                      domainA: a.domain, domainB: b.domain, result: res.value })
      }
    }
    if (tested.length === 0) {
      return missing('No pair of measurements has enough overlapping days yet.',
        `Relationships appear once two things share ${minSample} days.`)
    }
    // Corrected as one family. Correcting each pair alone would be exactly
    // the mistake this module exists to avoid.
    const adj = ACALC.benjaminiHochberg(tested.map((t) => t.result.pValue))
    tested.forEach((t, i) => {
      t.result.adjustedPValue = adj[i]
      t.result.isSignificant = adj[i] < falseDiscoveryRate
    })
    tested.sort((a, b) => Math.abs(b.result.r) - Math.abs(a.result.r))
    return ok({
      pairs: tested, comparisonsRun: tested.length,
      significantCount: tested.filter((t) => t.result.isSignificant).length,
      falseDiscoveryRate, skipped,
    }, { seriesCount: series.length, comparisonsRun: tested.length, lagDays },
      `${tested.length} comparisons were run. With this many tests some apparent relationships arise by chance, so p-values are adjusted to hold the false discovery rate at ${Math.round(falseDiscoveryRate * 100)}%. What follows are associations, not causes.`)
  },

  linearTrend(points, minSample = 5) {
    if (points.length < minSample) {
      return missing(`Only ${points.length} data point${points.length === 1 ? '' : 's'} in this period.`,
        `At least ${minSample} are needed to describe a trend.`)
    }
    const sorted = [...points].sort((a, b) => a.date.localeCompare(b.date))
    const origin = new Date(sorted[0].date).getTime()
    const xs = sorted.map((p) => (new Date(p.date).getTime() - origin) / DAY)
    const ys = sorted.map((p) => p.value)
    const mx = ACALC.mean(xs), my = ACALC.mean(ys)
    let sxy = 0, sxx = 0
    for (let i = 0; i < xs.length; i++) { sxy += (xs[i] - mx) * (ys[i] - my); sxx += (xs[i] - mx) ** 2 }
    if (sxx === 0) return missing('All readings fall on the same day.', 'Log across several days.')
    const slope = sxy / sxx, intercept = my - slope * mx
    let ssT = 0, ssR = 0
    for (let i = 0; i < xs.length; i++) {
      ssT += (ys[i] - my) ** 2
      ssR += (ys[i] - (intercept + slope * xs[i])) ** 2
    }
    const r2 = ssT === 0 ? 0 : 1 - ssR / ssT
    const span = xs[xs.length - 1]
    return ok({
      slopePerDay: round(slope, 4), totalChange: round(slope * span, 2), intercept: round(intercept, 3),
      rSquared: round(Math.max(0, r2), 3), n: sorted.length, spanDays: Math.round(span),
      direction: Math.abs(slope * span) < 0.01 ? 'flat' : slope > 0 ? 'rising' : 'falling',
    }, { n: sorted.length }, r2 < 0.15 ? 'The line explains very little of the variation, so treat the direction as weak.' : undefined)
  },

  /* Means rather than totals — periods rarely hold the same number of
     logged days, and a 31-vs-28 comparison manufactures a 10% "increase"
     out of the calendar. */
  comparePeriods(current, previous, minSample = 3) {
    if (current.length < minSample || previous.length < minSample) {
      return missing('One of these periods does not have enough logged data.',
        `At least ${minSample} entries are needed in each period.`)
    }
    const cm = ACALC.mean(current), pm = ACALC.mean(previous)
    const abs = cm - pm
    return ok({
      currentMean: round(cm, 2), previousMean: round(pm, 2), absoluteChange: round(abs, 2),
      percentChange: pm === 0 ? null : round((abs / Math.abs(pm)) * 100, 1),
      currentN: current.length, previousN: previous.length,
      direction: Math.abs(abs) < 1e-9 ? 'flat' : abs > 0 ? 'up' : 'down',
    }, {}, Math.abs(current.length - previous.length) > Math.max(current.length, previous.length) * 0.3
      ? 'The two periods have quite different amounts of logged data, so this comparison is uneven.' : undefined)
  },

  describe(res, labelA, labelB) {
    if (!res.isSignificant) {
      return `No reliable relationship between ${labelA} and ${labelB} over ${res.n} days. Any pattern here is within what chance would produce.`
    }
    const lag = res.lagDays === 0 ? 'on the same day'
      : `with ${labelB} measured ${Math.abs(res.lagDays)} day${Math.abs(res.lagDays) === 1 ? '' : 's'} ${res.lagDays > 0 ? 'later' : 'earlier'}`
    const verb = res.direction === 'together' ? 'higher' : 'lower'
    const trendWarning = res.sharedTrend
      ? ' Both measurements also drifted steadily over this period, so some or all of this may simply reflect the passage of time rather than any link between them.'
      : ''
    return `Over ${res.n} days, higher ${labelA} tended to come with ${verb} ${labelB} ${lag} (${res.strength} association, r = ${res.r}, 95% CI ${res.confidenceInterval[0]} to ${res.confidenceInterval[1]}).${trendWarning} This describes how the numbers moved, not why.`
  },
}

/* ─── Series catalogue ───────────────────────────────────────────────────
   Every daily measurement the app can correlate, from both domains. This
   list is the whole surface of the correlation explorer — adding a series
   here adds it everywhere, and increases the comparison count, which is why
   it is a curated list rather than everything the schema can produce.
   ───────────────────────────────────────────────────────────────────────── */

const ASEL = {
  rangeDays() { return STATE_UI.analyticsRange || 90 },

  windowFrom() { return daysAgo(ASEL.rangeDays() - 1) },

  inRange(points) {
    const from = ASEL.windowFrom()
    return points.filter((p) => p.date >= from)
  },

  catalogue() {
    const from = ASEL.windowFrom()
    const daily = (list) => list.filter((p) => p.date >= from && isFinite(p.value))

    // Daily training volume, zero on rest days excluded — a rest day is not
    // "zero training", it is an absence of the measurement.
    const volume = []
    for (const s of S.sessions) {
      if (s.date < from || s.status !== 'completed') continue
      const v = SEL.sessionVolume(s)
      if (v > 0) volume.push({ date: s.date, value: v })
    }

    const habitPct = []
    for (let i = ASEL.rangeDays() - 1; i >= 0; i--) {
      const d = new Date(Date.now() - i * DAY), key = dateKey(d)
      const scheduled = S.habits.filter((h) => !h.weekdays || h.weekdays.includes(d.getDay()))
      if (!scheduled.length) continue
      let done = 0, skipped = 0
      for (const h of scheduled) {
        const log = (S.habitLogs[h.id] || {})[key]
        if (log && log.status === 'done') done++
        else if (log && log.status === 'skipped') skipped++
      }
      const eligible = scheduled.length - skipped
      if (eligible > 0) habitPct.push({ date: key, value: (done / eligible) * 100 })
    }

    const spendByDay = new Map(), discretionaryByDay = new Map()
    for (const t of S.finance.transactions) {
      if (t.direction !== 'expense' || t.date < from) continue
      spendByDay.set(t.date, (spendByDay.get(t.date) || 0) + t.amountPaise / 100)
      if (t.need === 'want') {
        discretionaryByDay.set(t.date, (discretionaryByDay.get(t.date) || 0) + t.amountPaise / 100)
      }
    }
    const toSeries = (map) => [...map.entries()].map(([date, value]) => ({ date, value })).sort((a, b) => a.date.localeCompare(b.date))

    return [
      { key: 'weight', label: 'Body weight', unit: 'kg', domain: 'health',
        points: daily(S.weights.map((w) => ({ date: w.date, value: w.kg }))) },
      { key: 'sleepDur', label: 'Sleep duration', unit: 'h', domain: 'health',
        points: daily(S.sleep.map((s) => ({ date: s.date, value: s.durationMinutes / 60 }))) },
      // 1–5 ordinal — Spearman, not Pearson.
      { key: 'sleepQual', label: 'Sleep quality', unit: '/5', domain: 'health', preferSpearman: true,
        points: daily(S.sleep.map((s) => ({ date: s.date, value: s.quality }))) },
      { key: 'volume', label: 'Training volume', unit: 'kg', domain: 'fitness', points: volume },
      { key: 'calories', label: 'Calories', unit: 'kcal', domain: 'nutrition',
        points: daily(SEL.dailyNutrition(ASEL.rangeDays()).map((d) => ({ date: d.date, value: d.calories }))) },
      { key: 'protein', label: 'Protein', unit: 'g', domain: 'nutrition',
        points: daily(SEL.dailyNutrition(ASEL.rangeDays()).map((d) => ({ date: d.date, value: d.protein }))) },
      { key: 'water', label: 'Water', unit: 'ml', domain: 'nutrition',
        points: daily(SEL.dailyWater(ASEL.rangeDays())) },
      { key: 'habits', label: 'Habits completed', unit: '%', domain: 'habits', points: habitPct },
      { key: 'mood', label: 'Mood', unit: '/5', domain: 'health', preferSpearman: true,
        points: daily(S.wellbeing.map((w) => ({ date: w.date, value: w.mood }))) },
      { key: 'energy', label: 'Energy', unit: '/5', domain: 'health', preferSpearman: true,
        points: daily(S.wellbeing.map((w) => ({ date: w.date, value: w.energy }))) },
      { key: 'stress', label: 'Stress', unit: '/5', domain: 'health', preferSpearman: true,
        points: daily(S.wellbeing.map((w) => ({ date: w.date, value: w.stress }))) },
      { key: 'soreness', label: 'Soreness', unit: '/5', domain: 'health', preferSpearman: true,
        points: daily(S.wellbeing.map((w) => ({ date: w.date, value: w.soreness }))) },
      { key: 'rhr', label: 'Resting heart rate', unit: 'bpm', domain: 'health',
        points: daily(S.vitals.filter((v) => v.kind === 'resting_heart_rate').map((v) => ({ date: v.date, value: v.value }))) },
      // Spending is heavily skewed — one large day would dominate Pearson.
      { key: 'spend', label: 'Daily spending', unit: '₹', domain: 'finance', preferSpearman: true,
        points: toSeries(spendByDay) },
      // Declared a component of total spending, so the two are never
      // correlated against each other — that pair is arithmetic, not insight.
      { key: 'discretionary', label: 'Discretionary spending', unit: '₹', domain: 'finance',
        preferSpearman: true, componentOf: 'spend',
        points: toSeries(discretionaryByDay) },
    ]
  },

  matrix() {
    return ACALC.correlationMatrix(ASEL.catalogue(), {
      minSample: 14,
      falseDiscoveryRate: 0.1,
      lagDays: STATE_UI.analyticsLag || 0,
    })
  },

  /* Score history, recomputed for each of the last N weeks. */
  scoreHistory(weeks = 8) {
    const out = []
    for (let w = weeks - 1; w >= 0; w--) {
      const end = daysAgo(w * 7)
      const sessions = S.sessions.filter((s) => s.date > daysAgo(w * 7 + 7) && s.date <= end)
      const completed = sessions.filter((s) => s.status === 'completed').length
      const nutrition = SEL.dailyNutrition(w * 7 + 7).filter((d) => d.date > daysAgo(w * 7 + 7) && d.date <= end)
      out.push({
        date: end,
        fitness: sessions.length ? Math.round((completed / sessions.length) * 100) : null,
        nutritionDays: nutrition.length,
      })
    }
    return out
  },

  /* Both halves of a period comparison, for every headline metric. */
  comparison(days = 30) {
    const curFrom = daysAgo(days - 1), prevFrom = daysAgo(days * 2 - 1), prevTo = daysAgo(days)
    const split = (points) => [
      points.filter((p) => p.date >= curFrom).map((p) => p.value),
      points.filter((p) => p.date >= prevFrom && p.date <= prevTo).map((p) => p.value),
    ]

    const rows = []
    const add = (label, points, unit, fmt, betterWhen) => {
      const [cur, prev] = split(points)
      rows.push({ label, unit, fmt, betterWhen, metric: ACALC.comparePeriods(cur, prev) })
    }

    const cat = ASEL.catalogue()
    const find = (k) => cat.find((c) => c.key === k).points

    add('Body weight', find('weight'), 'kg', (v) => `${v.toFixed(1)} kg`, 'up')
    add('Sleep duration', find('sleepDur'), 'h', (v) => FMT.duration(v * 60), 'up')
    add('Training volume', find('volume'), 'kg', (v) => `${FMT.num(Math.round(v))} kg`, 'up')
    add('Calories', find('calories'), 'kcal', (v) => `${FMT.num(Math.round(v))}`, 'up')
    add('Protein', find('protein'), 'g', (v) => `${Math.round(v)} g`, 'up')
    add('Habits completed', find('habits'), '%', (v) => `${Math.round(v)}%`, 'up')
    add('Resting heart rate', find('rhr'), 'bpm', (v) => `${Math.round(v)} bpm`, 'down')
    add('Daily spending', find('spend'), '₹', (v) => FMT.money(Math.round(v * 100)), 'down')
    add('Discretionary spending', find('discretionary'), '₹', (v) => FMT.money(Math.round(v * 100)), 'down')
    return rows
  },

  /* Flat CSV of every daily series, for export. */
  exportCsv() {
    const cat = ASEL.catalogue()
    const dates = new Set()
    for (const s of cat) for (const p of s.points) dates.add(p.date)
    const ordered = [...dates].sort()
    const header = ['date', ...cat.map((s) => `${s.key} (${s.unit})`)].join(',')
    const lines = ordered.map((date) =>
      [date, ...cat.map((s) => {
        const hit = s.points.find((p) => p.date === date)
        // Blank, not zero. A day with no reading is not a day with a reading
        // of nothing, and any tool consuming this must be able to tell.
        return hit ? hit.value : ''
      })].join(','))
    return [header, ...lines].join('\n')
  },
}

const ANALYTICS_TABS = {}

/* ── Overview ─────────────────────────────────────────────────────────── */
ANALYTICS_TABS.overview = function () {
  const cat = ASEL.catalogue()
  const days = ASEL.rangeDays()

  const trendCard = (key, fmt, betterWhen) => {
    const s = cat.find((c) => c.key === key)
    const trend = ACALC.linearTrend(s.points)
    if (!isOk(trend)) {
      return statCard(s.label, `<span class="t-fig fig faint">—</span>`, trend.reason)
    }
    const t = trend.value
    const improving = betterWhen === 'up' ? t.direction === 'rising' : t.direction === 'falling'
    const tone = t.direction === 'flat' ? '' : improving ? 'pos' : 'cau'
    return statCard(s.label,
      `<span class="t-fig fig ${tone}">${fmt(t.totalChange, true)}</span>`,
      `over ${t.spanDays} days · ${t.n} readings · fit ${Math.round(t.rSquared * 100)}%`)
  }

  const coverage = cat.map((s) => ({ label: s.label, n: s.points.length, domain: s.domain }))
    .sort((a, b) => b.n - a.n)

  return `<div class="stack">
    <div class="rail">
      ${trendCard('weight', (v) => FMT.delta(v, ' kg', 1), 'up')}
      ${trendCard('volume', (v) => FMT.delta(v / 1000, 'k kg', 1), 'up')}
      ${trendCard('sleepDur', (v) => FMT.delta(v, ' h', 1), 'up')}
      ${trendCard('rhr', (v) => FMT.delta(v, ' bpm', 1), 'down')}
      ${trendCard('protein', (v) => FMT.delta(v, ' g', 0), 'up')}
      ${trendCard('spend', (v) => FMT.delta(v, '/day', 0), 'down')}
    </div>
    <p class="t-micro faint" style="padding:0 0.125rem">
      Each figure is the total change implied by a straight line through the readings,
      not first-versus-last. "Fit" is how much of the variation that line explains —
      a low fit means the direction is real but noisy.
    </p>

    <section>
      ${sectionHead('Scores over time')}
      <div class="card card-pad" style="margin-top:0.5rem">
        ${(() => {
          const scores = [
            ['Fitness', SEL.fitnessScore()], ['Nutrition', SEL.nutritionScore()],
            ['Habits', SEL.habitScore()], ['Finances', FSEL.disciplineScore()],
            ['Overall', SEL.lifeScore()],
          ]
          return `<div class="stack-s">
            ${scores.map(([label, m]) => `
              <div>
                <div class="row-between" style="margin-bottom:0.25rem">
                  <span class="t-label">${label}</span>
                  <span class="t-label fig semi">${isOk(m) ? m.value.score : '—'}</span>
                </div>
                <div class="bar ${isOk(m) && m.value.score >= 70 ? 'bar-pos' : isOk(m) && m.value.score >= 50 ? 'bar-cau' : 'bar-neg'}">
                  <i style="width:${isOk(m) ? m.value.score : 0}%"></i>
                </div>
              </div>`).join('')}
          </div>`
        })()}
      </div>
    </section>

    <section>
      ${sectionHead('What you are actually logging')}
      <div class="card divide" style="margin-top:0.5rem">
        ${coverage.map((c) => `
          <div class="card-pad row-between">
            <div class="row" style="gap:0.375rem;min-width:0">
              <span class="t-label">${esc(c.label)}</span>
              <span class="badge">${c.domain}</span>
            </div>
            <div class="row" style="gap:0.5rem;flex:none">
              <div class="bar bar-acc" style="width:60px"><i style="width:${(c.n / days) * 100}%"></i></div>
              <span class="t-label fig ${c.n < 14 ? 'cau' : ''}" style="min-width:3.5rem;text-align:right">${c.n}/${days}</span>
            </div>
          </div>`).join('')}
      </div>
      <p class="t-micro faint" style="padding:0.5rem 0.125rem">
        Anything under 14 days is excluded from the relationships screen. This table is
        the honest answer to "why isn't X showing up" — usually because it has not been
        logged enough to say anything about.
      </p>
    </section>

    <section>
      ${sectionHead('Server-computed insights')}
      <div class="card divide" style="margin-top:0.5rem">
        ${STATE_UI.remoteInsights
          ? (STATE_UI.remoteInsights.insights.length
              ? STATE_UI.remoteInsights.insights.map((i) => `
                <div class="card-pad">
                  <div class="t-label semi">${esc(i.title)}</div>
                  <div class="t-micro muted" style="margin-top:0.25rem;line-height:1rem">${esc(i.description)}</div>
                  <div class="t-micro faint" style="margin-top:0.25rem">r = ${i.correlation} · ${i.strength} · n=${i.sampleSize}</div>
                </div>`).join('')
              : `<div class="empty"><h3>No correlations found yet</h3><p>Needs more overlapping days of data in both series.</p></div>`)
          : `<div class="empty"><h3>Loading…</h3></div>`}
      </div>
      <p class="t-micro faint" style="padding:0.5rem 0.125rem">
        Computed server-side from your actual database records — a separate, simpler check
        alongside the client-side statistics above.
      </p>
    </section>
  </div>`
}

/* ── Relationships ────────────────────────────────────────────────────── */
ANALYTICS_TABS.correlations = function () {
  const lag = STATE_UI.analyticsLag || 0
  const matrix = ASEL.matrix()
  const showAll = STATE_UI.showAllPairs

  const lagOptions = [[0, 'Same day'], [1, 'Next day'], [2, 'Two days later']]

  const header = `
    <div class="card card-pad stack-s">
      <div>
        <label class="t-label muted" for="lagSelect">Compare measurements</label>
        <div class="seg" style="margin-top:0.375rem" role="group" aria-label="Time offset">
          ${lagOptions.map(([v, label]) => `
            <button aria-selected="${lag === v}" data-lag="${v}">${label}</button>`).join('')}
        </div>
      </div>
      <p class="t-micro faint" style="line-height:1rem">
        ${lag === 0
          ? 'Both measurements taken on the same day.'
          : `The second measurement is taken ${lag} day${lag === 1 ? '' : 's'} after the first — useful for questions like "does last night's sleep relate to today's training". It still shows association, not cause.`}
      </p>
    </div>`

  if (!isOk(matrix)) {
    return `<div class="stack">${header}
      <div class="card"><div class="empty">
        <h3>Nothing to compare yet</h3>
        <p>${esc(matrix.reason)} ${esc(matrix.needed)}</p>
      </div></div></div>`
  }

  const m = matrix.value
  const significant = m.pairs.filter((p) => p.result.isSignificant)
  const rest = m.pairs.filter((p) => !p.result.isSignificant)
  const crossDomain = significant.filter((p) => p.domainA !== p.domainB)

  const pairRow = (p) => {
    const res = p.result
    const tone = res.direction === 'together' ? 'pos' : 'cau'
    const [lo, hi] = res.confidenceInterval
    // The interval is drawn to scale on a −1…1 axis, so a wide one looks wide.
    const toPct = (v) => ((v + 1) / 2) * 100
    return `<div class="card-pad">
      <div class="row-between" style="margin-bottom:0.375rem">
        <div style="min-width:0">
          <div class="t-label semi">${esc(p.labelA)} <span class="faint">and</span> ${esc(p.labelB)}</div>
          <div class="t-micro faint">
            ${res.n} days · ${res.method === 'spearman' ? 'rank correlation' : 'linear correlation'}
            ${p.domainA !== p.domainB ? ' · cross-domain' : ''}
          </div>
        </div>
        <div style="text-align:right;flex:none">
          <div class="t-body fig semi ${res.isSignificant ? tone : 'faint'}">${res.r > 0 ? '+' : ''}${res.r}</div>
          <div class="t-micro faint">${res.strength}</div>
        </div>
      </div>
      <div style="position:relative;height:18px;margin:0.25rem 0">
        <div style="position:absolute;inset-inline:0;top:8px;height:2px;background:hsl(var(--line))"></div>
        <div style="position:absolute;left:50%;top:3px;width:1px;height:12px;background:hsl(var(--ink-faint));opacity:0.5"></div>
        <div style="position:absolute;top:6px;height:6px;border-radius:3px;background:hsl(var(--${res.isSignificant ? 'accent' : 'ink-faint'}));opacity:${res.isSignificant ? 0.85 : 0.35};left:${toPct(lo)}%;width:${Math.max(1.5, toPct(hi) - toPct(lo))}%"></div>
        <div style="position:absolute;top:3px;width:2px;height:12px;background:hsl(var(--ink));left:${toPct(res.r)}%"></div>
      </div>
      <div class="row-between t-micro faint">
        <span>−1</span>
        <span class="fig">95% CI ${lo} to ${hi} · adjusted p ${res.adjustedPValue}</span>
        <span>+1</span>
      </div>
      ${res.sharedTrend ? `
        <div class="row" style="gap:0.375rem;align-items:flex-start;margin-top:0.375rem;padding:0.5rem;background:hsl(var(--caution) / 0.08);border-radius:0.5rem">
          <span class="cau" style="flex:none;margin-top:1px">${ICON('trend', 13, 2)}</span>
          <span class="t-micro cau" style="line-height:1rem">
            Both of these drifted steadily over the period. Two things that each trend will
            correlate whether or not they are connected — the calendar may be all this shows.
          </span>
        </div>` : ''}
      ${res.isSignificant ? `<p class="t-micro muted" style="margin-top:0.375rem;line-height:1rem">
        ${esc(ACALC.describe(res, p.labelA.toLowerCase(), p.labelB.toLowerCase()))}</p>` : ''}
    </div>`
  }

  return `<div class="stack">
    ${header}

    <!-- The statistics disclosure, deliberately above the findings -->
    <div class="card card-pad" style="border-color:hsl(var(--caution) / 0.4)">
      <div class="row" style="gap:0.5rem;align-items:flex-start">
        <span class="cau" style="flex:none;margin-top:1px">${ICON('info', 15, 2)}</span>
        <div>
          <div class="t-label semi">${m.comparisonsRun} comparisons were run</div>
          <p class="t-micro muted" style="line-height:1rem;margin-top:0.25rem">
            Testing this many pairs at once would throw up roughly
            ${Math.round(m.comparisonsRun * 0.05)} false findings by chance alone. The p-values
            below are adjusted for that, so only ${m.significantCount} survive.
            Everything here is an association between numbers you logged — never a cause.
            Day of the week alone explains a great many of these.
          </p>
        </div>
      </div>
    </div>

    ${crossDomain.length ? `
      <section>
        ${sectionHead(`Across health and money · ${crossDomain.length}`)}
        <p class="t-micro faint" style="padding:0.25rem 0.125rem">
          The relationships that span domains — the reason for keeping both in one place.
        </p>
        <div class="card divide" style="margin-top:0.5rem">${crossDomain.map(pairRow).join('')}</div>
      </section>` : ''}

    <section>
      ${sectionHead(`Held up after correction · ${significant.length}`)}
      <div class="card divide" style="margin-top:0.5rem">
        ${significant.length ? significant.map(pairRow).join('')
          : `<div class="empty">
              <h3>Nothing survived correction</h3>
              <p>Across ${m.comparisonsRun} comparisons, no relationship was strong enough to
                 stand apart from chance. That is a real result, not a failure — most pairs of
                 things genuinely are unrelated.</p>
            </div>`}
      </div>
    </section>

    <section>
      ${sectionHead(`Everything else · ${rest.length}`, showAll ? 'Hide' : 'Show all', 'toggle-pairs')}
      ${showAll ? `<div class="card divide" style="margin-top:0.5rem">${rest.map(pairRow).join('')}</div>` : `
        <p class="t-micro faint" style="padding:0.25rem 0.125rem">
          ${rest.length} comparisons did not hold up. They are hidden by default because
          scanning a long list of near-misses is exactly how people talk themselves into
          patterns that are not there.
        </p>`}
    </section>

    ${(() => {
      // Two quite different reasons for not testing a pair, kept apart.
      // Lumping them together would hide the deliberate exclusions behind a
      // long list of thin data.
      const tautological = m.skipped.filter((s) => s.reason.includes('part of the other'))
      const thin = m.skipped.filter((s) => !s.reason.includes('part of the other'))
      return `
        ${tautological.length ? `
          <section>
            ${sectionHead(`Excluded by design · ${tautological.length}`)}
            <div class="card divide" style="margin-top:0.5rem">
              ${tautological.map((s) => `
                <div class="card-pad">
                  <div class="t-label semi">${esc(s.labelA)} and ${esc(s.labelB)}</div>
                  <div class="t-micro faint" style="line-height:1rem">${esc(s.reason)}</div>
                </div>`).join('')}
            </div>
          </section>` : ''}

        ${thin.length ? `
          <section>
            ${sectionHead(`Not enough overlapping data · ${thin.length}`)}
            <div class="card divide" style="margin-top:0.5rem">
              ${thin.slice(0, 6).map((s) => `
                <div class="card-pad">
                  <div class="t-label">${esc(s.labelA)} and ${esc(s.labelB)}</div>
                  <div class="t-micro faint">${esc(s.reason)}</div>
                </div>`).join('')}
              ${thin.length > 6 ? `<div class="card-pad t-micro faint">
                and ${thin.length - 6} more pairs without enough shared days</div>` : ''}
            </div>
          </section>` : ''}`
    })()}

    <p class="disclaimer">
      These are statistical associations in data you entered, over a short window, without
      any control for confounding factors. They are not medical or financial findings and
      should not be used to make a decision on their own.
    </p>
  </div>`
}

/* ═════════════════════════════════════════════════════════════════════════
   EDITING AND DELETING
   ═════════════════════════════════════════════════════════════════════════
   One mechanism, used by every screen. Building this per-screen is how you
   end up with a delete that confirms in one place and does not in another.

   Rules that hold everywhere:
     · Nothing is ever deleted without an explicit confirmation naming the
       thing being deleted. No bare "Are you sure?".
     · The confirmation says what ELSE changes — removing a weight entry
       moves the trend line, removing an account takes its transactions.
     · Cancel is the default focus. The destructive button is never the one
       your thumb lands on.
     · Every delete is followed by an undo toast. Confirmation prevents
       accidents; undo fixes the ones that get through anyway.
   ═════════════════════════════════════════════════════════════════════════ */

/* Promise-based confirmation. Resolves true only on an explicit tap of the
   destructive button. */
function confirmAction({ title, body, consequence, confirmLabel = 'Delete', destructive = true }) {
  return new Promise((resolve) => {
    el.explainerTitle.textContent = title
    el.explainerBody.innerHTML = `
      <p class="t-label" style="line-height:1.25rem">${esc(body)}</p>
      ${consequence ? `
        <div class="row" style="gap:0.5rem;align-items:flex-start;margin-top:0.75rem;padding:0.625rem;background:hsl(var(--canvas));border-radius:0.625rem">
          <span class="cau" style="flex:none;margin-top:1px">${ICON('info', 14, 2)}</span>
          <span class="t-micro muted" style="line-height:1rem">${esc(consequence)}</span>
        </div>` : ''}
      <div class="row" style="gap:0.5rem;margin-top:1.25rem">
        <button class="btn btn-secondary" style="flex:1" id="confirmCancel">Cancel</button>
        <button class="btn" style="flex:1;background:hsl(var(--${destructive ? 'negative' : 'accent'}));color:white" id="confirmGo">
          ${esc(confirmLabel)}
        </button>
      </div>`

    el.overlay.classList.add('open')
    el.explainer.classList.add('open')

    const cleanup = (result) => {
      document.removeEventListener('keydown', onKey)
      closeExplainer()
      resolve(result)
    }
    const onKey = (e) => { if (e.key === 'Escape') cleanup(false) }

    document.addEventListener('keydown', onKey)
    document.getElementById('confirmCancel').addEventListener('click', () => cleanup(false))
    document.getElementById('confirmGo').addEventListener('click', () => cleanup(true))

    // Cancel takes focus, so Enter or a stray tap is always the safe outcome.
    setTimeout(() => document.getElementById('confirmCancel').focus(), 60)
  })
}

/* One registry describing how every deletable thing is found, described and
   removed. Adding a new entity type means adding one entry here rather than
   scattering delete logic through the views. */
const DELETABLE = {
  weight: {
    label: 'weight entry',
    find: (id) => S.weights.find((w) => w.date === id),
    describe: (w) => `${FMT.weight(w.kg)} recorded on ${FMT.date(w.date)}`,
    consequence: 'Your weight trend and the 7-day average will be recalculated without it.',
    remove: (id) => {
      const idx = S.weights.findIndex((w) => w.date === id)
      const removed = S.weights[idx]
      S.weights.splice(idx, 1)
      return () => S.weights.splice(idx, 0, removed)
    },
  },
  meal: {
    label: 'meal',
    find: (id) => S.meals.find((m) => m.id === id),
    describe: (m) => `${esc(m.label)} · ${FMT.num(m.calories)} kcal, ${m.protein} g protein`,
    consequence: 'Today\u2019s calorie and protein totals and your nutrition score will change.',
    remove: (id) => {
      const idx = S.meals.findIndex((m) => m.id === id)
      const removed = S.meals[idx]
      S.meals.splice(idx, 1)
      return () => S.meals.splice(idx, 0, removed)
    },
  },
  sleep: {
    label: 'sleep record',
    find: (id) => S.sleep.find((x) => x.date === id),
    describe: (x) => `${FMT.duration(x.durationMinutes)} on ${FMT.date(x.date)}`,
    consequence: 'Your sleep averages and recovery indicator will be recalculated.',
    remove: (id) => {
      const idx = S.sleep.findIndex((x) => x.date === id)
      const removed = S.sleep[idx]
      S.sleep.splice(idx, 1)
      return () => S.sleep.splice(idx, 0, removed)
    },
  },
  measurement: {
    label: 'measurement',
    find: (id) => S.measurements.find((m) => `${m.date}|${esc(m.site)}` === id),
    describe: (m) => `${esc(m.site.replace('_', ' '))} · ${FMT.length(m.value)} on ${FMT.date(m.date)}`,
    remove: (id) => {
      const idx = S.measurements.findIndex((m) => `${m.date}|${esc(m.site)}` === id)
      const removed = S.measurements[idx]
      S.measurements.splice(idx, 1)
      return () => S.measurements.splice(idx, 0, removed)
    },
  },
  vital: {
    label: 'reading',
    find: (id) => S.vitals.find((v) => `${v.date}|${v.kind}` === id),
    describe: (v) => v.kind === 'blood_pressure'
      ? `${v.systolic}/${v.diastolic} on ${FMT.date(v.date)}`
      : `${v.value} on ${FMT.date(v.date)}`,
    remove: (id) => {
      const idx = S.vitals.findIndex((v) => `${v.date}|${v.kind}` === id)
      const removed = S.vitals[idx]
      S.vitals.splice(idx, 1)
      return () => S.vitals.splice(idx, 0, removed)
    },
  },
  session: {
    label: 'workout',
    find: (id) => S.sessions.find((x) => x.id === id),
    describe: (x) => `${esc(x.title)} on ${FMT.date(x.date)}`,
    consequence: 'Training volume, adherence and any personal bests set in this session will be recalculated.',
    remove: (id) => {
      const idx = S.sessions.findIndex((x) => x.id === id)
      const removed = S.sessions[idx]
      S.sessions.splice(idx, 1)
      return () => S.sessions.splice(idx, 0, removed)
    },
  },
  habit: {
    label: 'habit',
    find: (id) => S.habits.find((h) => h.id === id),
    describe: (h) => `${esc(h.name)}`,
    consequence: 'Its entire history and streak are removed too. This cannot be recovered after you leave this screen.',
    remove: (id) => {
      const idx = S.habits.findIndex((h) => h.id === id)
      const removed = S.habits[idx]
      const logs = S.habitLogs[id]
      S.habits.splice(idx, 1)
      delete S.habitLogs[id]
      return () => { S.habits.splice(idx, 0, removed); S.habitLogs[id] = logs }
    },
  },
  transaction: {
    label: 'transaction',
    find: (id) => S.finance.transactions.find((t) => t.id === id),
    describe: (t) => `${esc(t.merchant)} · ${FMT.money(t.amountPaise)} on ${FMT.date(t.date)}`,
    consequence: 'The account balance is adjusted back and your budgets recalculated.',
    remove: (id) => {
      const idx = S.finance.transactions.findIndex((t) => t.id === id)
      const removed = S.finance.transactions[idx]
      S.finance.transactions.splice(idx, 1)
      const acc = S.finance.accounts.find((a) => a.id === removed.accountId)
      if (acc && removed.direction === 'expense') acc.balancePaise += removed.amountPaise
      if (acc && removed.direction === 'income') acc.balancePaise -= removed.amountPaise
      return () => {
        S.finance.transactions.splice(idx, 0, removed)
        if (acc && removed.direction === 'expense') acc.balancePaise -= removed.amountPaise
        if (acc && removed.direction === 'income') acc.balancePaise += removed.amountPaise
      }
    },
  },
  account: {
    label: 'account',
    find: (id) => S.finance.accounts.find((a) => a.id === id),
    describe: (a) => `${esc(a.name)}${a.masked ? ` ····${a.masked}` : ''} · balance ${FMT.money(a.balancePaise)}`,
    /* Counts dependents before asking, so the warning is specific rather
       than a generic "this may affect other data". */
    consequence: (a) => {
      const n = S.finance.transactions.filter((t) => t.accountId === a.id).length
      return n > 0
        ? `${n} transactions are recorded against this account. They will be removed as well, and your spending history will change.`
        : 'No transactions are recorded against this account.'
    },
    remove: (id) => {
      const idx = S.finance.accounts.findIndex((a) => a.id === id)
      const removed = S.finance.accounts[idx]
      const txns = S.finance.transactions.filter((t) => t.accountId === id)
      S.finance.accounts.splice(idx, 1)
      S.finance.transactions = S.finance.transactions.filter((t) => t.accountId !== id)
      return () => { S.finance.accounts.splice(idx, 0, removed); S.finance.transactions.push(...txns) }
    },
  },
  debt: {
    label: 'loan',
    find: (id) => S.finance.debts.find((d) => d.id === id),
    describe: (d) => `${esc(d.name)} from ${esc(d.lender)}`,
    consequence: 'Your debt-to-income ratio, payoff simulations and net worth will all change.',
    remove: (id) => {
      const idx = S.finance.debts.findIndex((d) => d.id === id)
      const removed = S.finance.debts[idx]
      S.finance.debts.splice(idx, 1)
      return () => S.finance.debts.splice(idx, 0, removed)
    },
  },
  investment: {
    label: 'holding',
    find: (id) => S.finance.investments.find((i) => i.id === id),
    describe: (i) => `${esc(i.name)} · ${FMT.money(Math.round(i.units * i.currentNavPaise))}`,
    consequence: 'Portfolio value, XIRR and net worth will be recalculated.',
    remove: (id) => {
      const idx = S.finance.investments.findIndex((i) => i.id === id)
      const removed = S.finance.investments[idx]
      S.finance.investments.splice(idx, 1)
      return () => S.finance.investments.splice(idx, 0, removed)
    },
  },
  goal: {
    label: 'goal',
    find: (id) => S.finance.goals.find((g) => g.id === id),
    describe: (g) => `${esc(g.name)} · ${FMT.money(g.savedPaise)} of ${FMT.money(g.targetPaise)} saved`,
    consequence: 'The money itself is not touched — only the goal that was tracking it.',
    remove: (id) => {
      const idx = S.finance.goals.findIndex((g) => g.id === id)
      const removed = S.finance.goals[idx]
      S.finance.goals.splice(idx, 1)
      return () => S.finance.goals.splice(idx, 0, removed)
    },
  },
  subscription: {
    label: 'subscription',
    find: (id) => S.finance.subscriptions.find((x) => x.id === id),
    describe: (x) => `${esc(x.name)} · ${FMT.money(x.amountPaise)} ${x.recurrence}`,
    consequence: 'This only stops tracking it here. You still need to cancel it with the provider.',
    remove: (id) => {
      const idx = S.finance.subscriptions.findIndex((x) => x.id === id)
      const removed = S.finance.subscriptions[idx]
      S.finance.subscriptions.splice(idx, 1)
      return () => S.finance.subscriptions.splice(idx, 0, removed)
    },
  },
  bill: {
    label: 'bill',
    find: (id) => S.finance.bills.find((b) => b.id === id),
    describe: (b) => `${esc(b.name)} · ${FMT.money(b.amountPaise)} on the ${b.dueDay}th`,
    remove: (id) => {
      const idx = S.finance.bills.findIndex((b) => b.id === id)
      const removed = S.finance.bills[idx]
      S.finance.bills.splice(idx, 1)
      return () => S.finance.bills.splice(idx, 0, removed)
    },
  },
  medication: {
    label: 'item',
    find: (id) => S.medications.find((m) => m.id === id),
    describe: (m) => `${esc(m.name)} · ${esc(m.dosage)}`,
    remove: (id) => {
      const idx = S.medications.findIndex((m) => m.id === id)
      const removed = S.medications[idx]
      S.medications.splice(idx, 1)
      return () => S.medications.splice(idx, 0, removed)
    },
  },
}

            <path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1L5 6"/></svg>

async function deleteItem(kind, id) {
  const spec = DELETABLE[kind]
  const item = spec.find(id)
  if (!item) { toast('That item is no longer available.'); return }

  const consequence = typeof spec.consequence === 'function'
    ? spec.consequence(item)
    : spec.consequence

  closeSheet()
  const confirmed = await confirmAction({
    title: `Delete this ${spec.label}?`,
    body: spec.describe(item),
    consequence,
    confirmLabel: `Delete ${spec.label}`,
  })
  if (!confirmed) return

  const endpoint = {
    weight: (i) => `/health/weights/${i}`,
    meal: (i) => `/nutrition/meals/${i}`,
    sleep: (i) => `/health/sleep/${i}`,
    measurement: (i) => `/health/measurements/${i}`,
    vital: (i) => `/health/vitals/${i}`,
    session: (i) => `/fitness/sessions/${i}`,
    habit: (i) => `/habits/${i}`,
    transaction: (i) => `/finance/transactions/${i}`,
    account: (i) => `/finance/accounts/${i}`,
    debt: (i) => `/finance/debts/${i}`,
  }[kind]

  if (endpoint) {
    const realId = item.id || id
    toast('Deleting…')
    apiFetch(endpoint(realId), { method: 'DELETE' })
      .then(() => loadAllData())
      .then(() => { render(); toast(`${spec.label.charAt(0).toUpperCase() + spec.label.slice(1)} deleted`) })
      .catch((err) => toast(err.message || 'Could not delete'))
    return
  }

  const undo = spec.remove(id)
  render()
  toast(`${spec.label.charAt(0).toUpperCase() + spec.label.slice(1)} deleted`, () => { undo(); })
}
